<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSTC Admin Login</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --panel: #ffffff;
      --primary: #d62828;
      --primary-dark: #a61b1b;
      --text: #1d2130;
      --muted: #5f6c7b;
      --border: #e6e8ee;
      --success: #2a9d8f;
      --error: #b42318;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .card {
      width: min(92vw, 420px);
      background: var(--panel);
      border-radius: 18px;
      padding: 32px 26px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--primary);
    }

    .brand small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
    }

    input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(214, 40, 40, 0.12);
    }

    button {
      margin-top: 8px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .message {
      min-height: 20px;
      margin-top: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
    }

    .message.error {
      display: block;
      color: var(--error);
    }

    .message.success {
      display: block;
      color: var(--success);
    }

    .helper {
      margin-top: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .helper a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>SSTC</h1>
      <small>Secure Admin Login</small>
    </div>

    <form id="loginForm">
      <label>
        Username
        <input id="username" name="username" type="text" placeholder="Enter admin username" required />
      </label>

      <label>
        Password
        <input id="password" name="password" type="password" placeholder="Enter admin password" required />
      </label>

      <button type="submit">Login</button>
      <div id="message" class="message"></div>
    </form>

    <div class="helper">
      <a href="index.html">Back to home</a>
    </div>
  </div>

  <script src="admin-login.js"></script>
</body>
</html>
