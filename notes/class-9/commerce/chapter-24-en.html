{id:"s1",nav:"1 Meaning",title:"1. Introduction – What is Economics?",html:`
<div class="def"><p><span class="key">Word origin:</span> The word <b>Economics</b> comes from the Greek word <b>"Oikonomia"</b>. <i>Oikos</i> = household, <i>Nomos</i> = management. So the original meaning is <span class="hl">management of a household</span>. Today it means management of the whole nation's resources.</p></div>
<p><span class="key">Simple meaning:</span> Economics is the study of how people, families, firms and the government use <span class="hl">limited resources</span> to satisfy their <span class="hl">unlimited wants</span>.</p>
<h3>Think of it like this</h3>
<ul><li>You get ₹100 pocket money. You want a pizza, a book, a movie ticket and a pen. You can't buy all. You must <b>choose</b>. This act of choosing is economics!</li>
<li>A mother has a fixed monthly budget. She decides what to buy first (rice, school fees, medicine). That is economics at home.</li>
<li>The government has limited money. It decides: build a school, a hospital or a road? That is economics at national level.</li></ul>
<h3>Two main branches</h3>
<table><tr><th>Micro Economics</th><th>Macro Economics</th></tr>
<tr><td>Study of <b>individual</b> units: one consumer, one firm, one product's price.</td><td>Study of the <b>whole economy</b>: national income, total employment, inflation, GDP.</td></tr>
<tr><td>Example: Why does the price of mangoes fall in summer?</td><td>Example: Why is inflation rising in the country?</td></tr></table>
<div class="note"><p>📝 Remember: Micro = small (individual). Macro = large (whole economy).</p></div>`},
{id:"s2",nav:"2 Definitions",title:"2. Definitions of Economics",html:`
<table><tr><th>Economist</th><th>Book / Year</th><th>Definition (in simple words)</th><th>Focus</th></tr>
<tr><td><b>Adam Smith</b><br>(Father of Economics)</td><td>Wealth of Nations, 1776</td><td>Economics is the science of <b>wealth</b>: how a nation becomes rich.</td><td>Wealth</td></tr>
<tr><td><b>Alfred Marshall</b></td><td>Principles of Economics, 1890</td><td>Economics studies mankind in the ordinary business of life. It examines the part of individual and social action that is closely connected with attaining and using the material requisites of <b>well-being (welfare)</b>.</td><td>Welfare</td></tr>
<tr><td><b>Lionel Robbins</b></td><td>Nature and Significance of Economic Science, 1932</td><td>Economics is the science that studies human behaviour as a relationship between <b>unlimited ends (wants)</b> and <b>scarce means</b> which have alternative uses.</td><td>Scarcity and choice</td></tr>
<tr><td><b>Paul Samuelson</b></td><td>Economics, 1948</td><td>Economics studies how society chooses, with or without money, to use scarce resources to produce goods and distribute them for consumption now and in the <b>future</b>.</td><td>Growth</td></tr></table>
<h3>Four features of Robbins' definition</h3>
<ol><li><b>Unlimited wants</b> – human desires never end.</li><li><b>Limited (scarce) means</b> – money, land, time are limited.</li><li><b>Alternative uses</b> – one resource can be used in many ways (land for wheat or sugarcane).</li><li><b>Choice</b> – hence we must choose what to satisfy first.</li></ol>
<div class="tip"><p>💡 Criticism: Smith's definition ignores human welfare and treats man as a money-seeker. Marshall's ignores non-material things (a teacher's service) and is narrow. Robbins' is wider but gives no place to welfare and growth. So today we use all of them together.</p></div>`},
{id:"s3",nav:"3 Basics",title:"3. Basic Concepts: Wants, Scarcity, Choice and Opportunity Cost",html:`
<ul><li><span class="key">Want:</span> desire for goods or services (a bicycle, new shoes). Wants are unlimited and keep changing.</li>
<li><span class="key">Resources:</span> land, labour, capital and enterprise (organisation). They are <b>limited</b>.</li>
<li><span class="key">Scarcity:</span> resources are fewer than wants. Scarcity is the <span class="hl">root of every economic problem</span>.</li>
<li><span class="key">Choice:</span> because of scarcity we must select some wants and leave others.</li>
<li><span class="key">Opportunity cost:</span> the value of the <b>next best alternative given up</b>.</li></ul>
<div class="def"><p><b>Example:</b> A farmer's field can grow wheat (profit ₹40,000) or sugarcane (profit ₹55,000). If he grows sugarcane, the opportunity cost is ₹40,000 (wheat given up).</p></div>
[[F2]]
<p>Now see the same idea as a picture of production choices:</p>
[[F4]]`},
{id:"s4",nav:"4 Advantages",title:"4. Advantages (Importance) of Studying Economics – Complete List",html:`
<p>Why do we study economics? Because it is useful in <span class="hl">every part of life</span>. Here are all the advantages with explanation.</p>
[[F1]]
<h3>1. Helps in making wise choices</h3><p>Economics teaches us to compare cost and benefit before deciding. A student who understands opportunity cost spends time and money wisely.</p>
<h3>2. Understanding of the economic problems</h3><p>It explains what to produce, how to produce and for whom to produce, so that scarce resources are not wasted.</p>
<h3>3. Guidance for consumers</h3><p>A consumer learns budgeting, comparing prices, saving, and getting maximum satisfaction from limited income. Knowledge of consumer rights protects from cheating.</p>
<h3>4. Guidance for producers</h3><p>Producers learn about demand, cost, price and profit. They decide the quantity to produce and the best mix of land, labour and capital to reduce cost.</p>
<h3>5. Guidance for workers</h3><p>Workers understand wages, employment, trade unions and the value of skill and training, and so can bargain for fair wages.</p>
<h3>6. Guidance for farmers</h3><p>Farmers learn about support price (MSP), credit, crop choice, cooperative marketing and the effect of prices on their income.</p>
<h3>7. Guidance for businessmen and traders</h3><p>It helps in forecasting demand, fixing prices, controlling stock and understanding banks, tax and trade.</p>
<h3>8. Helps the government and policy makers</h3><p>Taxes, subsidies, budget, price control and welfare schemes are framed using economic knowledge.</p>
<h3>9. Helps in economic planning and development</h3><p>Planning needs data on resources, population, saving and investment. Economics supplies the method. India used Five Year Plans and now has NITI Aayog (which replaced the Planning Commission in 2015).</p>
<h3>10. Solves national problems</h3><p>Poverty, unemployment, inflation, population growth and inequality of income can only be understood and tackled with economic knowledge.</p>
<h3>11. Understanding money, banking and finance</h3><p>Role of RBI, banks, interest, loans, insurance, UPI and inflation become clear.</p>
<h3>12. Understanding international trade</h3><p>Why countries import and export, exchange rates, and why we buy foreign goods are explained by economics.</p>
<h3>13. Makes a good and responsible citizen</h3><p>A citizen understands budgets, taxes (GST, income tax), subsidies, and can judge the government's economic policies and vote wisely.</p>
<h3>14. Develops logical and analytical thinking</h3><p>It trains the mind to use data, graphs and reasoning. It is the base for careers in commerce, banking, CA, civil services, business and teaching.</p>
<h3>15. Improves social welfare</h3><p>It shows how to reduce income inequality and raise the standard of living, so that more people enjoy a good life.</p>
<div class="note"><p>📝 Memory trick: "C-P-W-F-G-N" = Consumer, Producer, Worker, Farmer, Government, Nation.</p></div>`},
{id:"s5",nav:"5 Consumers",title:"5. Importance for Consumers (with Law of Demand)",html:`
<p>A consumer has limited income. Economics teaches him to get <span class="hl">maximum satisfaction (utility)</span> from it.</p>
<ul><li>Making a monthly <b>budget</b> and avoiding wasteful spending.</li><li>Comparing prices and quality (<i>value for money</i>).</li><li>Understanding <b>why prices change</b> (demand and supply).</li><li>Saving and investing for the future.</li><li>Knowing consumer rights, MRP and bills.</li></ul>
<div class="def"><p><span class="key">Law of Demand:</span> Other things remaining the same, when the price of a commodity <b>falls</b>, its quantity demanded <b>rises</b>, and when the price <b>rises</b>, the quantity demanded <b>falls</b>. So price and demand move in <b>opposite directions</b> (inverse relationship).</p></div>
<table><tr><th>Price per kg (₹)</th><th>Quantity demanded (kg)</th></tr><tr><td>50</td><td>10</td></tr><tr><td>40</td><td>20</td></tr><tr><td>30</td><td>30</td></tr><tr><td>20</td><td>40</td></tr></table>
[[F5]]
<div class="tip"><p>Reasons for the law: (1) Law of diminishing marginal utility, (2) Income effect, (3) Substitution effect, (4) New buyers enter at a lower price.</p></div>`},
{id:"s6",nav:"6 Producers & others",title:"6. Importance for Producers, Workers, Farmers and Traders",html:`
<table><tr><th>Group</th><th>How economics helps</th><th>Example</th></tr>
<tr><td><b>Producer / firm</b></td><td>Decides what, how much and how to produce; cost control; pricing; profit planning.</td><td>A shoe factory studies demand and chooses to make 500 pairs, not 5000.</td></tr>
<tr><td><b>Worker / labourer</b></td><td>Understands wages, productivity, skill, unions, social security.</td><td>A skilled worker demands a higher wage than an unskilled one.</td></tr>
<tr><td><b>Farmer</b></td><td>Crop choice, MSP, credit, storage, marketing, cooperative societies.</td><td>Selling wheat at MSP rather than to a middleman at a low rate.</td></tr>
<tr><td><b>Trader / businessman</b></td><td>Stock management, price fixing, understanding competition, bank loans.</td><td>A shopkeeper stocks woollens in winter and fans in summer.</td></tr>
<tr><td><b>Banker / investor</b></td><td>Interest rates, risk, return, saving schemes.</td><td>Choosing between FD, PPF and shares.</td></tr></table>
<h3>Four factors of production and their rewards</h3>
<table><tr><th>Factor</th><th>Reward</th></tr><tr><td>Land</td><td>Rent</td></tr><tr><td>Labour</td><td>Wages</td></tr><tr><td>Capital</td><td>Interest</td></tr><tr><td>Entrepreneur</td><td>Profit</td></tr></table>`},
{id:"s7",nav:"7 Government",title:"7. Importance for Government, Planning and the Nation",html:`
<ul><li><b>Taxation:</b> Government decides income tax, GST, customs duty so that it earns revenue fairly.</li>
<li><b>Budget:</b> Planning income and expenditure for a year (education, defence, health, roads).</li>
<li><b>Price control:</b> Fixing MSP and ration (PDS) prices to protect poor people.</li>
<li><b>Employment:</b> Schemes like MGNREGA create jobs for rural workers.</li>
<li><b>Economic planning:</b> Using resources in the best way over years.</li>
<li><b>Welfare:</b> Subsidies, pensions, scholarships and health schemes.</li></ul>
<h3>Circular flow – how money moves in an economy</h3>
<p>The government must understand how <b>households</b> and <b>firms</b> depend on each other. Households give factors of production (land, labour, capital, enterprise) to firms; firms pay rent, wages, interest and profit; households spend this on goods and services produced by firms.</p>
[[F3]]
<div class="note"><p>📝 If the flow stops anywhere (e.g. people stop spending), production, jobs and income fall. Economics helps to keep the flow smooth.</p></div>`},
{id:"s8",nav:"8 Central problems",title:"8. Central Problems of an Economy",html:`
<p>Every country, rich or poor, faces <b>three central problems</b> because of scarcity. Studying economics helps us solve them.</p>
<table><tr><th>Problem</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>1. What to produce?</b></td><td>Which goods and how much: consumer goods or capital goods; wheat or cloth.</td><td>More food grain or more mobile phones?</td></tr>
<tr><td><b>2. How to produce?</b></td><td>Which technique: labour-intensive or capital-intensive.</td><td>Hand-weaving or power-looms?</td></tr>
<tr><td><b>3. For whom to produce?</b></td><td>Who gets the goods: distribution of income among people.</td><td>Luxury cars for the rich or low-cost houses for the poor?</td></tr></table>
<h3>Production Possibility Curve (PPC)</h3>
<p>PPC shows the <b>different combinations of two goods</b> that an economy can produce with its full resources and the best technology. See Figure 4 above for the animated PPC.</p>
<ul><li>Points <b>A, B, C</b> on the curve = full use of resources (efficient).</li><li>Point <b>U</b> inside = resources idle, unemployment, waste.</li><li>Point <b>X</b> outside = not possible with present resources. It can be reached only by growth (more resources or better technology).</li><li>The curve bends outward because the <b>opportunity cost increases</b>: to get more cloth we give up more and more wheat.</li></ul>`},
{id:"s9",nav:"9 Theory & practice",title:"9. Theoretical and Practical Importance",html:`
<table><tr><th>Theoretical (Light-giving) importance</th><th>Practical (Fruit-giving) importance</th></tr>
<tr><td>Increases knowledge and understanding.</td><td>Gives direct benefit in daily life and work.</td></tr>
<tr><td>Explains laws: demand, supply, cost, income.</td><td>Helps in solving poverty, unemployment, inflation.</td></tr>
<tr><td>Builds logical thinking.</td><td>Helps in budgeting, business, planning, policy making.</td></tr>
<tr><td>Basis of other social sciences.</td><td>Career: banker, accountant, economist, CA, IAS.</td></tr></table>
<div class="note"><p>Marshall said economics is both a <b>"light-giving"</b> science (gives knowledge) and a <b>"fruit-giving"</b> science (gives practical benefits).</p></div>
<h3>Is economics a science or an art?</h3>
<ul><li><b>Science:</b> it has a systematic body of knowledge, uses cause and effect and studies facts.</li><li><b>Art:</b> it gives practical advice on how to achieve goals (e.g. how to reduce unemployment).</li><li><b>Conclusion:</b> It is both a social science and an art. It is a <b>social</b> science because it studies human behaviour in society.</li></ul>
<h3>Positive vs. normative economics</h3>
<table><tr><th>Positive</th><th>Normative</th></tr><tr><td>"What is" – facts.</td><td>"What ought to be" – value judgement.</td></tr><tr><td>Example: India's population is over 140 crore.</td><td>Example: Rich people should pay more tax.</td></tr></table>`},
{id:"s10",nav:"10 India",title:"10. Importance in India and Limitations",html:`
<h3>Why economics is very important for India</h3>
<ul><li>India is a <b>developing country</b> with large population, so poverty, unemployment and inequality need serious study.</li><li>Agriculture still employs a large share of people, so farm policies matter.</li><li>Understanding Make in India, Digital India, Start-up India, UPI, GST and financial inclusion needs economic knowledge.</li><li>Helps to raise per-capita income and the standard of living.</li><li>Needed for planning education, health and infrastructure.</li></ul>
<h3>Limitations (weak points)</h3>
<ol><li>It studies human behaviour, which is uncertain, so predictions can be wrong.</li><li>Laws are true only under the "<b>ceteris paribus</b>" (other things remaining equal) condition.</li><li>Controlled laboratory experiments are not possible.</li><li>Economists often disagree with each other.</li><li>It cannot decide moral or political questions.</li></ol>
<h3>Quick Revision Points ✍</h3>
<ul><li>Economics = study of choice under scarcity.</li><li>Father of economics = Adam Smith (1776).</li><li>Importance for: consumer, producer, worker, farmer, trader, government, nation.</li><li>Three central problems: What, How, For whom.</li><li>Opportunity cost = next best alternative lost.</li><li>PPC: A, B, C efficient; U idle; X impossible.</li><li>Economics is both science and art.</li></ul>`}
];

{lv:"easy",t:"Opportunity cost of a farmer's choice",g:"Wheat profit = ₹40,000; sugarcane profit = ₹55,000 from the same field.",f:"The best choice, its opportunity cost and net gain.",s:["Compare both profits: 55,000 > 40,000, so sugarcane is better.","Opportunity cost of choosing sugarcane = value of the next best option given up = wheat profit = ₹40,000.","Net gain from the choice = 55,000 − 40,000 = ₹15,000."],a:"Grow sugarcane. Opportunity cost = ₹40,000; extra gain = ₹15,000."},
{lv:"easy",t:"Per capita income",g:"National income = ₹5,40,000 crore (assumed); population = 120 crore.",f:"Per capita income.",s:["Formula: Per capita income = National income ÷ Population.","Put values: 5,40,000 ÷ 120.","5,40,000 ÷ 120 = 4,500."],a:"Per capita income = ₹4,500 per year (assumed figures)."},
{lv:"easy",t:"Consumer's budget",g:"Income ₹3,000; price of rice ₹30/kg; price of pulses ₹100/kg.",f:"(a) Maximum rice. (b) Maximum pulses. (c) Pulses if 40 kg rice is bought.",s:["(a) Max rice = 3,000 ÷ 30 = 100 kg.","(b) Max pulses = 3,000 ÷ 100 = 30 kg.","(c) Spend on 40 kg rice = 40 × 30 = ₹1,200.","Remaining money = 3,000 − 1,200 = ₹1,800.","Pulses = 1,800 ÷ 100 = 18 kg."],a:"(a) 100 kg (b) 30 kg (c) 18 kg."},
{lv:"easy",t:"Percentage change in price",g:"Price of a notebook rises from ₹40 to ₹50.",f:"Percentage increase.",s:["Change in price = 50 − 40 = ₹10.","% change = (Change ÷ Original) × 100.","= (10 ÷ 40) × 100 = 25."],a:"Price rose by 25%."},
{lv:"med",t:"Demand schedule and total expenditure",g:"Price: ₹50, 40, 30, 20; Quantity: 10, 20, 30, 40 kg.",f:"Total expenditure at each price and verify the law of demand.",s:["Total expenditure = Price × Quantity.","At ₹50: 50 × 10 = ₹500.","At ₹40: 40 × 20 = ₹800.","At ₹30: 30 × 30 = ₹900.","At ₹20: 20 × 40 = ₹800.","As price falls from 50 to 20, quantity rises from 10 to 40: opposite direction."],a:"Expenditure: 500, 800, 900, 800. Quantity rises as price falls, so the law of demand holds."},
{lv:"med",t:"PPC and increasing opportunity cost",g:"Combination (Cloth, Wheat): A(0,15), B(1,14), C(2,12), D(3,9), E(4,5), F(5,0).",f:"Opportunity cost of each extra unit of cloth.",s:["A→B: wheat falls 15−14 = 1, for 1 cloth → cost 1 wheat.","B→C: 14−12 = 2 wheat for 1 cloth.","C→D: 12−9 = 3 wheat.","D→E: 9−5 = 4 wheat.","E→F: 5−0 = 5 wheat.","Cost sequence 1, 2, 3, 4, 5 is rising."],a:"Opportunity cost rises (1,2,3,4,5 wheat per cloth), so the PPC bends outward (concave)."},
{lv:"med",t:"Real income and inflation",g:"Money income ₹20,000. Price index rises from 100 to 125.",f:"Real income and the fall in purchasing power.",s:["Real income = (Money income ÷ Price index) × 100.","= (20,000 ÷ 125) × 100 = ₹16,000.","Fall = 20,000 − 16,000 = ₹4,000.","% fall = (4,000 ÷ 20,000) × 100 = 20%."],a:"Real income = ₹16,000; purchasing power fell by 20%. This is why a consumer must understand inflation."},
{lv:"med",t:"Cost–benefit choice by government",g:"Project A: cost 80 cr, benefit 100 cr. Project B: cost 120 cr, benefit 130 cr. Project C: cost 50 cr, benefit 70 cr. Budget = 130 crore.",f:"Best projects within the budget.",s:["Net benefit = Benefit − Cost: A = 20, B = 10, C = 20 crore.","Benefit–cost ratio: A = 100/80 = 1.25, B = 130/120 ≈ 1.08, C = 70/50 = 1.4.","B is weakest. Try combinations within 130 crore: A + C costs 80 + 50 = 130 crore, net benefit = 20 + 20 = 40 crore.","B alone costs 120 crore with net benefit only 10 crore."],a:"Select A and C: total cost 130 crore, net benefit 40 crore. This is how economics helps policy makers."},
{lv:"hard",t:"Price elasticity of demand (simple)",g:"Price rises from ₹20 to ₹25; quantity demanded falls from 100 to 80 units.",f:"Price elasticity of demand (Ed).",s:["% change in price = (25 − 20) ÷ 20 × 100 = 25%.","% change in quantity = (80 − 100) ÷ 100 × 100 = −20%.","Ed = % change in quantity ÷ % change in price = −20 ÷ 25 = −0.8.","Ignoring the sign, |Ed| = 0.8, which is less than 1."],a:"|Ed| = 0.8, so demand is inelastic: quantity changes less than price."},
{lv:"hard",t:"Growth of national income",g:"GDP = ₹200 lakh crore; growth rate 6% per year.",f:"GDP after 2 years.",s:["Year 1: 200 × 1.06 = 212 lakh crore.","Year 2: 212 × 1.06 = 224.72 lakh crore.","Total increase = 224.72 − 200 = 24.72 lakh crore.","Check: 200 × (1.06)² = 200 × 1.1236 = 224.72."],a:"GDP after 2 years = ₹224.72 lakh crore (rise of 12.36%)."},
{lv:"hard",kind:"proof",t:"Proof of the law of demand using marginal utility",g:"Marginal utility (MU) of mangoes (in ₹ the consumer is willing to pay): 1st = 20, 2nd = 16, 3rd = 12, 4th = 8, 5th = 4.",f:"A consumer buys more when the price falls (inverse relation).",s:["A rational consumer buys a unit only if MU ≥ price.","At price ₹20: only the 1st mango (MU 20) qualifies → quantity = 1.","At price ₹16: 1st and 2nd qualify → quantity = 2.","At price ₹12: 3 mangoes. At ₹8: 4 mangoes. At ₹4: 5 mangoes.","Price: 20 → 16 → 12 → 8 → 4 and quantity: 1 → 2 → 3 → 4 → 5."],a:"Quantity demanded rises as price falls (because MU diminishes with each extra unit). Hence the law of demand is proved."},
{lv:"hard",t:"Consumer surplus",g:"A buyer's maximum willingness to pay for 5 units: ₹50, 40, 30, 20, 10. Market price = ₹30.",f:"Number of units bought and consumer surplus.",s:["Buy a unit only if willingness ≥ price (30). Units with 50, 40 and 30 qualify → 3 units.","Surplus on 1st unit = 50 − 30 = 20.","Surplus on 2nd = 40 − 30 = 10.","Surplus on 3rd = 30 − 30 = 0.","Total consumer surplus = 20 + 10 + 0 = ₹30."],a:"He buys 3 units and enjoys a consumer surplus of ₹30 (extra satisfaction from knowing the market)."}
];

A("A. Very Short Answer Questions (1 mark)",0,'qa',[
["Who is called the 'Father of Economics'?","Adam Smith."],
["Which famous book did Adam Smith write?","'An Inquiry into the Nature and Causes of the Wealth of Nations' (1776)."],
["Who wrote 'Principles of Economics' (1890)?","Alfred Marshall."],
["Who gave the scarcity definition of economics?","Lionel Robbins (1932)."],
["From which language does the word 'economics' come?","From the Greek word <i>Oikonomia</i> (oikos = house, nomos = management)."],
["What is scarcity?","Scarcity means that resources are limited compared with human wants."],
["What is opportunity cost?","The value of the next best alternative given up when a choice is made."],
["Name the two branches of economics.","Micro economics and Macro economics."],
["What is a want?","A desire for goods or services that a person wishes to satisfy."],
["Who is a consumer?","A person who uses goods and services to satisfy his wants."],
["Who is a producer?","A person or firm that produces goods and services."],
["Name the three central problems of an economy.","What to produce, how to produce and for whom to produce."],
["What does PPC stand for?","Production Possibility Curve."],
["What is per capita income?","National income divided by the total population."],
["Name the four factors of production.","Land, labour, capital and entrepreneur."],
["What is the reward of labour?","Wages."],
["What is the reward of capital?","Interest."],
["Which institution replaced the Planning Commission in India?","NITI Aayog (2015)."],
["What is MSP?","Minimum Support Price: the price at which the government buys certain crops from farmers."],
["Is economics a social science?","Yes, because it studies human behaviour in society."]]);
A("B. Short Answer Questions (2–3 marks)",0,'qa',[
["What is economics? Explain in simple words.","Economics is the study of how people use <b>limited resources</b> to satisfy <b>unlimited wants</b>. Since we cannot have everything, we have to make choices. Economics studies these choices made by individuals, firms and government."],
["Why should every student study economics?","(1) It teaches wise spending and saving. (2) It helps to understand the news about prices, taxes and budget. (3) It builds logical thinking. (4) It opens careers in commerce, banking, CA and civil services."],
["How is the study of economics useful to a consumer?","It teaches budgeting, comparing prices and quality, avoiding waste, saving, and knowing consumer rights. The consumer gets maximum satisfaction from limited income."],
["How is economics useful to a producer?","A producer learns about demand, costs, prices and profit. He decides what and how much to produce and uses the cheapest combination of factors, thus avoiding loss."],
["How does economics help farmers?","Farmers learn to choose crops, use credit and cooperative societies, understand MSP, storage and marketing, and so get better income."],
["How does economics help workers?","Workers understand wages, productivity, importance of skills, unions and social security. This helps them to ask for fair wages and improve their living."],
["Explain the importance of economics to the government.","The government uses economic knowledge to prepare the budget, fix taxes and subsidies, control prices, create employment and make welfare schemes."],
["How does economics help in planning?","Planning needs a study of resources, population, savings and investment. Economics tells how to use scarce resources best for faster development."],
["How does economics help to solve poverty and unemployment?","It finds the causes (low income, low skills, population growth), and suggests solutions such as education, industry, employment schemes and equal distribution of income."],
["Differentiate between a want and a need.","A <b>need</b> is essential for survival (food, clothing, shelter). A <b>want</b> is a desire which is not essential (a fancy mobile). Needs are limited while wants are unlimited."],
["Why does scarcity arise?","Because human wants are unlimited while resources like land, time and money are limited and have alternative uses."],
["Why is choice necessary?","Because of scarcity we cannot satisfy all wants. So we must choose the most important ones and give up others."],
["Explain opportunity cost with an example.","If you spend 2 hours watching TV instead of studying, the marks you could have earned by studying are the opportunity cost of watching TV."],
["Distinguish between micro and macro economics.","Micro studies individual units such as a consumer or a firm. Macro studies the whole economy such as national income, inflation and employment."],
["Distinguish between positive and normative economics.","Positive economics describes facts (what is). Normative economics gives opinions (what ought to be)."],
["Is economics a science or an art?","It is both. It is a science as it has a systematic knowledge and cause–effect relations, and an art since it gives practical rules to achieve goals."],
["Why is economics called a social science?","Because it studies the behaviour of human beings living in society and not of physical things."],
["What is the importance of economics in international trade?","It explains why countries import and export, exchange rates and trade policy, and helps in earning foreign exchange and gaining from trade."],
["How does economics make us better citizens?","A citizen understands taxes, budget and subsidies, can judge government policies, pays taxes honestly and votes wisely."],
["How does the study of economics help in understanding banking?","It explains the role of banks and the RBI, interest, loans, savings, inflation and digital payments like UPI, so people use money wisely."],
["How does economics help a businessman?","It helps in forecasting demand, deciding price, controlling stock, managing cost and risk, and understanding competition."],
["What is inflation and why must we study it?","Inflation is a continuous rise in the general price level. By studying it we learn how it reduces purchasing power and how it can be controlled."],
["Explain 'What to produce'.","Every economy must decide which goods and how much to produce with scarce resources, such as food grain or mobile phones, consumer goods or capital goods."],
["Explain 'For whom to produce'.","This problem is about distribution: who will receive the goods and services. It depends on income distribution among people."],
["Briefly explain the circular flow of income.","Households give factors of production to firms and get rent, wages, interest and profit. They spend this income on goods and services of firms. So income and expenditure flow in a circle."],
["State two criticisms of Adam Smith's definition.","(1) It gives importance only to wealth and ignores human welfare. (2) It treats man as a wealth-seeker and ignores non-material services."]]);
A("C. Long Answer Questions (5–6 marks)",0,'qa',[
["Explain the advantages (importance) of studying economics.","<ul><li><b>Wise choices:</b> teaches to compare cost and benefit.</li><li><b>Solves economic problems:</b> what, how and for whom to produce.</li><li><b>Consumers:</b> budgeting, saving, rights.</li><li><b>Producers:</b> demand, cost, price and profit decisions.</li><li><b>Workers and farmers:</b> wages, MSP, credit, marketing.</li><li><b>Government:</b> tax, budget, subsidies, welfare.</li><li><b>Planning:</b> best use of resources and faster growth.</li><li><b>National problems:</b> poverty, unemployment, inflation.</li><li><b>International trade and banking</b> understanding.</li><li><b>Citizenship and thinking skills</b>, and career opportunities.</li></ul>"],
["Explain the importance of economics for consumers, producers, workers and the government.","<p><b>Consumer:</b> gets maximum satisfaction from limited income by budgeting and comparison.</p><p><b>Producer:</b> chooses the best mix of land, labour, capital; decides the price and quantity.</p><p><b>Workers:</b> understand wages, skill value and rights.</p><p><b>Government:</b> frames tax, price and employment policies for social welfare.</p><p>Thus every part of society benefits from economic knowledge.</p>"],
["Explain the definitions of economics given by Smith, Marshall and Robbins. Which is the best?","<ul><li><b>Smith:</b> science of wealth. Criticism: ignores welfare.</li><li><b>Marshall:</b> study of mankind in the ordinary business of life, concerned with material welfare. Criticism: ignores non-material services.</li><li><b>Robbins:</b> a science studying behaviour as a relationship between unlimited ends and scarce means with alternative uses. Criticism: ignores welfare and growth.</li></ul><p><b>Conclusion:</b> Robbins' definition is the most scientific and widely accepted, while Samuelson added the growth angle. A modern student uses all of them together.</p>"],
["What are the central problems of an economy? How does economics help to solve them?","<p>Because of scarcity, every economy must solve: <b>(1) What to produce, (2) How to produce, (3) For whom to produce.</b></p><p>Economics gives tools such as the price system, planning, cost-benefit analysis and PPC to select the best output, the best technique and fair distribution. Thus the economy avoids waste and raises welfare.</p>"],
["Explain scarcity, choice and opportunity cost with the help of PPC.","<p>Scarcity: resources are limited, so we cannot make everything. Choice: we pick a combination of goods. Opportunity cost: more of one good means less of the other.</p><p>On the PPC, points on the curve (A, B, C) show full use of resources; a point inside (U) means unemployment; a point outside (X) is not possible now. Moving along the curve from A to B gives more cloth but less wheat, and the lost wheat is the opportunity cost. The curve bends outward because the opportunity cost increases.</p>"],
["Describe the circular flow of income with a diagram.","<p>In a two-sector economy there are households and firms. <b>Real flow:</b> households supply factor services to firms; firms supply goods and services to households. <b>Money flow:</b> firms pay rent, wages, interest and profit to households (factor payments); households pay consumption expenditure to firms.</p><p>Income of households equals expenditure of firms, so the flow is continuous. (Draw Figure 3.)</p>"],
["Why is the study of economics specially important for a developing country like India?","<ul><li>Large population leads to poverty, unemployment and inequality, which need study.</li><li>Agriculture is a major livelihood; farm policy matters.</li><li>Need for planning and capital formation.</li><li>Understanding schemes: GST, UPI, MGNREGA, Make in India.</li><li>Increases per-capita income and improves living standards.</li></ul>"],
["Discuss the theoretical and practical importance of economics.","<p><b>Theoretical (light-giving):</b> increases knowledge, explains laws of demand, supply and cost, builds logical thinking, and is a base for other social sciences.</p><p><b>Practical (fruit-giving):</b> helps in budgeting, business decisions, government policy, planning and solving poverty, unemployment and inflation, and gives career opportunities.</p>"],
["State and explain the law of demand with a schedule and diagram.","<p><b>Law:</b> Other things being equal, quantity demanded rises when price falls and falls when price rises.</p><table><tr><th>Price</th><th>50</th><th>40</th><th>30</th><th>20</th></tr><tr><td>Qty</td><td>10</td><td>20</td><td>30</td><td>40</td></tr></table><p>The demand curve slopes downward (Figure 5). <b>Reasons:</b> diminishing marginal utility, income effect, substitution effect, new buyers. <b>Assumptions:</b> income, tastes and prices of related goods remain constant.</p>"],
["Explain the role of economics in economic planning and development.","<p>Planning means using resources in a planned way to reach goals. Economics provides data on resources, population, saving and investment; fixes targets (growth rate, employment); finds priorities (agriculture, industry, health); and checks results. India used Five Year Plans and now uses NITI Aayog for policy guidance.</p>"],
["Explain micro and macro economics with their importance.","<p><b>Micro:</b> study of individual units; explains price determination, consumer behaviour and firm decisions. <b>Macro:</b> study of the whole economy; explains national income, inflation, unemployment, growth and trade. Micro helps consumers and producers; macro helps governments to frame national policies. Both are complementary.</p>"],
["'Economics is both a science and an art.' Discuss.","<p><b>Science:</b> systematic knowledge, laws like the law of demand, cause–effect relation, use of data. <b>Not a perfect science:</b> human behaviour is uncertain and laws are true only if other things remain equal.</p><p><b>Art:</b> it tells how to attain goals such as controlling inflation. So it is a social science as well as an art.</p>"],
["Explain with ten examples how economics is useful in daily life.","<ol><li>Making a household budget.</li><li>Choosing a cheaper but good product.</li><li>Understanding why vegetable prices change.</li><li>Choosing bank deposit or investment.</li><li>Understanding GST on a bill.</li><li>Using UPI safely.</li><li>Deciding career after school.</li><li>Understanding loan interest (EMI).</li><li>Knowing consumer rights.</li><li>Understanding news on inflation and budget.</li></ol>"],
["How does economics help in controlling poverty, unemployment and inflation?","<p><b>Poverty:</b> education, skills, employment schemes, subsidies, PDS. <b>Unemployment:</b> promote industry, small business, agriculture and training. <b>Inflation:</b> increase supply, reduce excess money by the RBI (raising interest rate), control hoarding, and use subsidies. Economics finds causes and suitable remedies.</p>"],
["What are the limitations of economics?","<ul><li>Human behaviour is uncertain, so forecasts may fail.</li><li>Laws are conditional ('ceteris paribus').</li><li>No laboratory experiments.</li><li>Differences of opinion among economists.</li><li>Cannot settle moral or political questions.</li></ul><p>Despite these, economics remains very useful.</p>"]]);

function draw(f){f.querySelector('.svgbox').innerHTML=FIG[f.dataset.f]()}

// ---------- page ----------
let h=`<header class="page"><div class="stamp">${L.cls}</div><h1>${L.title}</h1><p class="sub">${L.sub}</p><p class="stats" id="stats"></p></header>`;
h+=`<nav>${L.sections.map(s=>`<a href="#${s.id}">${s.nav}</a>`).join('')}<a href="#examples">${L.ui.ex}</a><a href="#qa">${L.ui.qa}</a> <button onclick="window.print()">🖨 ${L.ui.print}</button></nav>`;
L.sections.forEach(s=>{
 let body=s.html.replace(/\[\[F(\d)\]\]/g,(m,n)=>{const F=L.figs[n];return `<figure data-f="${n}"><button class="rp">▶ ${L.ui.replay}</button><div class="svgbox"></div><figcaption><b>${L.ui.fig} ${n}:</b> ${F.cap}</figcaption><div class="fexp">${F.exp}</div></figure>`});
 h+=`<section class="page" id="${s.id}"><h2>${s.title}</h2>${body}</section>`});

// examples
h+=`<section class="page" id="examples"><h2>${L.ui.exTitle}</h2><p class="mini">${L.ui.exDesc}</p>`;
L.examples.forEach((e,i)=>{
 h+=`<div class="ex"><h4><span class="lv ${e.lv}">${L.ui.lv[e.lv]}</span>${L.ui.exN} ${i+1}: ${e.t}</h4><p><b>${L.ui.given}:</b> ${e.g}</p><p><b>${e.kind==='proof'?L.ui.proof:L.ui.find}:</b> ${e.f}</p><p><b>${L.ui.sol}:</b></p>${e.s.map((x,j)=>`<span class="step"><b>${L.ui.step} ${j+1}:</b> ${x}</span>`).join('')}<p class="key">✔ ${L.ui.ans}: ${e.a}</p></div>`});
h+='</section>';

// Q&A
let n=0,mcqTotal=0;
h+=`<section class="page" id="qa"><h2>${L.ui.qaTitle}</h2><p class="mini">${L.ui.qaDesc}</p><p class="key" id="score"></p>`;
L.qa.forEach(g=>{
 h+=`<h3>${g.title}</h3>`;
 g.items.forEach(it=>{n++;
  if(g.kind==='mcq'){mcqTotal++;
   h+=`<div class="q mcq" data-ans="${it[2]}"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div>${it[1].map((o,i)=>`<button class="opt" data-i="${i}">(${'abcd'[i]}) ${o}</button>`).join('')}<div class="exp"><b>${L.ui.ans}:</b> (${'abcd'[it[2]]}) ${it[1][it[2]]}. ${it[3]}</div></div>`}
  else if(g.kind==='tf'){
   h+=`<div class="q tf" data-ans="${it[1]?1:0}"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div><button class="opt" data-i="1">${L.ui.t}</button><button class="opt" data-i="0">${L.ui.f}</button><div class="exp"><b>${it[1]?L.ui.t:L.ui.f}.</b> ${it[2]}</div></div>`}
  else{
   h+=`<div class="q"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div><details><summary>${L.ui.show}</summary><div class="ans">${it[1]}</div></details></div>`}
 })});
h+='</section>';

document.querySelectorAll('figure').forEach(f=>{draw(f);f.querySelector('.rp').onclick=()=>draw(f)});

let att=0,ok=0;const sc=document.getElementById('score');
const upd=()=>{sc.textContent=`${L.ui.score}: ${ok} / ${att}`};upd();
document.addEventListener('click',e=>{
 const b=e.target.closest('.opt');if(!b)return;
 const q=b.closest('.q');if(q.classList.contains('done'))return;
 q.classList.add('done');att++;
 const a=q.dataset.ans;
 q.querySelectorAll('.opt').forEach(o=>{if(o.dataset.i===a)o.classList.add('right')});
 if(b.dataset.i===a)ok++;else b.classList.add('wrong');
 upd();
});
})();
