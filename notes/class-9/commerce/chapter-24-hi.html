{id:"s1",nav:"1 अर्थ",title:"1. परिचय – अर्थशास्त्र क्या है?",html:`
<div class="def"><p><span class="key">शब्द की उत्पत्ति:</span> <b>Economics</b> शब्द यूनानी (ग्रीक) शब्द <b>"ऑइकोनॉमिया"</b> से बना है। <i>ऑइकोस</i> = घर, <i>नोमोस</i> = प्रबंध। अर्थात् मूल अर्थ है <span class="hl">घर का प्रबंध</span>। आज इसका अर्थ पूरे देश के साधनों का प्रबंध है।</p></div>
<p><span class="key">सरल अर्थ:</span> अर्थशास्त्र वह विषय है जिसमें हम पढ़ते हैं कि व्यक्ति, परिवार, फर्म और सरकार <span class="hl">सीमित साधनों</span> से अपनी <span class="hl">असीमित आवश्यकताओं</span> को कैसे पूरा करते हैं।</p>
<h3>इसे ऐसे समझिए</h3>
<ul><li>आपको ₹100 जेब खर्च मिला। आपको पिज़्ज़ा, किताब, फिल्म का टिकट और पेन सब चाहिए। सब नहीं खरीद सकते, इसलिए <b>चुनाव</b> करना पड़ेगा। यही चुनाव अर्थशास्त्र है!</li>
<li>माँ के पास महीने का तय बजट है। वह तय करती है कि पहले क्या खरीदना है (चावल, फीस, दवा)। यह घर का अर्थशास्त्र है।</li>
<li>सरकार के पास सीमित धन है। वह तय करती है कि स्कूल, अस्पताल या सड़क में से क्या बनाए। यह राष्ट्रीय स्तर का अर्थशास्त्र है।</li></ul>
<h3>दो मुख्य शाखाएँ</h3>
<table><tr><th>व्यष्टि (सूक्ष्म) अर्थशास्त्र</th><th>समष्टि (व्यापक) अर्थशास्त्र</th></tr>
<tr><td><b>व्यक्तिगत</b> इकाइयों का अध्ययन: एक उपभोक्ता, एक फर्म, एक वस्तु की कीमत।</td><td><b>पूरी अर्थव्यवस्था</b> का अध्ययन: राष्ट्रीय आय, कुल रोज़गार, महँगाई, GDP।</td></tr>
<tr><td>उदाहरण: गर्मियों में आम सस्ता क्यों हो जाता है?</td><td>उदाहरण: देश में महँगाई क्यों बढ़ रही है?</td></tr></table>
<div class="note"><p>📝 याद रखें: व्यष्टि = छोटा (व्यक्तिगत)। समष्टि = बड़ा (पूरी अर्थव्यवस्था)।</p></div>`},
{id:"s2",nav:"2 परिभाषाएँ",title:"2. अर्थशास्त्र की परिभाषाएँ",html:`
<table><tr><th>अर्थशास्त्री</th><th>पुस्तक / वर्ष</th><th>परिभाषा (सरल शब्दों में)</th><th>मुख्य बिंदु</th></tr>
<tr><td><b>एडम स्मिथ</b><br>(अर्थशास्त्र के जनक)</td><td>वेल्थ ऑफ नेशंस, 1776</td><td>अर्थशास्त्र <b>धन</b> का विज्ञान है: कोई राष्ट्र धनी कैसे बनता है।</td><td>धन</td></tr>
<tr><td><b>अल्फ्रेड मार्शल</b></td><td>प्रिंसिपल्स ऑफ इकोनॉमिक्स, 1890</td><td>अर्थशास्त्र मनुष्य के जीवन के सामान्य व्यवसाय का अध्ययन है। यह व्यक्तिगत और सामाजिक क्रियाओं के उस भाग की जाँच करता है जो <b>कल्याण</b> के भौतिक साधनों को पाने और प्रयोग करने से जुड़ा है।</td><td>कल्याण</td></tr>
<tr><td><b>लायोनेल रॉबिन्स</b></td><td>नेचर एंड सिग्निफिकेंस ऑफ इकोनॉमिक साइंस, 1932</td><td>अर्थशास्त्र वह विज्ञान है जो मानव व्यवहार को <b>असीमित आवश्यकताओं</b> और <b>सीमित (दुर्लभ) साधनों</b> के संबंध के रूप में पढ़ता है, जिनके वैकल्पिक प्रयोग हैं।</td><td>दुर्लभता और चुनाव</td></tr>
<tr><td><b>पॉल सैमुएलसन</b></td><td>इकोनॉमिक्स, 1948</td><td>अर्थशास्त्र बताता है कि समाज दुर्लभ साधनों से वस्तुएँ बनाने और उन्हें वर्तमान तथा <b>भविष्य</b> में उपभोग के लिए बाँटने का चुनाव कैसे करता है।</td><td>विकास</td></tr></table>
<h3>रॉबिन्स की परिभाषा की चार विशेषताएँ</h3>
<ol><li><b>असीमित आवश्यकताएँ</b> – मनुष्य की इच्छाएँ कभी खत्म नहीं होतीं।</li><li><b>सीमित साधन</b> – धन, भूमि, समय सीमित हैं।</li><li><b>वैकल्पिक प्रयोग</b> – एक साधन कई तरह से प्रयोग हो सकता है (भूमि पर गेहूँ या गन्ना)।</li><li><b>चुनाव</b> – इसलिए पहले कौन-सी आवश्यकता पूरी करें, यह चुनना पड़ता है।</li></ol>
<div class="tip"><p>💡 आलोचना: स्मिथ की परिभाषा मानव कल्याण को छोड़ देती है। मार्शल की परिभाषा भौतिक वस्तुओं तक सीमित है (शिक्षक की सेवा को छोड़ देती है)। रॉबिन्स की परिभाषा व्यापक है पर कल्याण और विकास को स्थान नहीं देती। इसलिए आज सभी परिभाषाओं को साथ में समझा जाता है।</p></div>`},
{id:"s3",nav:"3 मूल धारणाएँ",title:"3. मूल धारणाएँ: आवश्यकता, दुर्लभता, चुनाव और अवसर लागत",html:`
<ul><li><span class="key">आवश्यकता (इच्छा):</span> वस्तुओं या सेवाओं की चाह (साइकिल, जूते)। ये असीमित हैं और बदलती रहती हैं।</li>
<li><span class="key">साधन:</span> भूमि, श्रम, पूँजी और उद्यम (संगठन)। ये <b>सीमित</b> हैं।</li>
<li><span class="key">दुर्लभता:</span> साधन आवश्यकताओं से कम हैं। दुर्लभता <span class="hl">हर आर्थिक समस्या की जड़</span> है।</li>
<li><span class="key">चुनाव:</span> दुर्लभता के कारण कुछ आवश्यकताओं को चुनना और कुछ को छोड़ना पड़ता है।</li>
<li><span class="key">अवसर लागत:</span> <b>अगले सर्वश्रेष्ठ विकल्प</b> का मूल्य जिसे छोड़ना पड़ा।</li></ul>
<div class="def"><p><b>उदाहरण:</b> किसान के खेत में गेहूँ (लाभ ₹40,000) या गन्ना (लाभ ₹55,000) उगाया जा सकता है। गन्ना उगाने पर अवसर लागत ₹40,000 (छोड़ा गया गेहूँ) है।</p></div>
[[F2]]
<p>अब इसी विचार को उत्पादन के चुनावों के चित्र में देखिए:</p>
[[F4]]`},
{id:"s4",nav:"4 लाभ",title:"4. अर्थशास्त्र के अध्ययन के लाभ (महत्व) – पूरी सूची",html:`
<p>हम अर्थशास्त्र क्यों पढ़ते हैं? क्योंकि यह <span class="hl">जीवन के हर क्षेत्र</span> में उपयोगी है। नीचे सभी लाभ व्याख्या सहित हैं।</p>
[[F1]]
<h3>1. समझदारी से चुनाव में सहायता</h3><p>अर्थशास्त्र लागत और लाभ की तुलना करना सिखाता है। जो विद्यार्थी अवसर लागत समझता है वह समय और धन का सही उपयोग करता है।</p>
<h3>2. आर्थिक समस्याओं की समझ</h3><p>यह बताता है कि क्या, कैसे और किसके लिए उत्पादन करें, ताकि दुर्लभ साधन व्यर्थ न हों।</p>
<h3>3. उपभोक्ता के लिए मार्गदर्शन</h3><p>उपभोक्ता बजट बनाना, कीमतों की तुलना, बचत और सीमित आय से अधिकतम संतुष्टि पाना सीखता है। उपभोक्ता अधिकारों की जानकारी धोखे से बचाती है।</p>
<h3>4. उत्पादक के लिए मार्गदर्शन</h3><p>उत्पादक माँग, लागत, कीमत और लाभ के बारे में सीखता है। वह उत्पादन की मात्रा तय करता है और भूमि, श्रम, पूँजी का ऐसा मेल चुनता है जिससे लागत घटे।</p>
<h3>5. श्रमिकों के लिए मार्गदर्शन</h3><p>श्रमिक मजदूरी, रोज़गार, श्रमिक संघ और कौशल-प्रशिक्षण का महत्व समझकर उचित मजदूरी के लिए मोलभाव कर सकते हैं।</p>
<h3>6. किसानों के लिए मार्गदर्शन</h3><p>किसान न्यूनतम समर्थन मूल्य (MSP), ऋण, फसल चयन, सहकारी विपणन और कीमतों के आय पर प्रभाव को समझते हैं।</p>
<h3>7. व्यापारी और व्यवसायी के लिए मार्गदर्शन</h3><p>माँग का पूर्वानुमान, कीमत निर्धारण, स्टॉक नियंत्रण तथा बैंक, कर और व्यापार को समझने में मदद मिलती है।</p>
<h3>8. सरकार और नीति निर्माताओं की सहायता</h3><p>कर, सब्सिडी, बजट, मूल्य नियंत्रण और कल्याण योजनाएँ आर्थिक ज्ञान के आधार पर बनती हैं।</p>
<h3>9. आर्थिक नियोजन और विकास में सहायता</h3><p>नियोजन के लिए साधनों, जनसंख्या, बचत और निवेश के आँकड़े चाहिए। अर्थशास्त्र इसकी विधि देता है। भारत में पंचवर्षीय योजनाएँ चलीं और अब नीति आयोग है (जिसने 2015 में योजना आयोग का स्थान लिया)।</p>
<h3>10. राष्ट्रीय समस्याओं का समाधान</h3><p>गरीबी, बेरोज़गारी, महँगाई, जनसंख्या वृद्धि और आय की असमानता को आर्थिक ज्ञान से ही समझा और सुलझाया जा सकता है।</p>
<h3>11. मुद्रा, बैंकिंग और वित्त की समझ</h3><p>रिज़र्व बैंक (RBI) की भूमिका, बैंक, ब्याज, ऋण, बीमा, UPI और महँगाई स्पष्ट होती है।</p>
<h3>12. अंतर्राष्ट्रीय व्यापार की समझ</h3><p>देश आयात-निर्यात क्यों करते हैं, विनिमय दर क्या है और हम विदेशी वस्तुएँ क्यों खरीदते हैं, यह अर्थशास्त्र समझाता है।</p>
<h3>13. अच्छा और जिम्मेदार नागरिक बनाता है</h3><p>नागरिक बजट, कर (GST, आयकर) और सब्सिडी समझता है, सरकार की आर्थिक नीतियों को परख सकता है और समझदारी से मतदान करता है।</p>
<h3>14. तार्किक और विश्लेषणात्मक सोच का विकास</h3><p>यह आँकड़ों, ग्राफ और तर्क का प्रयोग सिखाता है। यह वाणिज्य, बैंकिंग, CA, सिविल सेवा, व्यापार और शिक्षण के करियर का आधार है।</p>
<h3>15. सामाजिक कल्याण में वृद्धि</h3><p>यह आय की असमानता घटाने और जीवन स्तर बढ़ाने के उपाय बताता है, जिससे अधिक लोग अच्छा जीवन जी सकें।</p>
<div class="note"><p>📝 याद रखने की ट्रिक: "उ-उ-श्र-कि-स-रा" = उपभोक्ता, उत्पादक, श्रमिक, किसान, सरकार, राष्ट्र।</p></div>`},
{id:"s5",nav:"5 उपभोक्ता",title:"5. उपभोक्ताओं के लिए महत्व (माँग के नियम सहित)",html:`
<p>उपभोक्ता की आय सीमित होती है। अर्थशास्त्र उसे उसी आय से <span class="hl">अधिकतम संतुष्टि (उपयोगिता)</span> पाना सिखाता है।</p>
<ul><li>मासिक <b>बजट</b> बनाना और फिजूलखर्ची रोकना।</li><li>कीमत और गुणवत्ता की तुलना (<i>पैसे का पूरा मूल्य</i>)।</li><li><b>कीमतें क्यों बदलती हैं</b> (माँग और पूर्ति) समझना।</li><li>भविष्य के लिए बचत और निवेश।</li><li>उपभोक्ता अधिकार, MRP और बिल की जानकारी।</li></ul>
<div class="def"><p><span class="key">माँग का नियम:</span> अन्य बातें समान रहने पर, किसी वस्तु की कीमत <b>घटने</b> पर उसकी माँगी गई मात्रा <b>बढ़ती</b> है और कीमत <b>बढ़ने</b> पर माँगी गई मात्रा <b>घटती</b> है। अर्थात् कीमत और माँग <b>विपरीत दिशा</b> में चलती हैं (विपरीत संबंध)।</p></div>
<table><tr><th>कीमत प्रति किग्रा (₹)</th><th>माँगी गई मात्रा (किग्रा)</th></tr><tr><td>50</td><td>10</td></tr><tr><td>40</td><td>20</td></tr><tr><td>30</td><td>30</td></tr><tr><td>20</td><td>40</td></tr></table>
[[F5]]
<div class="tip"><p>नियम के कारण: (1) ह्रासमान सीमांत उपयोगिता नियम, (2) आय प्रभाव, (3) प्रतिस्थापन प्रभाव, (4) कम कीमत पर नए खरीदार आना।</p></div>`},
{id:"s6",nav:"6 उत्पादक आदि",title:"6. उत्पादक, श्रमिक, किसान और व्यापारी के लिए महत्व",html:`
<table><tr><th>वर्ग</th><th>अर्थशास्त्र कैसे सहायक है</th><th>उदाहरण</th></tr>
<tr><td><b>उत्पादक / फर्म</b></td><td>क्या, कितना और कैसे उत्पादन करें; लागत नियंत्रण; मूल्य निर्धारण; लाभ योजना।</td><td>जूता कारखाना माँग देखकर 5000 की जगह 500 जोड़ी बनाता है।</td></tr>
<tr><td><b>श्रमिक</b></td><td>मजदूरी, उत्पादकता, कौशल, संघ और सामाजिक सुरक्षा की समझ।</td><td>कुशल श्रमिक अकुशल से अधिक मजदूरी माँगता है।</td></tr>
<tr><td><b>किसान</b></td><td>फसल चयन, MSP, ऋण, भंडारण, विपणन, सहकारी समितियाँ।</td><td>बिचौलिये की जगह MSP पर गेहूँ बेचना।</td></tr>
<tr><td><b>व्यापारी</b></td><td>स्टॉक प्रबंधन, कीमत तय करना, प्रतियोगिता और बैंक ऋण को समझना।</td><td>दुकानदार सर्दी में ऊनी कपड़े और गर्मी में पंखे रखता है।</td></tr>
<tr><td><b>बैंकर / निवेशक</b></td><td>ब्याज दर, जोखिम, प्रतिफल, बचत योजनाएँ।</td><td>FD, PPF और शेयर में से चुनाव।</td></tr></table>
<h3>उत्पादन के चार साधन और उनका पुरस्कार</h3>
<table><tr><th>साधन</th><th>पुरस्कार</th></tr><tr><td>भूमि</td><td>लगान (किराया)</td></tr><tr><td>श्रम</td><td>मजदूरी</td></tr><tr><td>पूँजी</td><td>ब्याज</td></tr><tr><td>उद्यमी (साहसी)</td><td>लाभ</td></tr></table>`},
{id:"s7",nav:"7 सरकार",title:"7. सरकार, नियोजन और राष्ट्र के लिए महत्व",html:`
<ul><li><b>कर निर्धारण:</b> सरकार आयकर, GST, सीमा शुल्क तय करती है ताकि उचित राजस्व मिले।</li>
<li><b>बजट:</b> एक वर्ष की आय-व्यय योजना (शिक्षा, रक्षा, स्वास्थ्य, सड़कें)।</li>
<li><b>मूल्य नियंत्रण:</b> MSP और राशन (PDS) की कीमतें तय करके गरीबों की रक्षा।</li>
<li><b>रोज़गार:</b> मनरेगा जैसी योजनाएँ ग्रामीण श्रमिकों को काम देती हैं।</li>
<li><b>आर्थिक नियोजन:</b> वर्षों तक साधनों का सर्वोत्तम प्रयोग।</li>
<li><b>कल्याण:</b> सब्सिडी, पेंशन, छात्रवृत्ति और स्वास्थ्य योजनाएँ।</li></ul>
<h3>चक्रीय प्रवाह – अर्थव्यवस्था में धन कैसे घूमता है</h3>
<p>सरकार को समझना होता है कि <b>परिवार</b> और <b>फर्में</b> एक-दूसरे पर कैसे निर्भर हैं। परिवार फर्मों को उत्पादन के साधन (भूमि, श्रम, पूँजी, उद्यम) देते हैं; फर्में उन्हें लगान, मजदूरी, ब्याज और लाभ देती हैं; परिवार इस आय को फर्मों की वस्तुओं और सेवाओं पर खर्च करते हैं।</p>
[[F3]]
<div class="note"><p>📝 यदि प्रवाह कहीं रुक जाए (जैसे लोग खर्च करना बंद कर दें) तो उत्पादन, रोज़गार और आय घट जाती है। अर्थशास्त्र इस प्रवाह को सुचारु रखने में मदद करता है।</p></div>`},
{id:"s8",nav:"8 केंद्रीय समस्याएँ",title:"8. अर्थव्यवस्था की केंद्रीय समस्याएँ",html:`
<p>दुर्लभता के कारण हर देश (अमीर या गरीब) को <b>तीन केंद्रीय समस्याओं</b> का सामना करना पड़ता है। अर्थशास्त्र का अध्ययन इन्हें सुलझाने में मदद करता है।</p>
<table><tr><th>समस्या</th><th>अर्थ</th><th>उदाहरण</th></tr>
<tr><td><b>1. क्या उत्पादन करें?</b></td><td>कौन-सी वस्तुएँ और कितनी: उपभोग वस्तुएँ या पूँजीगत वस्तुएँ; गेहूँ या कपड़ा।</td><td>अधिक अनाज या अधिक मोबाइल फोन?</td></tr>
<tr><td><b>2. कैसे उत्पादन करें?</b></td><td>कौन-सी तकनीक: श्रम-प्रधान या पूँजी-प्रधान।</td><td>हाथ से बुनाई या पावरलूम?</td></tr>
<tr><td><b>3. किसके लिए उत्पादन करें?</b></td><td>वस्तुएँ किसे मिलेंगी: लोगों में आय का वितरण।</td><td>अमीरों के लिए महँगी कारें या गरीबों के लिए सस्ते मकान?</td></tr></table>
<h3>उत्पादन संभावना वक्र (PPC)</h3>
<p>PPC वह वक्र है जो दिखाता है कि पूर्ण साधन और सर्वोत्तम तकनीक से अर्थव्यवस्था <b>दो वस्तुओं के कौन-से संयोग</b> बना सकती है। ऊपर चित्र 4 में एनिमेटेड PPC देखिए।</p>
<ul><li>वक्र पर बिंदु <b>A, B, C</b> = साधनों का पूर्ण उपयोग (कुशल)।</li><li>वक्र के अंदर बिंदु <b>U</b> = साधन बेकार, बेरोज़गारी, बर्बादी।</li><li>वक्र के बाहर बिंदु <b>X</b> = वर्तमान साधनों से संभव नहीं। केवल विकास (अधिक साधन या बेहतर तकनीक) से मिल सकता है।</li><li>वक्र बाहर की ओर झुका होता है क्योंकि <b>अवसर लागत बढ़ती है</b>: अधिक कपड़े के लिए हमें अधिकाधिक गेहूँ छोड़ना पड़ता है।</li></ul>`},
{id:"s9",nav:"9 सैद्धांतिक व व्यावहारिक",title:"9. सैद्धांतिक और व्यावहारिक महत्व",html:`
<table><tr><th>सैद्धांतिक (प्रकाशप्रद) महत्व</th><th>व्यावहारिक (फलप्रद) महत्व</th></tr>
<tr><td>ज्ञान और समझ बढ़ाता है।</td><td>रोज़ के जीवन और कार्य में सीधा लाभ देता है।</td></tr>
<tr><td>माँग, पूर्ति, लागत, आय के नियम समझाता है।</td><td>गरीबी, बेरोज़गारी, महँगाई सुलझाने में सहायक।</td></tr>
<tr><td>तार्किक सोच विकसित करता है।</td><td>बजट, व्यापार, नियोजन और नीति-निर्माण में सहायक।</td></tr>
<tr><td>अन्य सामाजिक विज्ञानों का आधार।</td><td>करियर: बैंकर, लेखाकार, अर्थशास्त्री, CA, IAS।</td></tr></table>
<div class="note"><p>मार्शल ने कहा कि अर्थशास्त्र <b>"प्रकाशप्रद"</b> (ज्ञान देने वाला) और <b>"फलप्रद"</b> (व्यावहारिक लाभ देने वाला) दोनों विज्ञान है।</p></div>
<h3>अर्थशास्त्र विज्ञान है या कला?</h3>
<ul><li><b>विज्ञान:</b> इसमें व्यवस्थित ज्ञान है, कारण-परिणाम संबंध हैं और तथ्यों का अध्ययन होता है।</li><li><b>कला:</b> यह लक्ष्य पाने के व्यावहारिक उपाय बताता है (जैसे बेरोज़गारी कैसे घटाएँ)।</li><li><b>निष्कर्ष:</b> यह सामाजिक विज्ञान भी है और कला भी। यह <b>सामाजिक</b> विज्ञान है क्योंकि समाज में रहने वाले मनुष्य के व्यवहार का अध्ययन करता है।</li></ul>
<h3>वास्तविक और आदर्शात्मक अर्थशास्त्र</h3>
<table><tr><th>वास्तविक (Positive)</th><th>आदर्शात्मक (Normative)</th></tr><tr><td>"क्या है" – तथ्य।</td><td>"क्या होना चाहिए" – मूल्य निर्णय।</td></tr><tr><td>उदाहरण: भारत की जनसंख्या 140 करोड़ से अधिक है।</td><td>उदाहरण: अमीरों को अधिक कर देना चाहिए।</td></tr></table>`},
{id:"s10",nav:"10 भारत",title:"10. भारत के लिए महत्व और सीमाएँ",html:`
<h3>भारत के लिए अर्थशास्त्र बहुत महत्वपूर्ण क्यों है</h3>
<ul><li>भारत <b>विकासशील देश</b> है और जनसंख्या अधिक है, इसलिए गरीबी, बेरोज़गारी और असमानता का गहन अध्ययन आवश्यक है।</li><li>कृषि अब भी बड़ी जनसंख्या को रोज़गार देती है, इसलिए कृषि नीतियाँ महत्वपूर्ण हैं।</li><li>मेक इन इंडिया, डिजिटल इंडिया, स्टार्ट-अप इंडिया, UPI, GST और वित्तीय समावेशन को समझने के लिए आर्थिक ज्ञान चाहिए।</li><li>प्रति व्यक्ति आय और जीवन स्तर बढ़ाने में सहायक।</li><li>शिक्षा, स्वास्थ्य और आधारभूत ढाँचे की योजना के लिए आवश्यक।</li></ul>
<h3>सीमाएँ (कमजोरियाँ)</h3>
<ol><li>यह मानव व्यवहार का अध्ययन है जो अनिश्चित है, इसलिए भविष्यवाणियाँ गलत हो सकती हैं।</li><li>नियम केवल "<b>अन्य बातें समान रहने</b>" (ceteris paribus) की शर्त पर सत्य हैं।</li><li>प्रयोगशाला में नियंत्रित प्रयोग संभव नहीं।</li><li>अर्थशास्त्रियों में प्रायः मतभेद होते हैं।</li><li>यह नैतिक या राजनीतिक प्रश्नों का निर्णय नहीं कर सकता।</li></ol>
<h3>शीघ्र पुनरावृत्ति के बिंदु ✍</h3>
<ul><li>अर्थशास्त्र = दुर्लभता में चुनाव का अध्ययन।</li><li>अर्थशास्त्र के जनक = एडम स्मिथ (1776)।</li><li>महत्व: उपभोक्ता, उत्पादक, श्रमिक, किसान, व्यापारी, सरकार, राष्ट्र।</li><li>तीन केंद्रीय समस्याएँ: क्या, कैसे, किसके लिए।</li><li>अवसर लागत = छोड़ा गया अगला सर्वश्रेष्ठ विकल्प।</li><li>PPC: A, B, C कुशल; U बेकार; X असंभव।</li><li>अर्थशास्त्र विज्ञान भी है और कला भी।</li></ul>`}
];
L.figs={
1:{cap:"माइंड मैप – अर्थशास्त्र के अध्ययन के लाभ",exp:`<p>बीच में अर्थशास्त्र के अध्ययन का महत्व है। हर शाखा एक-एक करके बनती है और एक बड़ा लाभ दिखाती है: समझदार चुनाव, उपभोक्ता, उत्पादक, श्रमिक और किसान की सहायता, सरकारी नीति, नियोजन, राष्ट्रीय समस्याओं का समाधान और अच्छी नागरिकता। दोबारा देखने के लिए <b>दोबारा देखें</b> दबाइए।</p>`},
2:{cap:"प्रवाह चार्ट: असीमित आवश्यकताओं से अवसर लागत तक",exp:`<ol><li><b>असीमित आवश्यकताएँ:</b> लोग हमेशा और चाहते हैं।</li><li><b>सीमित साधन:</b> भूमि, श्रम, पूँजी और समय तय हैं।</li><li><b>दुर्लभता:</b> आवश्यकताएँ साधनों से अधिक हैं।</li><li><b>चुनाव:</b> हम चुनते हैं कि पहले क्या पूरा करें।</li><li><b>अवसर लागत:</b> जो अगला सर्वश्रेष्ठ विकल्प हमने छोड़ा।</li></ol>`},
3:{cap:"दो-क्षेत्रीय अर्थव्यवस्था में आय का चक्रीय प्रवाह",exp:`<p><b>हरे बिंदु</b> = मुद्रा प्रवाह। <b>नीले बिंदु</b> = वास्तविक प्रवाह (वस्तुएँ और साधन सेवाएँ)।</p><ul><li>परिवार फर्मों को <b>साधन सेवाएँ</b> (श्रम, भूमि, पूँजी) देते हैं।</li><li>फर्में परिवारों को <b>साधन भुगतान</b> (मजदूरी, लगान, ब्याज, लाभ) देती हैं।</li><li>फर्में परिवारों को <b>वस्तुएँ और सेवाएँ</b> देती हैं।</li><li>परिवार फर्मों को <b>उपभोग व्यय</b> देते हैं।</li></ul><p>एक की आय दूसरे का व्यय है, इसलिए प्रवाह चक्र में घूमता रहता है।</p>`},
4:{cap:"उत्पादन संभावना वक्र (PPC)",exp:`<ul><li>लाल वक्र पहले बनता है। यह अधिकतम संभव उत्पादन संयोग दिखाता है।</li><li><b>A, B, C</b> (हरे) = साधनों का पूर्ण उपयोग।</li><li><b>U</b> (नारंगी) = अल्प-उपयोग: साधन बेकार।</li><li><b>X</b> (बैंगनी) = अभी असंभव।</li><li>A से B जाने पर <b>कपड़ा बढ़ता है पर गेहूँ घटता है</b>: यही अवसर लागत है।</li></ul>`},
5:{cap:"माँग वक्र – माँग का नियम",exp:`<p>नीली रेखा बाएँ से दाएँ <b>नीचे</b> की ओर जाती है। ₹50 पर माँग 10 किग्रा है और कीमत ₹20 होने पर माँग 40 किग्रा हो जाती है। घूमता नारंगी बिंदु दिखाता है कि कीमत घटने पर हम वक्र पर नीचे खिसककर अधिक मात्रा पर पहुँचते हैं। यही कीमत और माँगी गई मात्रा का <b>विपरीत संबंध</b> है।</p>`}
};

{lv:"med",t:"PPC और बढ़ती अवसर लागत",g:"संयोग (कपड़ा, गेहूँ): A(0,15), B(1,14), C(2,12), D(3,9), E(4,5), F(5,0)।",f:"कपड़े की प्रत्येक अतिरिक्त इकाई की अवसर लागत।",s:["A→B: गेहूँ 15−14 = 1 घटा, 1 कपड़े के लिए → लागत 1 गेहूँ।","B→C: 14−12 = 2 गेहूँ प्रति 1 कपड़ा।","C→D: 12−9 = 3 गेहूँ।","D→E: 9−5 = 4 गेहूँ।","E→F: 5−0 = 5 गेहूँ।","लागत क्रम 1, 2, 3, 4, 5 बढ़ रहा है।"],a:"अवसर लागत बढ़ती है (1,2,3,4,5 गेहूँ प्रति कपड़ा), इसलिए PPC बाहर की ओर झुका (अवतल) होता है।"},

{lv:"med",t:"सरकार द्वारा लागत-लाभ आधारित चुनाव",g:"परियोजना A: लागत 80 करोड़, लाभ 100 करोड़। B: लागत 120, लाभ 130। C: लागत 50, लाभ 70। बजट = 130 करोड़।",f:"बजट में सर्वश्रेष्ठ परियोजनाएँ।",s:["शुद्ध लाभ = लाभ − लागत: A = 20, B = 10, C = 20 करोड़।","लाभ-लागत अनुपात: A = 100/80 = 1.25, B = 130/120 ≈ 1.08, C = 70/50 = 1.4।","B सबसे कमजोर है। 130 करोड़ में संयोग देखें: A + C की लागत = 80 + 50 = 130 करोड़, शुद्ध लाभ = 20 + 20 = 40 करोड़।","केवल B की लागत 120 करोड़ और शुद्ध लाभ केवल 10 करोड़।"],a:"A और C चुनें: कुल लागत 130 करोड़, शुद्ध लाभ 40 करोड़। इसी तरह अर्थशास्त्र नीति-निर्माताओं की मदद करता है।"},
{lv:"hard",t:"माँग की कीमत लोच (सरल)",g:"कीमत ₹20 से बढ़कर ₹25; माँगी गई मात्रा 100 से घटकर 80 इकाई।",f:"माँग की कीमत लोच (Ed)।",s:["कीमत में % परिवर्तन = (25 − 20) ÷ 20 × 100 = 25%।","मात्रा में % परिवर्तन = (80 − 100) ÷ 100 × 100 = −20%।","Ed = मात्रा में % परिवर्तन ÷ कीमत में % परिवर्तन = −20 ÷ 25 = −0.8।","चिह्न छोड़कर |Ed| = 0.8, जो 1 से कम है।"],a:"|Ed| = 0.8, अतः माँग बेलोचदार है: मात्रा कीमत से कम बदली।"},
{lv:"hard",t:"राष्ट्रीय आय की वृद्धि",g:"GDP = ₹200 लाख करोड़; वृद्धि दर 6% प्रति वर्ष।",f:"2 वर्ष बाद GDP।",s:["वर्ष 1: 200 × 1.06 = 212 लाख करोड़।","वर्ष 2: 212 × 1.06 = 224.72 लाख करोड़।","कुल वृद्धि = 224.72 − 200 = 24.72 लाख करोड़।","जाँच: 200 × (1.06)² = 200 × 1.1236 = 224.72।"],a:"2 वर्ष बाद GDP = ₹224.72 लाख करोड़ (12.36% की वृद्धि)।"},
{lv:"hard",kind:"proof",t:"सीमांत उपयोगिता से माँग के नियम की सिद्धि",g:"आमों की सीमांत उपयोगिता (₹ में, जितना उपभोक्ता देने को तैयार): 1ला = 20, 2रा = 16, 3रा = 12, 4था = 8, 5वाँ = 4।",f:"कीमत घटने पर उपभोक्ता अधिक खरीदता है (विपरीत संबंध)।",s:["तर्कसंगत उपभोक्ता तभी इकाई खरीदता है जब सीमांत उपयोगिता ≥ कीमत।","कीमत ₹20 पर: केवल पहला आम (MU 20) योग्य → मात्रा = 1।","कीमत ₹16 पर: पहला व दूसरा योग्य → मात्रा = 2।","कीमत ₹12 पर: 3 आम। ₹8 पर: 4 आम। ₹4 पर: 5 आम।","कीमत: 20 → 16 → 12 → 8 → 4 और मात्रा: 1 → 2 → 3 → 4 → 5।"],a:"कीमत घटने पर माँगी गई मात्रा बढ़ती है (क्योंकि हर अतिरिक्त इकाई पर MU घटती है)। अतः माँग का नियम सिद्ध हुआ।"},

A("ख. लघु उत्तरीय प्रश्न (2–3 अंक)",0,'qa',[

["अर्थशास्त्र उत्पादक के लिए कैसे उपयोगी है?","उत्पादक माँग, लागत, कीमत और लाभ के बारे में सीखता है। वह तय करता है कि क्या और कितना उत्पादन करे और साधनों का सबसे सस्ता मेल चुनता है, जिससे घाटा नहीं होता।"],

["अर्थशास्त्र श्रमिकों की कैसे सहायता करता है?","श्रमिक मजदूरी, उत्पादकता, कौशल का महत्व, संघ और सामाजिक सुरक्षा समझते हैं। इससे वे उचित मजदूरी माँग सकते हैं और जीवन सुधार सकते हैं।"],
["सरकार के लिए अर्थशास्त्र का महत्व समझाइए।","सरकार आर्थिक ज्ञान से बजट बनाती है, कर और सब्सिडी तय करती है, कीमतों पर नियंत्रण करती है, रोज़गार बढ़ाती है और कल्याण योजनाएँ बनाती है।"],
["अर्थशास्त्र नियोजन में कैसे सहायक है?","नियोजन के लिए साधनों, जनसंख्या, बचत और निवेश का अध्ययन चाहिए। अर्थशास्त्र बताता है कि दुर्लभ साधनों का तेज विकास के लिए सर्वोत्तम उपयोग कैसे हो।"],

["आवश्यकता (want) और अनिवार्यता (need) में अंतर बताइए।","<b>अनिवार्यता</b> जीवन के लिए जरूरी है (भोजन, कपड़ा, मकान)। <b>इच्छा</b> जरूरी नहीं होती (महँगा मोबाइल)। अनिवार्यताएँ सीमित हैं जबकि इच्छाएँ असीमित।"],
["दुर्लभता क्यों उत्पन्न होती है?","क्योंकि मानव आवश्यकताएँ असीमित हैं जबकि भूमि, समय और धन जैसे साधन सीमित हैं और उनके वैकल्पिक प्रयोग हैं।"],
["चुनाव क्यों आवश्यक है?","दुर्लभता के कारण सभी आवश्यकताएँ पूरी नहीं हो सकतीं। इसलिए सबसे महत्वपूर्ण को चुनना और बाकी को छोड़ना पड़ता है।"],

["व्यष्टि और समष्टि अर्थशास्त्र में अंतर बताइए।","व्यष्टि में उपभोक्ता या फर्म जैसी व्यक्तिगत इकाइयों का अध्ययन होता है। समष्टि में पूरी अर्थव्यवस्था जैसे राष्ट्रीय आय, महँगाई और रोज़गार का अध्ययन होता है।"],

["'किसके लिए उत्पादन करें' समझाइए।","यह वितरण की समस्या है: वस्तुएँ और सेवाएँ किसे मिलेंगी। यह लोगों में आय के वितरण पर निर्भर करता है।"],
["आय के चक्रीय प्रवाह को संक्षेप में समझाइए।","परिवार फर्मों को उत्पादन के साधन देते हैं और लगान, मजदूरी, ब्याज व लाभ पाते हैं। वे इस आय को फर्मों की वस्तुओं और सेवाओं पर खर्च करते हैं। इस प्रकार आय और व्यय चक्र में घूमते हैं।"],
["एडम स्मिथ की परिभाषा की दो आलोचनाएँ लिखिए।","(1) यह केवल धन को महत्व देती है और मानव कल्याण की उपेक्षा करती है। (2) यह मनुष्य को धन चाहने वाला मानती है और अभौतिक सेवाओं को छोड़ देती है।"]]);

["अर्थशास्त्र के अध्ययन के लाभ (महत्व) समझाइए।","<ul><li><b>समझदार चुनाव:</b> लागत-लाभ की तुलना सिखाता है।</li><li><b>आर्थिक समस्याओं का समाधान:</b> क्या, कैसे और किसके लिए उत्पादन।</li><li><b>उपभोक्ता:</b> बजट, बचत, अधिकार।</li><li><b>उत्पादक:</b> माँग, लागत, कीमत और लाभ संबंधी निर्णय।</li><li><b>श्रमिक व किसान:</b> मजदूरी, MSP, ऋण, विपणन।</li><li><b>सरकार:</b> कर, बजट, सब्सिडी, कल्याण।</li><li><b>नियोजन:</b> साधनों का सर्वोत्तम उपयोग और तेज विकास।</li><li><b>राष्ट्रीय समस्याएँ:</b> गरीबी, बेरोज़गारी, महँगाई।</li><li><b>अंतर्राष्ट्रीय व्यापार और बैंकिंग</b> की समझ।</li><li><b>नागरिकता, सोच का विकास</b> और करियर के अवसर।</li></ul>"],
["उपभोक्ता, उत्पादक, श्रमिक और सरकार के लिए अर्थशास्त्र का महत्व समझाइए।","<p><b>उपभोक्ता:</b> बजट और तुलना द्वारा सीमित आय से अधिकतम संतुष्टि पाता है।</p><p><b>उत्पादक:</b> भूमि, श्रम, पूँजी का सर्वश्रेष्ठ मेल चुनता है; कीमत और मात्रा तय करता है।</p><p><b>श्रमिक:</b> मजदूरी, कौशल का मूल्य और अधिकार समझते हैं।</p><p><b>सरकार:</b> सामाजिक कल्याण के लिए कर, कीमत और रोज़गार नीतियाँ बनाती है।</p><p>इस प्रकार समाज का हर वर्ग आर्थिक ज्ञान से लाभान्वित होता है।</p>"],
["स्मिथ, मार्शल और रॉबिन्स की परिभाषाएँ समझाइए। कौन-सी सर्वश्रेष्ठ है?","<ul><li><b>स्मिथ:</b> धन का विज्ञान। आलोचना: कल्याण की उपेक्षा।</li><li><b>मार्शल:</b> जीवन के सामान्य व्यवसाय में मनुष्य का अध्ययन जो भौतिक कल्याण से जुड़ा है। आलोचना: अभौतिक सेवाओं की उपेक्षा।</li><li><b>रॉबिन्स:</b> असीमित आवश्यकताओं और दुर्लभ साधनों के संबंध में मानव व्यवहार का विज्ञान। आलोचना: कल्याण और विकास की उपेक्षा।</li></ul><p><b>निष्कर्ष:</b> रॉबिन्स की परिभाषा सबसे वैज्ञानिक और व्यापक रूप से स्वीकार्य है, जबकि सैमुएलसन ने विकास का पक्ष जोड़ा। आधुनिक विद्यार्थी सभी को साथ में प्रयोग करता है।</p>"],
["अर्थव्यवस्था की केंद्रीय समस्याएँ क्या हैं? अर्थशास्त्र उन्हें हल करने में कैसे मदद करता है?","<p>दुर्लभता के कारण हर अर्थव्यवस्था को हल करना होता है: <b>(1) क्या उत्पादन करें, (2) कैसे उत्पादन करें, (3) किसके लिए उत्पादन करें।</b></p><p>अर्थशास्त्र कीमत प्रणाली, नियोजन, लागत-लाभ विश्लेषण और PPC जैसे उपकरण देता है, जिनसे सर्वोत्तम उत्पादन, सर्वोत्तम तकनीक और उचित वितरण चुना जाता है। इस तरह बर्बादी रुकती है और कल्याण बढ़ता है।</p>"],
["PPC की सहायता से दुर्लभता, चुनाव और अवसर लागत समझाइए।","<p>दुर्लभता: साधन सीमित हैं, इसलिए सब कुछ नहीं बन सकता। चुनाव: हम वस्तुओं का एक संयोग चुनते हैं। अवसर लागत: एक वस्तु अधिक लेने पर दूसरी कम मिलती है।</p><p>PPC पर वक्र के बिंदु (A, B, C) साधनों का पूर्ण उपयोग दिखाते हैं; अंदर का बिंदु (U) बेरोज़गारी; बाहर का बिंदु (X) अभी असंभव है। A से B जाने पर कपड़ा अधिक पर गेहूँ कम मिलता है, और घटा हुआ गेहूँ अवसर लागत है। वक्र बाहर की ओर झुकता है क्योंकि अवसर लागत बढ़ती है।</p>"],
["आय का चक्रीय प्रवाह चित्र सहित समझाइए।","<p>दो-क्षेत्रीय अर्थव्यवस्था में परिवार और फर्में होती हैं। <b>वास्तविक प्रवाह:</b> परिवार फर्मों को साधन सेवाएँ देते हैं; फर्में परिवारों को वस्तुएँ और सेवाएँ देती हैं। <b>मौद्रिक प्रवाह:</b> फर्में लगान, मजदूरी, ब्याज और लाभ देती हैं (साधन भुगतान); परिवार फर्मों को उपभोग व्यय देते हैं।</p><p>परिवारों की आय फर्मों के व्यय के बराबर होती है, इसलिए प्रवाह लगातार चलता है। (चित्र 3 बनाइए।)</p>"],
["भारत जैसे विकासशील देश के लिए अर्थशास्त्र का अध्ययन विशेष रूप से क्यों महत्वपूर्ण है?","<ul><li>अधिक जनसंख्या से गरीबी, बेरोज़गारी और असमानता की समस्या, जिसका अध्ययन जरूरी है।</li><li>कृषि बड़ा आजीविका साधन है; कृषि नीति महत्वपूर्ण है।</li><li>नियोजन और पूँजी निर्माण की आवश्यकता।</li><li>GST, UPI, मनरेगा, मेक इन इंडिया जैसी योजनाएँ समझना।</li><li>प्रति व्यक्ति आय और जीवन स्तर बढ़ाना।</li></ul>"],
["अर्थशास्त्र के सैद्धांतिक और व्यावहारिक महत्व की विवेचना कीजिए।","<p><b>सैद्धांतिक (प्रकाशप्रद):</b> ज्ञान बढ़ाता है, माँग, पूर्ति और लागत के नियम समझाता है, तार्किक सोच विकसित करता है और अन्य सामाजिक विज्ञानों का आधार है।</p><p><b>व्यावहारिक (फलप्रद):</b> बजट, व्यापार निर्णय, सरकारी नीति, नियोजन और गरीबी, बेरोज़गारी, महँगाई सुलझाने में सहायक है तथा करियर के अवसर देता है।</p>"],
["माँग का नियम सूची और चित्र सहित बताइए और समझाइए।","<p><b>नियम:</b> अन्य बातें समान रहने पर कीमत घटने से माँगी गई मात्रा बढ़ती है और कीमत बढ़ने से घटती है।</p><table><tr><th>कीमत</th><th>50</th><th>40</th><th>30</th><th>20</th></tr><tr><td>मात्रा</td><td>10</td><td>20</td><td>30</td><td>40</td></tr></table><p>माँग वक्र नीचे की ओर ढलता है (चित्र 5)। <b>कारण:</b> ह्रासमान सीमांत उपयोगिता, आय प्रभाव, प्रतिस्थापन प्रभाव, नए खरीदार। <b>मान्यताएँ:</b> आय, रुचि और संबंधित वस्तुओं की कीमतें स्थिर रहें।</p>"],
["आर्थिक नियोजन और विकास में अर्थशास्त्र की भूमिका समझाइए।","<p>नियोजन का अर्थ है लक्ष्य पाने के लिए साधनों का योजनाबद्ध उपयोग। अर्थशास्त्र साधनों, जनसंख्या, बचत और निवेश के आँकड़े देता है; लक्ष्य (वृद्धि दर, रोज़गार) तय करता है; प्राथमिकताएँ (कृषि, उद्योग, स्वास्थ्य) चुनता है और परिणामों की जाँच करता है। भारत में पंचवर्षीय योजनाएँ चलीं और अब नीति आयोग नीति मार्गदर्शन देता है।</p>"],
["व्यष्टि और समष्टि अर्थशास्त्र को उनके महत्व सहित समझाइए।","<p><b>व्यष्टि:</b> व्यक्तिगत इकाइयों का अध्ययन; कीमत निर्धारण, उपभोक्ता व्यवहार और फर्म के निर्णय समझाता है। <b>समष्टि:</b> पूरी अर्थव्यवस्था का अध्ययन; राष्ट्रीय आय, महँगाई, बेरोज़गारी, वृद्धि और व्यापार समझाता है। व्यष्टि उपभोक्ता और उत्पादक के काम आता है; समष्टि सरकार को राष्ट्रीय नीतियाँ बनाने में सहायक है। दोनों एक-दूसरे के पूरक हैं।</p>"],
["'अर्थशास्त्र विज्ञान भी है और कला भी।' विवेचना कीजिए।","<p><b>विज्ञान:</b> व्यवस्थित ज्ञान, माँग के नियम जैसे नियम, कारण-परिणाम संबंध, आँकड़ों का प्रयोग। <b>पूर्ण विज्ञान नहीं:</b> मानव व्यवहार अनिश्चित है और नियम केवल अन्य बातें समान रहने पर सत्य हैं।</p><p><b>कला:</b> यह बताता है कि लक्ष्य कैसे पाएँ, जैसे महँगाई कैसे रोकें। अतः यह सामाजिक विज्ञान और कला दोनों है।</p>"],
["दैनिक जीवन में अर्थशास्त्र की उपयोगिता दस उदाहरणों सहित समझाइए।","<ol><li>घर का बजट बनाना।</li><li>सस्ती पर अच्छी वस्तु चुनना।</li><li>सब्जियों की कीमतें क्यों बदलती हैं, यह समझना।</li><li>बैंक जमा या निवेश चुनना।</li><li>बिल पर GST समझना।</li><li>UPI का सुरक्षित उपयोग।</li><li>स्कूल के बाद करियर चुनना।</li><li>ऋण पर ब्याज (EMI) समझना।</li><li>उपभोक्ता अधिकार जानना।</li><li>महँगाई और बजट की खबरें समझना।</li></ol>"],
["अर्थशास्त्र गरीबी, बेरोज़गारी और महँगाई को रोकने में कैसे मदद करता है?","<p><b>गरीबी:</b> शिक्षा, कौशल, रोज़गार योजनाएँ, सब्सिडी, PDS। <b>बेरोज़गारी:</b> उद्योग, लघु व्यवसाय, कृषि और प्रशिक्षण को बढ़ावा। <b>महँगाई:</b> पूर्ति बढ़ाना, RBI द्वारा अतिरिक्त मुद्रा घटाना (ब्याज दर बढ़ाकर), जमाखोरी रोकना और सब्सिडी। अर्थशास्त्र कारण खोजता है और उचित उपाय बताता है।</p>"],
["अर्थशास्त्र की सीमाएँ क्या हैं?","<ul><li>मानव व्यवहार अनिश्चित है, इसलिए पूर्वानुमान गलत हो सकते हैं।</li><li>नियम शर्तों पर आधारित हैं ('अन्य बातें समान')।</li><li>प्रयोगशाला प्रयोग संभव नहीं।</li><li>अर्थशास्त्रियों में मतभेद।</li><li>नैतिक या राजनीतिक प्रश्न तय नहीं कर सकता।</li></ul><p>फिर भी अर्थशास्त्र अत्यंत उपयोगी है।</p>"]]);

 s+=`<text x="270" y="60" font-size="16" fill="#2b8a3e" class="fade" style="animation-delay:3.6s">${M.t}</text>
 <circle r="8" fill="#f08c00"><animateMotion dur="6s" begin="3.6s" repeatCount="indefinite" path="M100,70 L420,290"/></circle></svg>`;
 return s}
};

function draw(f){f.querySelector('.svgbox').innerHTML=FIG[f.dataset.f]()}

// ---------- page ----------
let h=`<header class="page"><div class="stamp">${L.cls}</div><h1>${L.title}</h1><p class="sub">${L.sub}</p><p class="stats" id="stats"></p></header>`;
h+=`<nav>${L.sections.map(s=>`<a href="#${s.id}">${s.nav}</a>`).join('')}<a href="#examples">${L.ui.ex}</a><a href="#qa">${L.ui.qa}</a> <button onclick="window.print()">🖨 ${L.ui.print}</button></nav>`;
L.sections.forEach(s=>{
 let body=s.html.replace(/\[\[F(\d)\]\]/g,(m,n)=>{const F=L.figs[n];return `<figure data-f="${n}"><button class="rp">▶ ${L.ui.replay}</button><div class="svgbox"></div><figcaption><b>${L.ui.fig} ${n}:</b> ${F.cap}</figcaption><div class="fexp">${F.exp}</div></figure>`});
 h+=`<section class="page" id="${s.id}"><h2>${s.title}</h2>${body}</section>`});

// examples
h+=`<section class="page" id="examples"><h2>${L.ui.exTitle}</h2><p class="mini">${L.ui.exDesc}</p>`;
L.examples.forEach((e,i)=>{
 h+=`<div class="ex"><h4><span class="lv ${e.lv}">${L.ui.lv[e.lv]}</span>${L.ui.exN} ${i+1}: ${e.t}</h4><p><b>${L.ui.given}:</b> ${e.g}</p><p><b>${e.kind==='proof'?L.ui.proof:L.ui.find}:</b> ${e.f}</p><p><b>${L.ui.sol}:</b></p>${e.s.map((x,j)=>`<span class="step"><b>${L.ui.step} ${j+1}:</b> ${x}</span>`).join('')}<p class="key">✔ ${L.ui.ans}: ${e.a}</p></div>`});
h+='</section>';

// Q&A
let n=0,mcqTotal=0;
h+=`<section class="page" id="qa"><h2>${L.ui.qaTitle}</h2><p class="mini">${L.ui.qaDesc}</p><p class="key" id="score"></p>`;
L.qa.forEach(g=>{
 h+=`<h3>${g.title}</h3>`;
 g.items.forEach(it=>{n++;
  if(g.kind==='mcq'){mcqTotal++;
   h+=`<div class="q mcq" data-ans="${it[2]}"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div>${it[1].map((o,i)=>`<button class="opt" data-i="${i}">(${'abcd'[i]}) ${o}</button>`).join('')}<div class="exp"><b>${L.ui.ans}:</b> (${'abcd'[it[2]]}) ${it[1][it[2]]}. ${it[3]}</div></div>`}
  else if(g.kind==='tf'){
   h+=`<div class="q tf" data-ans="${it[1]?1:0}"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div><button class="opt" data-i="1">${L.ui.t}</button><button class="opt" data-i="0">${L.ui.f}</button><div class="exp"><b>${it[1]?L.ui.t:L.ui.f}.</b> ${it[2]}</div></div>`}
  else{
   h+=`<div class="q"><div class="qt"><span class="no">${L.ui.q}${n}.</span> ${it[0]}</div><details><summary>${L.ui.show}</summary><div class="ans">${it[1]}</div></details></div>`}
 })});
h+='</section>';
document.getElementById('app').innerHTML=h;
document.querySelectorAll('figure').forEach(f=>{draw(f);f.querySelector('.rp').onclick=()=>draw(f)});
document.getElementById('stats').textContent=`${L.ui.total}: ${n} ${L.ui.questions} • ${L.examples.length} ${L.ui.solved} • 5 ${L.ui.animated}`;
let att=0,ok=0;const sc=document.getElementById('score');
const upd=()=>{sc.textContent=`${L.ui.score}: ${ok} / ${att}`};upd();
document.addEventListener('click',e=>{
 const b=e.target.closest('.opt');if(!b)return;
 const q=b.closest('.q');if(q.classList.contains('done'))return;
 q.classList.add('done');att++;
 const a=q.dataset.ans;
 q.querySelectorAll('.opt').forEach(o=>{if(o.dataset.i===a)o.classList.add('right')});
 if(b.dataset.i===a)ok++;else b.classList.add('wrong');
 upd();
});
})();
</script>
</body>
</html>
