<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Class 11 Biology – The Living World (Notes)</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf5;--ink:#1d2b53;--red:#c0392b;--grn:#1e8449;--line:#cfe3f5;--card:#fffef9;--hl:#fff3a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f2a;--ink:#e8ecf7;--red:#ff8a7a;--grn:#6fdc9a;--line:#2c3550;--card:#232838;--hl:#4a4320}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kalam','Segoe Print',cursive;font-size:18px;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
main{max-width:860px;margin:auto;padding:16px 14px 60px}
h1{color:var(--red);text-align:center;font-size:30px;line-height:40px;margin:10px 0 0}.sub{text-align:center;margin-bottom:16px}
h2{color:var(--red);border-bottom:3px wavy var(--red);display:inline-block;margin:24px 0 4px;font-size:24px}
section,.box{background:var(--card);border:2px solid var(--ink);border-radius:14px 4px 16px 6px;padding:6px 16px 10px;margin:14px 0;box-shadow:3px 4px 0 var(--ink)}
ul{margin:4px 0;padding-left:22px}mark{background:var(--hl);color:inherit;padding:0 3px}b{color:var(--red)}
.svgw{overflow-x:auto;text-align:center}svg{max-width:100%;height:auto}svg text{font-family:'Kalam',cursive;fill:var(--ink)}
.lv{animation:pop .7s both}@keyframes pop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.ul{stroke-dasharray:300;animation:dr 2s both}@keyframes dr{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
button{font-family:inherit;font-size:16px;background:var(--hl);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:2px 14px;cursor:pointer}
details{border-bottom:1px dashed var(--ink);padding:4px 0}summary{cursor:pointer;font-weight:700}details>div{color:var(--grn);padding:2px 0 6px 14px}
.o{margin-left:16px}
</style></head><body><main><h1>📒 The Living World</h1><div class="sub">Class 11 · Unit 1 · Chapter 1 · Handwritten-style notes</div><div id="app"></div></main>
<script>
const D={"t": {"mcq": "MCQs (tap to see answer)", "sh": "Short Answer Questions", "lg": "Long Answer Questions", "lev": "Category", "hu": "Human", "ma": "Mango", "arr": "↓ Fewer common characters, more diversity going up ↑", "re": "Replay animation", "g": "Genus (Capital)", "sp": "species (small)", "au": "Author (Linnaeus)", "hd": "Binomial name – handwritten: underline separately"}, "lv": ["Species", "Genus", "Family", "Order", "Class", "Phylum/Division", "Kingdom"], "secs": [["1. What is “Living”?", "<ul><li><b>Living organisms</b> show growth, reproduction, metabolism, cellular organisation and response to environment (consciousness).</li><li>Non-living things (rock, chair) do not show these together.</li></ul>", ""], ["2. Characteristics of Living Things", "<ul><li><b>Growth:</b> increase in mass/number. In living things it is <mark>intrinsic</mark> (from inside, by cell division); in non-living it is only <mark>extrinsic</mark> (accumulation of material on the surface, e.g. a mountain).</li><li>Growth is <b>not</b> a defining property: non-living things also grow; and some organisms don’t grow when mature.</li><li><b>Reproduction:</b> producing offspring of own kind (sexual/asexual). Not defining: mule, sterile worker bees, infertile couples do not reproduce but are alive.</li><li><b>Metabolism:</b> sum of all chemical reactions in the body (anabolism + catabolism). <mark>Metabolism is a defining feature of life</mark> – even isolated metabolic reactions in a test tube are not “living”, but the whole organism is.</li><li><b>Cellular organisation:</b> all living things are made of cells; the cell is the basic unit.</li><li><b>Consciousness:</b> sensing and responding to stimuli (light, water, pollutants, temperature). <mark>Considered the defining property.</mark> Humans are the only organisms self-aware.</li></ul>", ""], ["3. Diversity in the Living World", "<ul><li>About <b>1.7–1.8 million</b> species are described so far; this is <b>biodiversity</b>.</li><li>Many are yet to be discovered; hence need for <b>identification, naming and classification</b>.</li><li><b>Taxonomy</b> = study of identification, nomenclature and classification.</li></ul>", ""], ["4. Binomial Nomenclature", "<ul><li>Introduced by <b>Carolus Linnaeus</b>: every organism gets a two-word scientific name – <b>Genus + species</b>.</li><li>Rules (ICBN for plants, ICZN for animals): names are Latin and <i>italic</i> in print; <mark>1st word (genus) starts with capital, 2nd (species) with small letter</mark>; handwritten, underline each word separately; author’s name abbreviated at the end, e.g. <i>Mangifera indica</i> Linn.</li><li>Each name is unique worldwide, avoiding confusion of local names.</li></ul>", "dg2"], ["5. Taxonomic Categories", "<ul><li>Classification uses a <b>hierarchy</b> of ranks, each called a <b>taxon</b>.</li><li>Order from lowest to highest: <mark>Species → Genus → Family → Order → Class → Phylum (Division for plants) → Kingdom</mark>.</li><li><b>Species:</b> group of individuals that can interbreed and share fundamental characters. <b>Genus:</b> related species with common features (e.g. <i>Panthera leo</i>, <i>P. tigris</i>). <b>Family:</b> related genera. <b>Order:</b> related families. <b>Class:</b> related orders. <b>Phylum/Division:</b> related classes. <b>Kingdom:</b> highest rank.</li><li>Going up, number of common characters decreases.</li><li>Trick: <mark>“King Philip Came Over For Good Soup”</mark> (Kingdom, Phylum, Class, Order, Family, Genus, Species).</li></ul>", "dg1"]], "mcq": [["Which is a defining property of living organisms?", ["Growth", "Reproduction", "Consciousness", "Movement"], "(c) Consciousness (with metabolism)"], ["Binomial nomenclature was given by", ["Aristotle", "Linnaeus", "Darwin", "Haeckel"], "(b) Carolus Linnaeus"], ["In <i>Homo sapiens</i>, sapiens is the", ["Genus", "Species", "Family", "Order"], "(b) Species"], ["Highest taxonomic category is", ["Phylum", "Class", "Kingdom", "Order"], "(c) Kingdom"], ["Number of described species is about", ["17 lakh", "1.7 million", "Both a and b (same)", "17 crore"], "(c) 1.7–1.8 million = 17 lakh"], ["Growth in non-living objects is", ["Intrinsic", "Extrinsic", "None", "Cell division"], "(b) Extrinsic"], ["Which is correct order?", ["Class–Order–Family", "Family–Order–Class", "Order–Class–Family", "Genus–Family–Species"], "(a) Class > Order > Family (ascending hierarchy low→high is Family, Order, Class)"], ["ICZN governs naming of", ["Plants", "Animals", "Bacteria", "Viruses"], "(b) Animals"]], "sh": [["Define taxonomy.", "Science of identification, nomenclature and classification of organisms."], ["Why are scientific names written in italics?", "Latin names are universal; italics (or underline separately when handwritten) mark them as scientific names."], ["Why is a mule considered living though sterile?", "Reproduction is not defining; it shows metabolism, growth and consciousness."], ["What is a taxon?", "Any rank in the hierarchy, e.g. a genus or family."], ["Differentiate growth in living and non-living.", "Living: internal by cell division. Non-living: external accumulation of material."], ["Write the scientific name of man and mango.", "<i>Homo sapiens</i>; <i>Mangifera indica</i>."]], "lg": [["Explain the defining characteristics of living organisms.", "Growth, reproduction, metabolism, cellular organisation and consciousness are features (see Section 2). Among these, <b>metabolism</b> and <b>consciousness</b> are defining because they are present in all living things and absent in non-living; growth and reproduction have exceptions (mule, mature organisms)."], ["Describe binomial nomenclature with rules and an example.", "Two-word system by Linnaeus (Genus + species). Rules: Latin; italics/underlined separately; genus capital, species small; author name at end; unique worldwide. Example: <i>Homo sapiens</i> Linn."], ["Describe the taxonomic hierarchy with human as an example.", "Kingdom Animalia → Phylum Chordata → Class Mammalia → Order Primata → Family Hominidae → Genus <i>Homo</i> → species <i>sapiens</i>. Higher ranks include more diverse organisms with fewer shared characters."]]};
const q=s=>s;let h='';
D.secs.forEach(s=>{h+='<section><h2>'+s[0]+'</h2>'+s[1]+(s[2]?'<div id="'+s[2]+'" class="svgw"></div>':'')+'</section>'});
h+='<h2>'+D.t.mcq+'</h2><div class="box">'+D.mcq.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div class="o">'+m[1].map((o,j)=>'('+'abcd'[j]+') '+o).join('<br>')+'</div><div>✔ '+m[2]+'</div></details>').join('')+'</div>';
h+='<h2>'+D.t.sh+'</h2><div class="box">'+D.sh.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div>'+m[1]+'</div></details>').join('')+'</div>';
h+='<h2>'+D.t.lg+'</h2><div class="box">'+D.lg.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div>'+m[1]+'</div></details>').join('')+'</div>';
document.getElementById('app').innerHTML=h;
function d1(){const L=D.lv,H=['Human','Mango'],A=["Animalia","Chordata","Mammalia","Primata","Hominidae","Homo","sapiens"],B=["Plantae","Angiospermae","Dicotyledonae","Sapindales","Anacardiaceae","Mangifera","indica"];
let s='<svg viewBox="0 0 470 372"><text x="8" y="18" font-weight="700">'+D.t.lev+'</text><text x="215" y="18" font-weight="700">'+D.t.hu+'</text><text x="345" y="18" font-weight="700">'+D.t.ma+'</text>';
for(let i=0;i<7;i++){const w=200-i*20,x=100-w/2+4,y=28+i*48;
s+='<g class="lv" style="animation-delay:'+(i*.7)+'s"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="40" rx="8" fill="'+['#f9c74f','#f9844a','#90be6d','#43aa8b','#4d908e','#577590','#c77dff'][i]+'" stroke="#1d2b53" stroke-width="2"/><text x="104" y="'+(y+26)+'" text-anchor="middle" font-size="15" style="fill:#1d2b53">'+(7-i)+'. '+L[i]+'</text><text x="215" y="'+(y+26)+'" font-size="15">'+A[i]+(i>4?'':'')+'</text><text x="345" y="'+(y+26)+'" font-size="15">'+B[i]+'</text><path d="M208 '+(y+20)+'h-4" stroke="#c0392b"/></g>'}
s+='<text x="8" y="366" font-size="13" style="fill:#c0392b">'+D.t.arr+'</text></svg><br><button onclick="document.getElementById(\'dg1\').innerHTML=d1()">▶ '+D.t.re+'</button>';return s}
function d2(){return '<svg viewBox="0 0 420 190"><text x="20" y="80" font-size="46" font-style="italic" style="fill:#1d2b53">Homo sapiens</text><text x="300" y="80" font-size="26">Linn.</text><path class="ul" d="M20 92h88" stroke="#c0392b" stroke-width="3"/><path class="ul" style="animation-delay:.8s" d="M122 92h160" stroke="#1e8449" stroke-width="3"/><path d="M60 100v34M190 100v34M330 90v44" stroke="#1d2b53" stroke-width="2"/><text x="14" y="158" font-size="15">'+D.t.g+'</text><text x="130" y="158" font-size="15">'+D.t.sp+'</text><text x="285" y="158" font-size="15">'+D.t.au+'</text><text x="20" y="30" font-size="15" style="fill:#c0392b">'+D.t.hd+'</text></svg>'}
document.getElementById('dg1').innerHTML=d1();document.getElementById('dg2').innerHTML=d2();
</script></body></html>
