<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>कक्षा 11 जीव विज्ञान – जीव जगत (नोट्स)</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf5;--ink:#1d2b53;--red:#c0392b;--grn:#1e8449;--line:#cfe3f5;--card:#fffef9;--hl:#fff3a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f2a;--ink:#e8ecf7;--red:#ff8a7a;--grn:#6fdc9a;--line:#2c3550;--card:#232838;--hl:#4a4320}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kalam','Segoe Print',cursive;font-size:18px;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
main{max-width:860px;margin:auto;padding:16px 14px 60px}
h1{color:var(--red);text-align:center;font-size:30px;line-height:40px;margin:10px 0 0}.sub{text-align:center;margin-bottom:16px}
h2{color:var(--red);border-bottom:3px wavy var(--red);display:inline-block;margin:24px 0 4px;font-size:24px}
section,.box{background:var(--card);border:2px solid var(--ink);border-radius:14px 4px 16px 6px;padding:6px 16px 10px;margin:14px 0;box-shadow:3px 4px 0 var(--ink)}
ul{margin:4px 0;padding-left:22px}mark{background:var(--hl);color:inherit;padding:0 3px}b{color:var(--red)}
.svgw{overflow-x:auto;text-align:center}svg{max-width:100%;height:auto}svg text{font-family:'Kalam',cursive;fill:var(--ink)}
.lv{animation:pop .7s both}@keyframes pop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.ul{stroke-dasharray:300;animation:dr 2s both}@keyframes dr{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
button{font-family:inherit;font-size:16px;background:var(--hl);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:2px 14px;cursor:pointer}
details{border-bottom:1px dashed var(--ink);padding:4px 0}summary{cursor:pointer;font-weight:700}details>div{color:var(--grn);padding:2px 0 6px 14px}
.o{margin-left:16px}
</style></head><body><main><h1>📒 जीव जगत</h1><div class="sub">कक्षा 11 · इकाई 1 · अध्याय 1 · हस्तलिखित शैली के नोट्स</div><div id="app"></div></main>
<script>
const D={"t": {"mcq": "बहुविकल्पीय प्रश्न (उत्तर देखने के लिए दबाएँ)", "sh": "लघु उत्तरीय प्रश्न", "lg": "दीर्घ उत्तरीय प्रश्न", "lev": "संवर्ग", "hu": "मनुष्य", "ma": "आम", "arr": "↓ नीचे जाने पर समान लक्षण अधिक, ऊपर विविधता अधिक ↑", "re": "एनिमेशन दोबारा चलाएँ", "g": "वंश (बड़ा अक्षर)", "sp": "जाति (छोटा अक्षर)", "au": "लेखक (लिनियस)", "hd": "द्विनाम पद्धति – हाथ से लिखते समय प्रत्येक शब्द के नीचे अलग रेखा"}, "lv": ["जाति", "वंश", "कुल", "गण", "वर्ग", "संघ/डिवीज़न", "जगत"], "secs": [["1. जीव क्या है?", "<ul><li><b>सजीवों</b> में वृद्धि, जनन, उपापचय, कोशिकीय संगठन और पर्यावरण के प्रति अनुक्रिया (चेतना) पाई जाती है।</li><li>निर्जीव वस्तुओं (पत्थर, कुर्सी) में ये सभी लक्षण एक साथ नहीं होते।</li></ul>", ""], ["2. सजीवों के लक्षण", "<ul><li><b>वृद्धि:</b> द्रव्यमान/संख्या में वृद्धि। सजीवों में यह <mark>आंतरिक</mark> (कोशिका विभाजन से) होती है; निर्जीवों में केवल <mark>बाह्य</mark> (सतह पर पदार्थ जमा होने से, जैसे पर्वत)।</li><li>वृद्धि <b>परिभाषित लक्षण नहीं</b> है, क्योंकि निर्जीव भी बढ़ते हैं और कुछ परिपक्व जीव नहीं बढ़ते।</li><li><b>जनन:</b> अपने जैसी संतान उत्पन्न करना (लैंगिक/अलैंगिक)। परिभाषित लक्षण नहीं: खच्चर, बंध्य मजदूर मधुमक्खी, बंध्य दंपत्ति जनन नहीं करते पर सजीव हैं।</li><li><b>उपापचय:</b> शरीर की सभी रासायनिक अभिक्रियाओं का योग (उपचय + अपचय)। <mark>उपापचय सजीवों का परिभाषित लक्षण है।</mark></li><li><b>कोशिकीय संगठन:</b> सभी सजीव कोशिकाओं से बने हैं; कोशिका मूल इकाई है।</li><li><b>चेतना:</b> प्रकाश, जल, ताप, प्रदूषक आदि उद्दीपनों को महसूस कर अनुक्रिया करना। <mark>यह मुख्य परिभाषित लक्षण माना जाता है।</mark> केवल मनुष्य स्वयं के प्रति सचेत है।</li></ul>", ""], ["3. जीव जगत में विविधता", "<ul><li>अब तक लगभग <b>17–18 लाख</b> जातियाँ ज्ञात हैं, यही <b>जैव विविधता</b> है।</li><li>बहुत-सी जातियाँ अभी खोजी जानी हैं, इसलिए <b>पहचान, नामकरण व वर्गीकरण</b> आवश्यक है।</li><li><b>वर्गिकी (Taxonomy)</b> = पहचान, नामकरण और वर्गीकरण का विज्ञान।</li></ul>", ""], ["4. द्विनाम नामकरण पद्धति", "<ul><li><b>कैरोलस लिनियस</b> ने दी: हर जीव का दो शब्दों का वैज्ञानिक नाम – <b>वंश + जाति</b>।</li><li>नियम (ICBN पौधे, ICZN जंतु): नाम लैटिन में, छपाई में <i>तिरछे (italic)</i>; <mark>पहला शब्द (वंश) बड़े अक्षर से, दूसरा (जाति) छोटे अक्षर से</mark>; हाथ से लिखते समय दोनों शब्दों के नीचे अलग-अलग रेखा; अंत में लेखक का संक्षिप्त नाम, जैसे <i>Mangifera indica</i> Linn.</li><li>हर नाम पूरे विश्व में अद्वितीय होता है, स्थानीय नामों का भ्रम नहीं रहता।</li></ul>", "dg2"], ["5. वर्गिकी संवर्ग", "<ul><li>वर्गीकरण <b>पदानुक्रम</b> में होता है; हर स्तर को <b>टैक्सॉन</b> कहते हैं।</li><li>निम्न से उच्च क्रम: <mark>जाति → वंश → कुल → गण → वर्ग → संघ (पादपों में डिवीज़न) → जगत</mark>।</li><li><b>जाति:</b> आपस में प्रजनन करने वाले व समान मूल लक्षण वाले जीव। <b>वंश:</b> संबंधित जातियाँ (जैसे <i>Panthera leo</i>, <i>P. tigris</i>)। <b>कुल:</b> संबंधित वंश। <b>गण:</b> संबंधित कुल। <b>वर्ग:</b> संबंधित गण। <b>संघ:</b> संबंधित वर्ग। <b>जगत:</b> सर्वोच्च संवर्ग।</li><li>ऊपर जाने पर समान लक्षणों की संख्या घटती है।</li></ul>", "dg1"]], "mcq": [["सजीवों का परिभाषित लक्षण कौन-सा है?", ["वृद्धि", "जनन", "चेतना", "गति"], "(c) चेतना (उपापचय के साथ)"], ["द्विनाम पद्धति किसने दी?", ["अरस्तू", "लिनियस", "डार्विन", "हैकेल"], "(b) कैरोलस लिनियस"], ["<i>Homo sapiens</i> में sapiens है", ["वंश", "जाति", "कुल", "गण"], "(b) जाति"], ["सर्वोच्च वर्गिकी संवर्ग है", ["संघ", "वर्ग", "जगत", "गण"], "(c) जगत"], ["ज्ञात जातियों की संख्या लगभग है", ["17 लाख", "1.7 करोड़", "17 हज़ार", "17 अरब"], "(a) 17–18 लाख"], ["निर्जीवों में वृद्धि होती है", ["आंतरिक", "बाह्य", "कोशिका विभाजन से", "कभी नहीं"], "(b) बाह्य"], ["सही क्रम (निम्न से उच्च) है", ["वर्ग–गण–कुल", "कुल–गण–वर्ग", "गण–वर्ग–कुल", "वंश–कुल–जाति"], "(b) कुल → गण → वर्ग"], ["ICZN किसके नामकरण से संबंधित है?", ["पौधे", "जंतु", "जीवाणु", "विषाणु"], "(b) जंतु"]], "sh": [["वर्गिकी की परिभाषा लिखिए।", "जीवों की पहचान, नामकरण और वर्गीकरण का विज्ञान।"], ["वैज्ञानिक नाम तिरछे क्यों लिखते हैं?", "लैटिन नाम सार्वभौमिक होते हैं; तिरछे (हाथ से लिखने पर अलग-अलग रेखांकित) लिखने से वैज्ञानिक नाम की पहचान होती है।"], ["खच्चर बंध्य होने पर भी सजीव क्यों है?", "जनन परिभाषित लक्षण नहीं है; उसमें उपापचय, वृद्धि और चेतना होती है।"], ["टैक्सॉन क्या है?", "वर्गीकरण पदानुक्रम का कोई भी स्तर, जैसे वंश या कुल।"], ["सजीव और निर्जीव की वृद्धि में अंतर बताइए।", "सजीव: कोशिका विभाजन से आंतरिक। निर्जीव: सतह पर पदार्थ जमा होने से बाह्य।"], ["मनुष्य और आम के वैज्ञानिक नाम लिखिए।", "<i>Homo sapiens</i>; <i>Mangifera indica</i>।"]], "lg": [["सजीवों के परिभाषित लक्षणों का वर्णन कीजिए।", "वृद्धि, जनन, उपापचय, कोशिकीय संगठन व चेतना (खंड 2 देखें)। इनमें <b>उपापचय</b> और <b>चेतना</b> परिभाषित हैं क्योंकि ये सभी सजीवों में होते हैं और निर्जीवों में नहीं; वृद्धि व जनन के अपवाद हैं (खच्चर, परिपक्व जीव)।"], ["द्विनाम पद्धति को नियमों व उदाहरण सहित समझाइए।", "लिनियस की दो शब्दों की पद्धति (वंश + जाति)। नियम: लैटिन; तिरछे/अलग रेखांकित; वंश बड़े अक्षर से, जाति छोटे से; अंत में लेखक का नाम; विश्व में अद्वितीय। उदाहरण: <i>Homo sapiens</i> Linn."], ["मनुष्य के उदाहरण से वर्गिकी पदानुक्रम समझाइए।", "जगत Animalia → संघ Chordata → वर्ग Mammalia → गण Primata → कुल Hominidae → वंश <i>Homo</i> → जाति <i>sapiens</i>। ऊँचे संवर्ग में अधिक विविध जीव व कम समान लक्षण होते हैं।"]]};
const q=s=>s;let h='';
D.secs.forEach(s=>{h+='<section><h2>'+s[0]+'</h2>'+s[1]+(s[2]?'<div id="'+s[2]+'" class="svgw"></div>':'')+'</section>'});
h+='<h2>'+D.t.mcq+'</h2><div class="box">'+D.mcq.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div class="o">'+m[1].map((o,j)=>'('+'abcd'[j]+') '+o).join('<br>')+'</div><div>✔ '+m[2]+'</div></details>').join('')+'</div>';
h+='<h2>'+D.t.sh+'</h2><div class="box">'+D.sh.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div>'+m[1]+'</div></details>').join('')+'</div>';
h+='<h2>'+D.t.lg+'</h2><div class="box">'+D.lg.map((m,i)=>'<details><summary>Q'+(i+1)+'. '+m[0]+'</summary><div>'+m[1]+'</div></details>').join('')+'</div>';
document.getElementById('app').innerHTML=h;
function d1(){const L=D.lv,H=['Human','Mango'],A=["Animalia","Chordata","Mammalia","Primata","Hominidae","Homo","sapiens"],B=["Plantae","Angiospermae","Dicotyledonae","Sapindales","Anacardiaceae","Mangifera","indica"];
let s='<svg viewBox="0 0 470 372"><text x="8" y="18" font-weight="700">'+D.t.lev+'</text><text x="215" y="18" font-weight="700">'+D.t.hu+'</text><text x="345" y="18" font-weight="700">'+D.t.ma+'</text>';
for(let i=0;i<7;i++){const w=200-i*20,x=100-w/2+4,y=28+i*48;
s+='<g class="lv" style="animation-delay:'+(i*.7)+'s"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="40" rx="8" fill="'+['#f9c74f','#f9844a','#90be6d','#43aa8b','#4d908e','#577590','#c77dff'][i]+'" stroke="#1d2b53" stroke-width="2"/><text x="104" y="'+(y+26)+'" text-anchor="middle" font-size="15" style="fill:#1d2b53">'+(7-i)+'. '+L[i]+'</text><text x="215" y="'+(y+26)+'" font-size="15">'+A[i]+(i>4?'':'')+'</text><text x="345" y="'+(y+26)+'" font-size="15">'+B[i]+'</text><path d="M208 '+(y+20)+'h-4" stroke="#c0392b"/></g>'}
s+='<text x="8" y="366" font-size="13" style="fill:#c0392b">'+D.t.arr+'</text></svg><br><button onclick="document.getElementById(\'dg1\').innerHTML=d1()">▶ '+D.t.re+'</button>';return s}
function d2(){return '<svg viewBox="0 0 420 190"><text x="20" y="80" font-size="46" font-style="italic" style="fill:#1d2b53">Homo sapiens</text><text x="300" y="80" font-size="26">Linn.</text><path class="ul" d="M20 92h88" stroke="#c0392b" stroke-width="3"/><path class="ul" style="animation-delay:.8s" d="M122 92h160" stroke="#1e8449" stroke-width="3"/><path d="M60 100v34M190 100v34M330 90v44" stroke="#1d2b53" stroke-width="2"/><text x="14" y="158" font-size="15">'+D.t.g+'</text><text x="130" y="158" font-size="15">'+D.t.sp+'</text><text x="285" y="158" font-size="15">'+D.t.au+'</text><text x="20" y="30" font-size="15" style="fill:#c0392b">'+D.t.hd+'</text></svg>'}
document.getElementById('dg1').innerHTML=d1();document.getElementById('dg2').innerHTML=d2();
</script></body></html>
