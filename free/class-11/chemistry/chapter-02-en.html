.fc.th{border-left-style:double;border-left-width:8px}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.fn{font-family:"Baloo 2",sans-serif;font-weight:600;color:var(--c);font-size:1rem;line-height:1.3}
.fx{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.08rem;margin-top:3px;word-break:break-word;transition:filter .3s}

.tgJ{background:#2a6fdb}.tgN{background:#2e9e5b}.tgB{background:#8a3ffc}
.trick{margin-top:18px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--card));border:1.5px dashed var(--c);font-weight:600;animation:in .6s both}

.tb{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}

svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
input[type=range]{width:100%;accent-color:var(--c)}

footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
