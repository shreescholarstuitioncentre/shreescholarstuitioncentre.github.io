<style>

:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}

button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
var D={"ui": {"prog": "Revised: {n}/14 chapters", "win": "🎉 Superb! All 14 chapters revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w1": "⚛️ Bohr Atom: Spectral Lines", "a1": "From orbit nᵢ", "a2": "To orbit n_f", "em": "🔆 Emission", "ab": "🌑 Absorption", "se": ["Lyman (UV)", "Balmer (mostly visible)", "Paschen (IR)", "Brackett (IR)", "Pfund (IR)", "Humphreys (IR)", "IR"], "w5": "🧪 pH Beaker", "ph": "pH", "ac": "🍋 Acidic", "ba": "🧼 Basic", "ne": "💧 Neutral", "w12": "🎈 Gas in a Box (PV = nRT)", "gt": "Temperature T", "gv": "Volume V"}, "ch": [{"s": "Basic Concepts", "t": "Some Basic Concepts of Chemistry", "k": [["📘 Key Ideas", "Laws: conservation of mass, definite & multiple proportions, Gay-Lussac, Avogadro. 1 mole = 6.022×10²³ entities. <b>Limiting reagent</b> is consumed first and fixes the product amount. Empirical formula → molecular formula via n = molar mass / empirical mass."], ["🧮 Formulas", "n = m/M = N/N<sub>A</sub> = V/22.4 L (STP, 273 K, 1 atm)<br>Molarity = mol/L solution; molality = mol/kg solvent; x<sub>A</sub> = n<sub>A</sub>/Σn<br>% yield = actual/theoretical × 100"], ["⚠️ Exam Trap", "Molarity changes with temperature (volume changes); molality and mole fraction do not. Zeros between non-zero digits are significant; leading zeros are not."]], "q": [["Molecules in 18 g of water?", "1 mole = 6.022×10²³ molecules."], ["Which concentration term is temperature-independent?", "Molality (and mole fraction)."]]}, {"s": "Structure of Atom", "t": "Structure of Atom", "k": [["📘 Key Ideas", "Rutherford: dense positive nucleus (α-scattering). Bohr: quantised orbits, no radiation in stationary state. de Broglie: matter waves. Heisenberg: position and momentum can't both be known exactly. Quantum numbers n, l, m<sub>l</sub>, m<sub>s</sub>. Filling: <b>Aufbau, Pauli, Hund</b>."], ["🧮 Formulas", "r<sub>n</sub> = 0.529 n²/Z Å; E<sub>n</sub> = −13.6 Z²/n² eV<br>1/λ = R<sub>H</sub>Z²(1/n₁² − 1/n₂²), R<sub>H</sub> = 1.097×10⁷ m⁻¹<br>λ = h/mv; Δx·Δp ≥ h/4π<br>Radial nodes = n − l − 1; angular nodes = l; max e⁻ in shell = 2n²"], ["⚠️ Exam Trap", "Cr = 3d⁵4s¹ and Cu = 3d¹⁰4s¹ are exceptions (half/full-filled stability). 4s fills before 3d but loses electrons first."]], "q": [["Number of orbitals in n = 3?", "n² = 9 orbitals."], ["Maximum electrons with l = 2?", "10 (five d-orbitals × 2)."]]}, {"s": "Periodicity", "t": "Classification of Elements & Periodicity", "k": [["📘 Key Ideas", "Modern periodic law: properties are periodic functions of atomic number. Across a period: radius ↓, IE ↑, EN ↑ (Z<sub>eff</sub> ↑). Down a group: radius ↑, IE ↓, EN ↓."], ["🧮 Formulas", "Z<sub>eff</sub> = Z − σ (Slater)<br>Mulliken EN = (IE + EA)/2<br>Isoelectronic species: larger Z ⇒ smaller radius (Na⁺ &lt; F⁻)"], ["⚠️ Exam Trap", "IE anomalies: Be &gt; B, Mg &gt; Al, N &gt; O, P &gt; S. Electron affinity: Cl &gt; F (small 2p crowding in F)."]], "q": [["Why is IE of N greater than O?", "Half-filled 2p³ is extra stable."], ["Element with highest electron affinity?", "Chlorine."]]}, {"s": "Chemical Bonding", "t": "Chemical Bonding & Molecular Structure", "k": [["📘 Key Ideas", "Ionic (lattice energy, Born–Haber), covalent, coordinate bonds. <b>VSEPR</b> predicts shape; hybridisation explains it; <b>MOT</b> explains magnetism and bond order. Shapes: sp linear, sp² trigonal planar, sp³ tetrahedral, sp³d TBP, sp³d² octahedral."], ["🧮 Formulas", "Formal charge = V − N − B/2<br>Bond order = ½(N<sub>b</sub> − N<sub>a</sub>); μ = q × d<br>H = ½(V + M − C + A)<br>Order: lp–lp &gt; lp–bp &gt; bp–bp repulsion"], ["⚠️ Exam Trap", "O₂ is paramagnetic (two unpaired e⁻ in π*) – Lewis structure fails, MOT succeeds. BO: O₂ = 2, O₂⁺ = 2.5, O₂⁻ = 1.5, N₂ = 3."]], "q": [["Shape of NH₃?", "Pyramidal (sp³, one lone pair)."], ["Bond order of N₂?", "3 (σ + 2π)."]]}, {"s": "Thermodynamics", "t": "Thermodynamics", "k": [["📘 Key Ideas", "State functions: U, H, S, G. First law ΔU = q + w. <b>Hess's law</b>: ΔH depends only on initial and final states. Spontaneity needs ΔG &lt; 0; entropy of universe increases (2nd law)."], ["🧮 Formulas", "ΔU = q + w; w = −PΔV; ΔH = ΔU + Δn<sub>g</sub>RT<br>ΔG = ΔH − TΔS; ΔG° = −RT ln K<br>w<sub>rev,iso</sub> = −2.303 nRT log(V₂/V₁)"], ["⚠️ Exam Trap", "IUPAC: work done <i>on</i> the system is positive. q and w are path functions. Spontaneous at all T only when ΔH &lt; 0 and ΔS &gt; 0."]], "q": [["ΔU for isothermal ideal-gas expansion?", "Zero (U depends only on T)."], ["When is ΔG negative at all temperatures?", "ΔH &lt; 0 and ΔS &gt; 0."]]}, {"s": "Equilibrium", "t": "Equilibrium", "k": [["📘 Key Ideas", "Chemical equilibrium is dynamic; <b>Le Chatelier</b> predicts shifts. Ionic equilibrium: acids/bases, pH, buffers, hydrolysis, K<sub>sp</sub>, common-ion effect."], ["🧮 Formulas", "K<sub>p</sub> = K<sub>c</sub>(RT)^Δn; Q vs K decides direction<br>pH = −log[H⁺]; pH + pOH = 14; K<sub>w</sub> = 10⁻¹⁴<br>Buffer: pH = pK<sub>a</sub> + log([salt]/[acid])"], ["⚠️ Exam Trap", "Only temperature changes K. A catalyst speeds both directions equally and doesn't shift equilibrium. Adding inert gas at constant volume has no effect."]], "q": [["pH of 0.001 M HCl?", "3."], ["Does a catalyst change K<sub>c</sub>?", "No – only reaches equilibrium faster."]]}, {"s": "Redox Reactions", "t": "Redox Reactions", "k": [["📘 Key Ideas", "Oxidation = loss of e⁻ (↑ oxidation number); reduction = gain. Balance by oxidation-number or ion-electron method. <b>Disproportionation</b>: same species oxidised and reduced."], ["🧮 Formulas", "Σ oxidation numbers = net charge<br>O = −2 (peroxide −1, OF₂ +2); H = +1 (metal hydrides −1)<br>n-factor decides equivalents"], ["⚠️ Exam Trap", "Fe₃O₄ has fractional average +8/3; Na₂S₄O₆ has S = +2.5 (average). The oxidising agent itself is reduced."]], "q": [["Oxidation number of Cr in K₂Cr₂O₇?", "+6."], ["Example of disproportionation?", "Cl₂ + OH⁻ → Cl⁻ + ClO⁻ (or 2H₂O₂ → 2H₂O + O₂)."]]}, {"s": "Organic Basics", "t": "Organic Chemistry – Basic Principles", "k": [["📘 Key Ideas", "IUPAC naming, isomerism, electronic effects (inductive, resonance, hyperconjugation), intermediates, purification (crystallisation, distillation, chromatography) and analysis (Lassaigne, Dumas, Kjeldahl, Carius)."], ["🧮 Formulas", "Carbocation: 3° &gt; 2° &gt; 1° &gt; CH₃⁺ (carbanion opposite)<br>%C = (12/44)(m<sub>CO₂</sub>/m)×100; %H = (2/18)(m<sub>H₂O</sub>/m)×100<br>Kjeldahl: %N = 1.4 × N × V/m<br>R<sub>f</sub> = solute distance / solvent distance"], ["⚠️ Exam Trap", "Kjeldahl fails for nitro, azo compounds and ring-N (pyridine); Dumas works for all nitrogen. Resonance beats inductive effect."]], "q": [["Most stable carbocation type?", "Tertiary (hyperconjugation + +I)."], ["What is R<sub>f</sub> in chromatography?", "Distance moved by solute ÷ distance moved by solvent."]]}, {"s": "Hydrocarbons", "t": "Hydrocarbons", "k": [["📘 Key Ideas", "Alkanes: free-radical substitution, Wurtz. Alkenes: Markovnikov addition, peroxide (anti-Markovnikov, HBr only), ozonolysis. Alkynes: acidic H, hydration. Benzene: electrophilic substitution; aromatic if (4n+2)π e⁻ (Hückel)."], ["🧮 Formulas", "C<sub>n</sub>H<sub>2n+2</sub>, C<sub>n</sub>H<sub>2n</sub>, C<sub>n</sub>H<sub>2n−2</sub><br>Saytzeff: more substituted alkene is major<br>Halogenation of alkane: Cl₂ fast, Br₂ selective<br>CaC₂ + 2H₂O → C₂H₂ + Ca(OH)₂"], ["⚠️ Exam Trap", "Peroxide effect works only with HBr. Hydration of acetylene gives acetaldehyde (all other alkynes give ketones). Only terminal alkynes react with NaNH₂."]], "q": [["Product of propene + HBr (no peroxide)?", "2-Bromopropane (Markovnikov)."], ["Is benzene aromatic? Why?", "Yes – planar, cyclic, 6 π e⁻ (4n+2, n = 1)."]]}, {"s": "p-Block", "t": "p-Block Elements (Groups 13 & 14)", "k": [["📘 Key Ideas", "Boron family: borax, boric acid, <b>diborane</b> (banana bonds). Carbon family: diamond (sp³), graphite (sp²), fullerene C₆₀, silicates and silicones, CO and CO₂. Inert-pair effect lowers stable oxidation state down the group."], ["🧮 Formulas", "Borax = Na₂B₄O₇·10H₂O<br>B₂H₆: 2 three-centre-two-electron (3c–2e) bonds<br>Stable: Tl⁺ &gt; Tl³⁺; Pb²⁺ &gt; Pb⁴⁺<br>Lewis acidity: BF₃ &lt; BCl₃ &lt; BBr₃"], ["⚠️ Exam Trap", "Boric acid is a weak monobasic <i>Lewis</i> acid (accepts OH⁻), not a proton donor. BF₃ is weaker than BCl₃ due to back-bonding. Graphite conducts; diamond does not."]], "q": [["Hybridisation of C in graphite?", "sp²."], ["Why is Pb(IV) a strong oxidising agent?", "Inert-pair effect – Pb(II) is more stable."]]}, {"s": "s-Block", "t": "s-Block Elements", "k": [["📘 Key Ideas", "Alkali and alkaline-earth metals: flame colours, strong reductants, <b>Solvay process</b>, NaOH, CaO, plaster of Paris, biological roles (Na⁺/K⁺ pump, Mg in chlorophyll, Ca in bones). Diagonal relationship: Li–Mg, Be–Al."], ["🧮 Formulas", "NaCl + NH₃ + CO₂ + H₂O → NaHCO₃ + NH₄Cl → Na₂CO₃<br>Gypsum CaSO₄·2H₂O; POP = CaSO₄·½H₂O<br>Flame: Li crimson, Na yellow, K violet, Ca brick-red, Sr crimson, Ba green"], ["⚠️ Exam Trap", "Li is the strongest reductant in water (highest hydration enthalpy) though Cs is most reactive in gas phase. Li₂CO₃ decomposes on heating; other alkali carbonates don't."]], "q": [["Flame colour of sodium?", "Golden yellow."], ["Which alkali metal shows diagonal relation with Mg?", "Lithium."]]}, {"s": "Hydrogen", "t": "Hydrogen", "k": [["📘 Key Ideas", "Isotopes: protium, deuterium, tritium (radioactive). Preparation: Zn + acid, water-gas shift, electrolysis. Hydrides: ionic, covalent, metallic. Hardness of water, H₂O₂ (open-book structure), heavy water D₂O."], ["🧮 Formulas", "C + H₂O → CO + H₂ (water gas)<br>CO + H₂O → CO₂ + H₂ (shift)<br>2H₂O₂ → 2H₂O + O₂<br>Hardness: Clark's method, Calgon, ion exchange"], ["⚠️ Exam Trap", "Temporary hardness (bicarbonates) goes by boiling; permanent hardness (Cl⁻, SO₄²⁻ of Ca/Mg) needs Calgon or ion exchange. H₂O₂ acts as both oxidant and reductant."]], "q": [["Which hydrogen isotope is radioactive?", "Tritium (β-emitter)."], ["Structure of H₂O₂?", "Non-planar open-book, with O–O bond."]]}, {"s": "States of Matter", "t": "States of Matter", "k": [["📘 Key Ideas", "Gas laws (Boyle, Charles, Avogadro, Dalton, Graham), kinetic theory, real gases (van der Waals), critical constants, liquefaction, surface tension, viscosity."], ["🧮 Formulas", "PV = nRT; (P + an²/V²)(V − nb) = nRT<br>u<sub>rms</sub> = √(3RT/M); u<sub>mp</sub> : u<sub>avg</sub> : u<sub>rms</sub> = 1 : 1.128 : 1.224<br>Graham: r₁/r₂ = √(M₂/M₁)<br>Z = PV/nRT; T<sub>c</sub> = 8a/27Rb"], ["⚠️ Exam Trap", "Real gases act ideally at high T and low P. 'a' measures attraction, 'b' molecular size. Z &lt; 1 ⇒ attraction dominates; Z &gt; 1 ⇒ repulsion dominates."]], "q": [["u<sub>rms</sub> ratio of H₂ to O₂ at same T?", "4 : 1 (√(32/2))."], ["Z &gt; 1 at very high pressure – why?", "Repulsive forces (molecular size, b) dominate."]]}, {"s": "Environmental", "t": "Environmental Chemistry", "k": [["📘 Key Ideas", "Air pollutants: CO, NOₓ, SO₂, particulates. Classical vs photochemical smog; acid rain (pH &lt; 5.6); greenhouse gases (CO₂, CH₄, N₂O, CFC); ozone depletion by CFCs; water pollution (BOD); green chemistry."], ["🧮 Formulas", "Cl• + O₃ → ClO• + O₂; ClO• + O → Cl• + O₂ (chain)<br>Acid rain: pH &lt; 5.6<br>BOD: clean water &lt; 5 ppm; polluted &gt; 17 ppm"], ["⚠️ Exam Trap", "Ozone is protective in the stratosphere but a pollutant in the troposphere. Antarctic ozone hole forms with polar stratospheric clouds. One Cl• destroys ~10⁵ O₃ molecules."]], "q": [["Main cause of acid rain?", "SO₂ and NO₂ forming H₂SO₄ and HNO₃."], ["Higher BOD means?", "More organic pollution, less dissolved oxygen."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
