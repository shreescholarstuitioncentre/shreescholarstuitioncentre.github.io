body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}

button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}

.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}

.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}

code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg text{fill:var(--mut);font-size:11px}svg circle.pt{transition:fill .3s}

<script>
var D={"ui": {"prog": "Revised: {n}/12 chapters", "win": "🎉 Superb! All 12 chapters revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w4": "📏 Mean vs Median – Add an Outlier", "ov": "8th value", "mean": "Mean", "med": "Median", "mode": "Mode", "rg": "Range", "w5": "📈 Correlation Playground", "pe": "Perfect", "hi": "High", "mo": "Moderate", "lo": "Low", "no": "No correlation", "ps": "Positive", "ng": "Negative", "w6": "🧮 Index Number Lab", "nt6": "Base prices ₹20, ₹30, ₹40; base qty 10, 5, 8; current qty 12, 4, 9", "it": ["Wheat price now", "Rice price now", "Milk price now"], "inf": "Inflation", "w9": "📉 Demand & Elasticity", "pr": "Price", "inc": "Demand shift (income)", "el": "Elastic", "ie": "Inelastic", "un": "Unitary", "rt": "→ shift right", "lf": "← shift left", "w10": "🏭 Producer's Equilibrium (P = MC)", "fc": "Fixed cost", "pf": "Profit", "op": "Operate", "ls": "Operate – minimising loss", "sh": "Shut down (P &lt; AVC)", "w11": "⚖️ Market Equilibrium", "sd": "Demand shift", "ss": "Supply shift", "eq": "Market clears", "es": "Excess supply", "ed": "Excess demand"}, "ch": [{"s": "Introduction", "t": "Statistics – Introduction", "k": [["📘 Key Ideas", "Statistics is the study of collection, organisation, presentation, analysis and interpretation of data. In the plural it means numerical facts; in the singular it means methods. Functions: simplification, comparison, forecasting, policy formulation. Scope in economics: consumption, production, distribution, public finance."], ["🧮 Formulas &amp; Methods", "<b>Features of statistical data:</b> aggregates, affected by multiple causes, numerically expressed, reasonably accurate, collected systematically<br><b>Limitations:</b> doesn't study individuals, qualitative aspects or isolated facts; can be misused<br><b>Descriptive</b> (summarises) vs <b>Inferential</b> (draws conclusions from samples)"], ["⚠️ Exam Trap", "Statistics deals with <i>aggregates</i>, not single facts. Statistical laws are true on average, not for each case. Data must be comparable and homogeneous."]], "q": [["Why is a single figure not 'statistics'?", "Statistics refers to aggregates of facts that can be compared, not isolated figures."], ["Two limitations of statistics?", "It ignores individuals and qualitative aspects and can be misused."]]}, {"s": "Collection of Data", "t": "Collection of Data", "k": [["📘 Key Ideas", "<b>Primary data</b> is collected first-hand; <b>secondary data</b> already exists. Methods: direct personal investigation, indirect oral, local sources, schedules (via enumerators) and questionnaires (mailed). Census studies the whole population; sample studies a part. Sampling: random (lottery, random number table) and non-random (deliberate, convenience)."], ["🧮 Formulas &amp; Methods", "<b>Sources of secondary data:</b> Census, NSSO, RBI, Economic Survey<br><b>Errors:</b> sampling error (sample vs population difference); non-sampling error (measurement, non-response, bias)<br>Census: accurate but costly &amp; slow; sample: cheaper, faster"], ["⚠️ Exam Trap", "In random sampling every unit has an equal chance of selection. Larger samples reduce sampling error but not non-sampling error. Questionnaire is filled by respondent; schedule by enumerator."]], "q": [["Census vs sample survey?", "Census studies every unit; sample studies a selected part and is cheaper and faster."], ["What is a questionnaire?", "A set of questions mailed to respondents who fill it themselves."]]}, {"s": "Organisation of Data", "t": "Organisation of Data", "k": [["📘 Key Ideas", "Raw data is arranged through classification into frequency distributions. Variables are discrete or continuous. Exclusive method excludes the upper limit; inclusive method includes both limits (convert by adjusting by 0.5). Cumulative frequency gives 'less than' and 'more than' totals."], ["🧮 Formulas &amp; Methods", "Class interval = Upper limit − Lower limit<br>Mid-value = (Lower + Upper)/2<br>Range = Maximum − Minimum<br>Ideal number of classes: 5–15"], ["⚠️ Exam Trap", "In the exclusive method the upper limit belongs to the <i>next</i> class. Convert inclusive to exclusive by subtracting 0.5 from lower and adding 0.5 to upper limit. Tally marks are used in tallying."]], "q": [["Convert 10–19, 20–29 to exclusive.", "9.5–19.5, 19.5–29.5."], ["What is class mid-value?", "The average of lower and upper limit of the class."]]}, {"s": "Presentation of Data", "t": "Presentation of Data", "k": [["📘 Key Ideas", "Data can be presented in tables, diagrams and graphs. Table parts: title, stub, caption, body, footnote, source. Diagrams: bar, multiple bar, pie. Graphs: histogram, frequency polygon, frequency curve, ogive, time-series graph."], ["🧮 Formulas &amp; Methods", "Pie angle = (Value/Total) × 360°<br>Histogram – continuous; bar diagram – discrete<br>Polygon: join mid-points of histogram tops<br>Ogive intersection → median"], ["⚠️ Exam Trap", "Histograms have no gaps; bars have gaps. Intersection of less-than and more-than ogives gives the median. Non-uniform class width needs adjusted frequency."]], "q": [["Pie angle for 25% share?", "25% × 360° = 90°."], ["Histogram vs bar diagram?", "Histogram: continuous, no gaps; bar: discrete, with gaps."]]}, {"s": "Central Tendency", "t": "Measures of Central Tendency", "k": [["📘 Key Ideas", "A single value representing the data. <b>Mean</b> uses all values, <b>median</b> divides the data into two halves, <b>mode</b> is the most frequent value. Mean is affected by extreme values; median and mode are not."], ["🧮 Formulas &amp; Methods", "Mean = ΣX/N; ΣfX/Σf; Assumed mean: A + Σfd/Σf (×c)<br>Median (individual) = size of (N+1)/2th item<br>Median (continuous) = l + [(N/2 − cf)/f] × h<br>Mode = l + [(f₁−f₀)/(2f₁−f₀−f₂)] × h; Mode ≈ 3Median − 2Mean"], ["⚠️ Exam Trap", "Median of an even number of items is the average of two middle items after sorting. Mean is distorted by outliers, median is robust. Distribution can be bimodal."]], "q": [["Mean of 2, 4, 6, 8, 10?", "30/5 = 6."], ["Which average is affected by extreme values?", "Arithmetic mean."]]}, {"s": "Correlation", "t": "Correlation", "k": [["📘 Key Ideas", "Correlation measures the degree of linear relationship between two variables. Tools: scatter diagram, Karl Pearson's coefficient and Spearman's rank correlation. r ranges from −1 to +1."], ["🧮 Formulas &amp; Methods", "r = Σdxdy / √(Σdx² × Σdy²)<br>Spearman r<sub>s</sub> = 1 − 6Σd²/[n(n²−1)]<br>r = +1 perfect positive; −1 perfect negative; 0 no linear relation"], ["⚠️ Exam Trap", "Correlation does <i>not</i> imply causation. r is unaffected by change of origin and scale. r = 0 means no <i>linear</i> relation, not no relation. Tied ranks need correction."]], "q": [["Range of r?", "−1 ≤ r ≤ +1."], ["Does high correlation prove causation?", "No – it shows association only."]]}, {"s": "Index Numbers", "t": "Index Numbers", "k": [["📘 Key Ideas", "Index numbers measure relative change in a variable over time. Types: price index, quantity index, value index. Methods: simple aggregative, weighted aggregative (Laspeyres, Paasche, Fisher). Important indices: CPI, WPI, IIP, Sensex. Base year = 100."], ["🧮 Formulas &amp; Methods", "Index = (P₁/P₀) × 100<br>Laspeyres = Σp₁q₀/Σp₀q₀ × 100<br>Paasche = Σp₁q₁/Σp₀q₁ × 100; Fisher = √(L×P)<br>Inflation = (CPI<sub>t</sub> − CPI<sub>t−1</sub>)/CPI<sub>t−1</sub> × 100; Real wage = (Money wage/CPI) × 100"], ["⚠️ Exam Trap", "Laspeyres uses base-year quantities and tends to overstate; Paasche uses current quantities and tends to understate. WPI excludes services. Base year index is always 100."]], "q": [["Laspeyres vs Paasche weights?", "Laspeyres uses base-year quantities; Paasche uses current-year quantities."], ["Define the Wholesale Price Index.", "WPI measures changes in wholesale prices of goods, excluding services."]]}, {"s": "Statistical Tools Project", "t": "Use of Statistical Tools", "k": [["📘 Key Ideas", "A project applies statistical tools to a real issue. Steps: choose topic, set objectives, collect data (primary/secondary), organise, present using tables and diagrams, analyse with mean, median, correlation or index numbers, interpret and conclude. Computers and spreadsheets help."], ["🧮 Formulas &amp; Methods", "<b>Project outline:</b> title → objectives → methodology → data presentation → analysis → conclusion<br><b>Tools:</b> central tendency, dispersion, correlation, index numbers<br><b>Sources:</b> Census, NSSO, Economic Survey, RBI"], ["⚠️ Exam Trap", "State clear objectives and source of data. Interpret results rather than only calculate. Respect honesty and avoid plagiarism."]], "q": [["Steps of a statistical project?", "Topic → objectives → data collection → organisation → presentation → analysis → conclusion."], ["Why use computers?", "For fast, accurate calculation and graphs."]]}, {"s": "Micro Introduction", "t": "Microeconomics – Introduction", "k": [["📘 Key Ideas", "Economics studies how society uses scarce resources with alternative uses. Central problems: what, how and for whom to produce. <b>PPC</b> shows maximum combinations of two goods with given resources and technology. Systems: capitalist, socialist, mixed. Positive vs normative economics."], ["🧮 Formulas &amp; Methods", "<b>PPC:</b> downward sloping, concave to the origin (increasing MRT)<br>MRT = ΔY/ΔX<br>Opportunity cost = next best alternative forgone<br>Shifts: right with more resources/technology"], ["⚠️ Exam Trap", "Points inside PPC indicate unemployment; outside are unattainable. PPC is concave because MRT rises. Positive economics 'what is'; normative 'what ought to be'."]], "q": [["Why is PPC concave to the origin?", "Because MRT (opportunity cost) increases as more of one good is produced."], ["Meaning of opportunity cost?", "The value of the next best alternative given up."]]}, {"s": "Consumer's Equilibrium & Demand", "t": "Consumer's Equilibrium and Demand", "k": [["📘 Key Ideas", "<b>Cardinal approach:</b> equilibrium when MUₓ/Pₓ = MU<sub>y</sub>/P<sub>y</sub> = MU<sub>money</sub>. <b>Ordinal approach:</b> IC tangent to budget line (MRS = Pₓ/P<sub>y</sub>). Law of demand: price ↑ → quantity demanded ↓. Movement along the curve vs shift. Elasticity of demand measures responsiveness."], ["🧮 Formulas &amp; Methods", "MU = ΔTU/ΔQ; TU = ΣMU; MU falls (DMU)<br>Budget: PₓX + P<sub>y</sub>Y = M<br>Ed = (−)(ΔQ/ΔP) × (P/Q); percentage, expenditure, geometric methods<br>Ed &gt; 1 elastic; = 1 unitary; &lt; 1 inelastic"], ["⚠️ Exam Trap", "Change in price → <i>movement along</i> the curve; change in income, tastes, related prices → <i>shift</i>. IC curves are convex and never intersect. Giffen goods violate the law."]], "q": [["Consumer's equilibrium (cardinal)?", "MUₓ/Pₓ = MU<sub>y</sub>/P<sub>y</sub> = MU of money, with MU falling."], ["Ed if expenditure falls when price falls?", "Elastic goes up; here Ed &lt; 1 (inelastic)."]]}, {"s": "Producer Behaviour & Supply", "t": "Producer Behaviour and Supply", "k": [["📘 Key Ideas", "Production function links inputs to output. <b>Law of variable proportions</b> (short run): increasing, diminishing and negative returns. Returns to scale (long run). Producer's equilibrium: MR = MC with MC rising. Supply: law of supply, determinants, elasticity."], ["🧮 Formulas &amp; Methods", "TC = TFC + TVC; AC = TC/Q; MC = ΔTC/ΔQ<br>MP = ΔTP/ΔL; AP = TP/L; MP = AP at max AP<br>TR = P×Q; AR = P; MR = ΔTR/ΔQ<br>Profit = TR − TC; Es = %ΔQs/%ΔP"], ["⚠️ Exam Trap", "MC cuts AVC and ATC at their minimum points. Equilibrium needs MC to cut MR from below. Shutdown if P &lt; minimum AVC. Supply curve slopes upward."]], "q": [["Producer's equilibrium conditions?", "MR = MC and MC cuts MR from below."], ["MC cuts AC where?", "At the minimum point of AC."]]}, {"s": "Market Forms & Price", "t": "Forms of Market and Price Determination", "k": [["📘 Key Ideas", "Market forms: perfect competition, monopoly, monopolistic competition, oligopoly. Perfect competition: many buyers/sellers, homogeneous product, free entry/exit, perfect knowledge. Equilibrium price is where D = S. Price ceiling and floor create shortages and surpluses."], ["🧮 Formulas &amp; Methods", "Equilibrium: Qd = Qs<br>P &gt; P* → excess supply (price falls); P &lt; P* → excess demand (price rises)<br>↑D → P↑ Q↑; ↑S → P↓ Q↑<br>Perfect comp.: AR = MR = P; Monopoly: MR &lt; AR"], ["⚠️ Exam Trap", "Firm is a price taker in perfect competition (horizontal demand curve). Both curves shifting needs analysis of magnitude. Ceiling below equilibrium → shortage."]], "q": [["Features of perfect competition?", "Many buyers/sellers, identical product, free entry/exit, perfect knowledge, price taker."], ["Effect of ↑ demand?", "Equilibrium price and quantity both rise."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
