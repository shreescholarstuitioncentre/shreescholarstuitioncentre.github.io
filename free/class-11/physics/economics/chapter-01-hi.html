<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg text{fill:var(--mut);font-size:11px}svg circle.pt{transition:fill .3s}
</style></head><body>

var D={"ui": {"prog": "दोहराए गए: {n}/12 अध्याय", "win": "🎉 शानदार! सभी 12 अध्याय पूरे!", "quiz": "🧠 त्वरित जाँच (उत्तर के लिए टैप करें)", "mk": "☐ अध्याय दोहराया हुआ चिह्नित करें", "dn": "✅ दोहरा लिया! (हटाने हेतु टैप करें)", "w4": "📏 माध्य बनाम माध्यिका – एक चरम मान जोड़ें", "ov": "8वाँ मान", "mean": "माध्य", "med": "माध्यिका", "mode": "बहुलक", "rg": "विस्तार", "w5": "📈 सहसंबंध खेल-मैदान", "pe": "पूर्ण", "hi": "उच्च", "mo": "मध्यम", "lo": "निम्न", "no": "सहसंबंध नहीं", "ps": "धनात्मक", "ng": "ऋणात्मक", "w6": "🧮 सूचकांक प्रयोगशाला", "nt6": "आधार कीमतें ₹20, ₹30, ₹40; आधार मात्रा 10, 5, 8; चालू मात्रा 12, 4, 9", "it": ["गेहूँ की वर्तमान कीमत", "चावल की वर्तमान कीमत", "दूध की वर्तमान कीमत"], "inf": "मुद्रास्फीति", "w9": "📉 माँग व लोच", "pr": "कीमत", "inc": "माँग खिसकाव (आय)", "el": "लोचदार", "ie": "बेलोचदार", "un": "इकाई", "rt": "→ दाएँ खिसकाव", "lf": "← बाएँ खिसकाव", "w10": "🏭 उत्पादक संतुलन (P = MC)", "fc": "स्थिर लागत", "pf": "लाभ", "op": "उत्पादन करें", "ls": "उत्पादन – हानि न्यूनतम", "sh": "उत्पादन बंद (P &lt; AVC)", "w11": "⚖️ बाज़ार साम्य", "sd": "माँग खिसकाव", "ss": "पूर्ति खिसकाव", "eq": "बाज़ार साफ़", "es": "अधिपूर्ति", "ed": "अधिमाँग"}, "ch": [{"s": "परिचय", "t": "सांख्यिकी – परिचय", "k": [["📘 मुख्य बिंदु", "सांख्यिकी आँकड़ों के संग्रह, संगठन, प्रस्तुतीकरण, विश्लेषण व निर्वचन का अध्ययन है। बहुवचन में यह संख्यात्मक तथ्य है, एकवचन में विधियाँ। कार्य: सरलीकरण, तुलना, पूर्वानुमान, नीति-निर्माण। अर्थशास्त्र में क्षेत्र: उपभोग, उत्पादन, वितरण, लोक वित्त।"], ["🧮 सूत्र व विधियाँ", "<b>सांख्यिकीय आँकड़ों की विशेषताएँ:</b> समूह, अनेक कारणों से प्रभावित, संख्यात्मक, यथोचित शुद्ध, व्यवस्थित संग्रह<br><b>सीमाएँ:</b> व्यक्तिगत इकाई, गुणात्मक पक्ष या पृथक तथ्य का अध्ययन नहीं; दुरुपयोग संभव<br><b>वर्णनात्मक</b> (सारांश) बनाम <b>अनुमानात्मक</b> (प्रतिदर्श से निष्कर्ष)"], ["⚠️ परीक्षा का जाल", "सांख्यिकी <i>समूहों</i> से संबंधित है, एकल तथ्य से नहीं। सांख्यिकीय नियम औसत रूप में सत्य होते हैं, प्रत्येक पर नहीं। आँकड़े तुलनीय व समरूप हों।"]], "q": [["एक अकेला आँकड़ा 'सांख्यिकी' क्यों नहीं?", "सांख्यिकी तुलनीय तथ्यों के समूह को कहते हैं, पृथक आँकड़े को नहीं।"], ["सांख्यिकी की दो सीमाएँ?", "यह व्यक्तिगत इकाई व गुणात्मक पक्ष की उपेक्षा करती है तथा इसका दुरुपयोग हो सकता है।"]]}, {"s": "आँकड़ों का संग्रह", "t": "आँकड़ों का संग्रह", "k": [["📘 मुख्य बिंदु", "<b>प्राथमिक आँकड़े</b> प्रथम बार स्वयं एकत्र होते हैं; <b>द्वितीयक आँकड़े</b> पहले से उपलब्ध होते हैं। विधियाँ: प्रत्यक्ष व्यक्तिगत अन्वेषण, अप्रत्यक्ष मौखिक, स्थानीय स्रोत, अनुसूची (प्रगणकों द्वारा) व प्रश्नावली (डाक से)। जनगणना पूरी समष्टि का, प्रतिदर्श एक भाग का अध्ययन करता है। प्रतिचयन: यादृच्छिक (लॉटरी, यादृच्छिक संख्या सारणी) व अयादृच्छिक (सविचार, सुविधानुसार)।"], ["🧮 सूत्र व विधियाँ", "<b>द्वितीयक स्रोत:</b> जनगणना, NSSO, RBI, आर्थिक सर्वेक्षण<br><b>त्रुटियाँ:</b> प्रतिचयन त्रुटि (प्रतिदर्श व समष्टि का अंतर); अप्रतिचयन त्रुटि (मापन, अनुत्तर, पक्षपात)<br>जनगणना: शुद्ध पर महँगी व धीमी; प्रतिदर्श: सस्ता, तेज़"], ["⚠️ परीक्षा का जाल", "यादृच्छिक प्रतिचयन में प्रत्येक इकाई को चुने जाने का समान अवसर। बड़ा प्रतिदर्श प्रतिचयन त्रुटि घटाता है, अप्रतिचयन त्रुटि नहीं। प्रश्नावली उत्तरदाता भरता है; अनुसूची प्रगणक।"]], "q": [["जनगणना व प्रतिदर्श सर्वेक्षण में अंतर?", "जनगणना हर इकाई का अध्ययन करती है; प्रतिदर्श चयनित भाग का, सस्ता व तेज़।"], ["प्रश्नावली क्या है?", "उत्तरदाताओं को डाक से भेजे गए प्रश्नों का समूह जिसे वे स्वयं भरते हैं।"]]}, {"s": "आँकड़ों का संगठन", "t": "आँकड़ों का संगठन", "k": [["📘 मुख्य बिंदु", "कच्चे आँकड़ों को वर्गीकरण द्वारा बारंबारता बंटन में सजाया जाता है। चर असतत या सतत होते हैं। अपवर्जी विधि में ऊपरी सीमा छूटती है; समावेशी विधि में दोनों सीमाएँ शामिल (0.5 के समायोजन से परिवर्तन)। संचयी बारंबारता से 'से कम' व 'से अधिक' कुल मिलते हैं।"], ["🧮 सूत्र व विधियाँ", "वर्ग-अंतराल = ऊपरी सीमा − निचली सीमा<br>मध्य-मान = (निचली + ऊपरी)/2<br>विस्तार = अधिकतम − न्यूनतम<br>आदर्श वर्ग संख्या: 5–15"], ["⚠️ परीक्षा का जाल", "अपवर्जी विधि में ऊपरी सीमा <i>अगले</i> वर्ग में जाती है। समावेशी से अपवर्जी बनाने हेतु निचली सीमा में 0.5 घटाएँ व ऊपरी में 0.5 जोड़ें। गणना हेतु मिलान-चिह्न (tally) प्रयुक्त।"]], "q": [["10–19, 20–29 को अपवर्जी बनाएँ।", "9.5–19.5, 19.5–29.5।"], ["वर्ग का मध्य-मान क्या है?", "वर्ग की निचली व ऊपरी सीमा का औसत।"]]}, {"s": "आँकड़ों का प्रस्तुतीकरण", "t": "आँकड़ों का प्रस्तुतीकरण", "k": [["📘 मुख्य बिंदु", "आँकड़े सारणी, आरेख व रेखाचित्रों से प्रस्तुत होते हैं। सारणी के भाग: शीर्षक, पार्श्व शीर्ष, स्तंभ शीर्ष, मुख्य भाग, पाद टिप्पणी, स्रोत। आरेख: दंड, बहु-दंड, वृत्त। ग्राफ़: आयतचित्र, बारंबारता बहुभुज, बारंबारता वक्र, तोरण (ogive), समय श्रेणी ग्राफ़।"], ["🧮 सूत्र व विधियाँ", "वृत्त कोण = (मान/कुल) × 360°<br>आयतचित्र – सतत; दंड आरेख – असतत<br>बहुभुज: आयतचित्र के शीर्षों के मध्य-बिंदु जोड़ें<br>तोरणों का कटान → माध्यिका"], ["⚠️ परीक्षा का जाल", "आयतचित्र में अंतराल नहीं; दंडों में अंतराल। 'से कम' व 'से अधिक' तोरणों का कटान माध्यिका देता है। असमान वर्ग-विस्तार में समायोजित बारंबारता चाहिए।"]], "q": [["25% हिस्से का वृत्त कोण?", "25% × 360° = 90°।"], ["आयतचित्र व दंड आरेख में अंतर?", "आयतचित्र: सतत, अंतराल रहित; दंड: असतत, अंतराल सहित।"]]}, {"s": "केंद्रीय प्रवृत्ति", "t": "केंद्रीय प्रवृत्ति की माप", "k": [["📘 मुख्य बिंदु", "आँकड़ों का प्रतिनिधि एक मान। <b>माध्य</b> सभी मान उपयोग करता है, <b>माध्यिका</b> आँकड़ों को दो बराबर भागों में बाँटती है, <b>बहुलक</b> सर्वाधिक बारंबार मान है। माध्य चरम मानों से प्रभावित होता है; माध्यिका व बहुलक नहीं।"], ["🧮 सूत्र व विधियाँ", "माध्य = ΣX/N; ΣfX/Σf; कल्पित माध्य: A + Σfd/Σf (×c)<br>माध्यिका (व्यक्तिगत) = (N+1)/2 वें पद का मान<br>माध्यिका (सतत) = l + [(N/2 − cf)/f] × h<br>बहुलक = l + [(f₁−f₀)/(2f₁−f₀−f₂)] × h; बहुलक ≈ 3 माध्यिका − 2 माध्य"], ["⚠️ परीक्षा का जाल", "सम संख्या के पदों में माध्यिका क्रमबद्ध करके दो मध्य पदों का औसत है। माध्य चरम मानों से विकृत होता है, माध्यिका दृढ़। बंटन द्विबहुलक हो सकता है।"]], "q": [["2, 4, 6, 8, 10 का माध्य?", "30/5 = 6।"], ["कौन-सा माध्य चरम मानों से प्रभावित होता है?", "समांतर माध्य।"]]}, {"s": "सहसंबंध", "t": "सहसंबंध", "k": [["📘 मुख्य बिंदु", "सहसंबंध दो चरों के बीच रैखिक संबंध की मात्रा मापता है। साधन: प्रकीर्ण आरेख, कार्ल पियर्सन गुणांक व स्पीयरमैन कोटि सहसंब
