<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

var D={"ui": {"prog": "Revised: {n}/20 chapters", "win": "🎉 Superb! All 20 chapters revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w2": "🔵 Unit Circle & Sine Wave", "an": "Angle θ", "pl": "▶ Play", "ps": "⏸ Pause", "und": "undefined", "qd": ["Quadrant I (all +)", "Quadrant II (sin +)", "Quadrant III (tan +)", "Quadrant IV (cos +)"], "w3": "📈 Quadratic Explorer: y = ax² + bx + c", "n2": "Two distinct real roots", "n1": "Equal real roots", "n0": "Complex roots", "vx": "Vertex", "w12": "🥚 Ellipse & Constant Focal Sum", "lr": "LR", "ar": "Area", "w18": "🎲 Two-Dice Probability Lab", "r1": "Roll 1", "tot": "Rolls", "ls": "Last", "em": "observed", "th": "theory"}, "ch": [{"s": "Sets", "t": "Sets", "k": [["📘 Key Ideas", "Set types, subsets, <b>power set</b>, Venn diagrams, union/intersection/complement, De Morgan's laws, intervals as subsets of ℝ."], ["🧮 Formulas", "n(A∪B) = n(A) + n(B) − n(A∩B)<br>n(A∪B∪C) = Σn(A) − Σn(A∩B) + n(A∩B∩C)<br>n(P(A)) = 2ⁿ; (A∪B)′ = A′∩B′; (A∩B)′ = A′∪B′"], ["⚠️ Exam Trap", "∅ is a subset of every set, but {∅} ≠ ∅ (it has one element). A − B ≠ B − A. Proper subsets = 2ⁿ − 1."]], "q": [["Subsets of a 4-element set?", "2⁴ = 16 (15 proper)."], ["If n(A)=20, n(B)=15, n(A∩B)=5, find n(A∪B).", "30."]]}, {"s": "Relations & Functions", "t": "Relations and Functions", "k": [["📘 Key Ideas", "Cartesian product, relations, domain/codomain/range, function types: one-one, onto, many-one; real functions and their graphs."], ["🧮 Formulas", "n(A×B) = mn; relations A→B = 2^(mn)<br>Functions A→B = nᵐ; one-one = ⁿPₘ (n ≥ m)<br>Equivalence = reflexive + symmetric + transitive"], ["⚠️ Exam Trap", "Every domain element must have exactly one image. Domain of √(f) needs f ≥ 0; of log f needs f &gt; 0; of 1/f needs f ≠ 0."]], "q": [["Relations from a 2-element to a 3-element set?", "2⁶ = 64."], ["Domain of √(x − 2)?", "[2, ∞)."]]}, {"s": "Trigonometric Functions", "t": "Trigonometric Functions", "k": [["📘 Key Ideas", "Radian measure, trig ratios of any angle, sum/difference/multiple-angle formulas, <b>general solutions</b> of trig equations."], ["🧮 Formulas", "s = rθ; π rad = 180°; sin²θ + cos²θ = 1<br>sin(A±B) = sinA cosB ± cosA sinB; cos2A = 2cos²A − 1 = 1 − 2sin²A<br>sinθ = sinα ⇒ θ = nπ + (−1)ⁿα; cosθ = cosα ⇒ θ = 2nπ ± α; tanθ = tanα ⇒ θ = nπ + α"], ["⚠️ Exam Trap", "tan is undefined at odd multiples of π/2. Always check |sin|, |cos| ≤ 1 before solving. ASTC rule decides signs by quadrant."]], "q": [["Value of sin 15°?", "(√6 − √2)/4."], ["Period of tan x?", "π."]]}, {"s": "Complex & Quadratic", "t": "Complex Numbers and Quadratic Equations", "k": [["📘 Key Ideas", "i² = −1, algebra of complex numbers, modulus, conjugate, Argand plane, polar form, cube roots of unity; quadratic roots and nature."], ["🧮 Formulas", "|z| = √(a² + b²); z·z̄ = |z|²; z = r(cosθ + i sinθ)<br>x = (−b ± √D)/2a; D = b² − 4ac<br>α + β = −b/a; αβ = c/a; 1 + ω + ω² = 0"], ["⚠️ Exam Trap", "Principal argument lies in (−π, π]. Complex roots come in conjugate pairs only when coefficients are real. i⁴ᵏ = 1."]], "q": [["Value of i²⁵?", "i (25 = 4×6 + 1)."], ["Nature of roots when D &lt; 0?", "Complex conjugate pair."]]}, {"s": "Linear Inequalities", "t": "Linear Inequalities", "k": [["📘 Key Ideas", "Solving in one variable, number-line solution sets, absolute-value inequalities, graphing in two variables, systems of inequalities."], ["🧮 Formulas", "|x| &lt; a ⇔ −a &lt; x &lt; a<br>|x| &gt; a ⇔ x &lt; −a or x &gt; a<br>ax + by ≤ c: shade half-plane; test (0,0)"], ["⚠️ Exam Trap", "Multiplying or dividing by a negative number <b>reverses</b> the sign. Never multiply by an expression whose sign is unknown."]], "q": [["Solve |x − 1| &lt; 3.", "−2 &lt; x &lt; 4."], ["When does the inequality sign reverse?", "On multiplying or dividing by a negative number."]]}, {"s": "Permutations & Combinations", "t": "Permutations and Combinations", "k": [["📘 Key Ideas", "Fundamental principle of counting, factorials, arrangements, selections, circular arrangements, arrangements with repetition."], ["🧮 Formulas", "ⁿPᵣ = n!/(n−r)!; ⁿCᵣ = n!/(r!(n−r)!)<br>ⁿCᵣ = ⁿC₍ₙ₋ᵣ₎; ⁿCᵣ + ⁿC₍ᵣ₋₁₎ = ⁿ⁺¹Cᵣ<br>Circular = (n−1)!; with repeats = n!/(p!q!r!)"], ["⚠️ Exam Trap", "Permutation = order matters; combination = order doesn't. For 'at least one' use total − none."]], "q": [["Arrangements of MISSISSIPPI?", "11!/(4!·4!·2!) = 34650."], ["Ways to seat 6 people round a table?", "5! = 120."]]}, {"s": "Binomial Theorem", "t": "Binomial Theorem", "k": [["📘 Key Ideas", "Expansion of (a + b)ⁿ for positive integer n, general term, middle term(s), Pascal's triangle, coefficient properties."], ["🧮 Formulas", "T<sub>r+1</sub> = ⁿCᵣ aⁿ⁻ʳ bʳ<br>ΣⁿCᵣ = 2ⁿ; ΣⁿCᵣ(−1)ʳ = 0<br>Middle: n even → (n/2 + 1)th; n odd → (n+1)/2 and (n+3)/2 terms"], ["⚠️ Exam Trap", "The general term is T<sub>r+1</sub>, not T<sub>r</sub>. Carry negative signs inside b. Number of terms = n + 1."]], "q": [["Number of terms in (x + y)¹⁰?", "11."], ["Sum of coefficients of (1 + x)ⁿ?", "2ⁿ (put x = 1)."]]}, {"s": "Sequences & Series", "t": "Sequences and Series", "k": [["📘 Key Ideas", "AP, GP, means (AM, GM, HM), special series Σn, Σn², Σn³, relation AM ≥ GM ≥ HM."], ["🧮 Formulas", "AP: aₙ = a + (n−1)d; Sₙ = (n/2)[2a + (n−1)d]<br>GP: aₙ = arⁿ⁻¹; Sₙ = a(rⁿ−1)/(r−1); S∞ = a/(1−r), |r| &lt; 1<br>Σn = n(n+1)/2; Σn² = n(n+1)(2n+1)/6; Σn³ = [n(n+1)/2]²<br>GM² = AM × HM"], ["⚠️ Exam Trap", "S∞ exists only if |r| &lt; 1. Distinguish nth term from sum of n terms."]], "q": [["Sum 1 + 2 + … + 100?", "5050."], ["S∞ of 1 + ½ + ¼ + …?", "1/(1 − ½) = 2."]]}, {"s": "Straight Lines", "t": "Straight Lines", "k": [["📘 Key Ideas", "Slope, forms of a line, angle between lines, distance of a point from a line, distance between parallel lines, family of lines."], ["🧮 Formulas", "m = tanθ = (y₂−y₁)/(x₂−x₁); y − y₁ = m(x − x₁); x/a + y/b = 1<br>d = |Ax₁ + By₁ + C|/√(A² + B²)<br>tanθ = |(m₁−m₂)/(1 + m₁m₂)|; ∥: m₁ = m₂; ⊥: m₁m₂ = −1"], ["⚠️ Exam Trap", "A h)."]], "q": [["Focus of y² = 8x?", "(2, 0)."], ["Latus rectum of y² = 12x?", "12."]]}, {"s": "Ellipse", "t": "Ellipse", "k": [["📘 Key Ideas", "Sum of focal distances is constant (= 2a). Standard form, eccentricity 0 &lt; e &lt; 1, foci, directrices, latus rectum."], ["🧮 Formulas", "x²/a² + y²/b² = 1 (a &gt; b); b² = a²(1 − e²)<br>Foci (±ae, 0); directrices x = ±a/e; LR = 2b²/a<br>Parametric (a cosθ, b sinθ); area = πab"], ["⚠️ Exam Trap", "If b &gt; a the major axis is vertical – swap roles. Check which denominator is larger first."]], "q": [["Eccentricity of x²/25 + y²/16 = 1?", "e = 3/5."], ["Latus rectum of the same ellipse?", "2·16/5 = 32/5."]]}, {"s": "Hyperbola", "t": "Hyperbola", "k": [["📘 Key Ideas", "Difference of focal distances is constant (= 2a). Eccentricity e &gt; 1, asymptotes, conjugate and rectangular hyperbola."], ["🧮 Formulas", "x²/a² − y²/b² = 1; b² = a²(e² − 1); foci (±ae, 0)<br>Asymptotes y = ±(b/a)x; LR = 2b²/a<br>Parametric (a secθ, b tanθ); rectangular: e = √2"], ["⚠️ Exam Trap", "c² = a² + b² for hyperbola (minus sign for ellipse). The positive term decides the transverse axis."]], "q": [["Eccentricity of x²/9 − y²/16 = 1?", "e = 5/3."], ["Asymptotes of the same hyperbola?", "y = ±(4/3)x."]]}, {"s": "3D Geometry", "t": "Introduction to Three-Dimensional Geometry", "k": [["📘 Key Ideas", "Coordinate axes and planes, eight octants, distance formula, section formula, centroid in space."], ["🧮 Formulas", "d = √(Δx² + Δy² + Δz²)<br>Section: ((mx₂ + nx₁)/(m+n), (my₂ + ny₁)/(m+n), (mz₂ + nz₁)/(m+n))<br>Distance of (x,y,z) from x-axis = √(y² + z²)"], ["⚠️ Exam Trap", "Sign pattern (±,±,±) fixes the octant. Distance from a coordinate <i>plane</i> is the absolute value of the third coordinate."]], "q": [["Distance between (1,2,3) and (4,6,15)?", "√(9 + 16 + 144) = 13."], ["Number of octants?", "8."]]}, {"s": "Limits", "t": "Limits", "k": [["📘 Key Ideas", "Left- and right-hand limits, algebra of limits, standard limits, factorisation and rationalisation methods."], ["🧮 Formulas", "lim sinx/x = 1; lim (1−cosx)/x² = ½; lim tanx/x = 1<br>lim (eˣ−1)/x = 1; lim ln(1+x)/x = 1; lim (1+1/x)ˣ = e<br>lim (xⁿ − aⁿ)/(x − a) = n aⁿ⁻¹"], ["⚠️ Exam Trap", "A limit exists only if LHL = RHL. For 0/0 factorise or rationalise first. Standard limits need x in radians."]], "q": [["lim x→0 sin3x/x?", "3."], ["lim x→2 (x² − 4)/(x − 2)?", "4."]]}, {"s": "Derivatives", "t": "Derivatives", "k": [["📘 Key Ideas", "Derivative from first principle, rules (sum, product, quotient, chain), derivatives of standard functions."], ["🧮 Formulas", "f′(x) = lim [f(x+h) − f(x)]/h<br>(uv)′ = u′v + uv′; (u/v)′ = (u′v − uv′)/v²<br>(xⁿ)′ = nxⁿ⁻¹; (sinx)′ = cosx; (cosx)′ = −sinx; (tanx)′ = sec²x; (eˣ)′ = eˣ; (lnx)′ = 1/x; (aˣ)′ = aˣ ln a"], ["⚠️ Exam Trap", "Differentiable ⇒ continuous, but not conversely (|x| at 0). Derivative of a constant is 0, not 1."]], "q": [["d/dx (x³ sin x)?", "3x² sin x + x³ cos x."], ["Derivative of ln x?", "1/x."]]}, {"s": "Statistics", "t": "Statistics", "k": [["📘 Key Ideas", "Measures of dispersion: range, mean deviation, variance, standard deviation, coefficient of variation."], ["🧮 Formulas", "σ² = Σ(x − x̄)²/n = Σx²/n − x̄²<br>CV = (σ/x̄) × 100<br>Mode = 3 Median − 2 Mean (empirical)"], ["⚠️ Exam Trap", "Adding a constant leaves σ unchanged; multiplying by k multiplies σ by |k|. Lower CV means more consistent data."]], "q": [["SD of 2, 4, 6?", "√(8/3)."], ["SD after adding 5 to each value?", "Unchanged."]]}, {"s": "Probability", "t": "Probability", "k": [["📘 Key Ideas", "Sample space, events, axiomatic probability, addition theorem, mutually exclusive and exhaustive events."], ["🧮 Formulas", "P(E) = favourable/total; P(E′) = 1 − P(E)<br>P(A∪B) = P(A) + P(B) − P(A∩B)<br>Mutually exclusive: P(A∩B) = 0; independent: P(A∩B) = P(A)P(B)"], ["⚠️ Exam Trap", "Mutually exclusive ≠ independent. 'At least one' ⇒ 1 − P(none). 0 ≤ P ≤ 1 always."]], "q": [["P(sum 7) with two dice?", "6/36 = 1/6."], ["P(at least one head in 3 tosses)?", "1 − 1/8 = 7/8."]]}, {"s": "Sine & Cosine Formulae", "t": "Sine and Cosine Formulae", "k": [["📘 Key Ideas", "Sine rule, cosine rule, area of triangle, projection formulae, circumradius and inradius."], ["🧮 Formulas", "a/sinA = b/sinB = c/sinC = 2R<br>a² = b² + c² − 2bc cosA; cosA = (b² + c² − a²)/2bc<br>Δ = ½ab sinC = √(s(s−a)(s−b)(s−c)); r = Δ/s; R = abc/4Δ"], ["⚠️ Exam Trap", "SSA can give 0, 1 or 2 triangles (ambiguous case). Use cosine rule when two sides and the included angle are known."]], "q": [["Area of a 3-4-5 triangle?", "6."], ["Circumradius of a 3-4-5 triangle?", "5/2 (hypotenuse/2)."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};

function wire(i){var u=D.ui;cancelAnimationFrame(window.raf);
 if(i==2){var th=45,pl=0,S=Math.sin,C=Math.cos,dr=function(){var r=th*Math.PI/180,c=C(r),s=S(r),X=120+85*c,Y=105-85*s,p="",xs=230+th*160/360;for(var k=0;k<=72;k++)p+=(k?"L":"M")+(230+k*160/72).toFixed(1)+" "+(105-85*S(k*5*Math.PI/180)).toFixed(1);
  $("#ttv").textContent=th+"° = "+r.toFixed(3)+" rad";

  $("#tst").innerHTML='<span>sin = '+s.toFixed(3)+'</span><span>cos = '+c.toFixed(3)+'</span><span>tan = '+(Math.abs(c)<1e-3?u.und:(s/c).toFixed(3))+'</span><span>'+u.qd[th==360?3:Math.floor((th%360)/90)]+'</span>'};
  $("#tt").oninput=function(){th=+this.value;dr()};$("#tp").onclick=function(){pl=!pl;this.textContent=pl?u.ps:u.pl};dr();

 if(i==3){var q=function(){var a=+$("#qa").value||.5,b=+$("#qb").value,c=+$("#qc").value,D=b*b-4*a*c,p="",vx=-b/(2*a),vy=c-b*b/(4*a),h="",r;for(var x=-10;x<=10.01;x+=.25){var y=a*x*x+b*x+c;p+=(x==-10?"M":"L")+(200+x*20).toFixed(1)+" "+Math.max(-40,Math.min(280,120-y*20)).toFixed(1)}

  h='<line x1="0" y1="120" x2="400" y2="120" stroke="var(--mut)"/><line x1="200" y1="0" x2="200" y2="240" stroke="var(--mut)"/><path d="'+p+'" fill="none" stroke="var(--c)" stroke-width="3"/><circle cx="'+(200+vx*20)+'" cy="'+(120-vy*20)+'" r="5" fill="#d9830b"/>';
  var rs;if(D>=0){var r1=(-b+Math.sqrt(D))/(2*a),r2=(-b-Math.sqrt(D))/(2*a);h+='<circle cx="'+(200+r1*20)+'" cy="120" r="6" fill="#2e9e5b"/><circle cx="'+(200+r2*20)+'" cy="120" r="6" fill="#2e9e5b"/>';rs='x = '+r1.toFixed(2)+', '+r2.toFixed(2)}else rs='x = '+(-b/(2*a)).toFixed(2)+' ± '+(Math.sqrt(-D)/(2*Math.abs(a))).toFixed(2)+'i';
  $("#qs").innerHTML=h;$("#qst").innerHTML='<span>D = '+D+'</span><span>'+(D>0?u.n2:D==0?u.n1:u.n0)+'</span><span>'+rs+'</span><span>'+u.vx+' ('+vx.toFixed(2)+', '+vy.toFixed(2)+')</span><span>Σ = '+(-b/a).toFixed(2)+', Π = '+(c/a).toFixed(2)+'</span>'};["qa","qb","qc"].forEach(function(x){$("#"+x).oninput=q});q()}
 if(i==12){var st=function(){var a=+$("#ea").value,b=+$("#eb").value,A=Math.max(a,b),B=Math.min(a,b),c=Math.sqrt(A*A-B*B);$("#eav").textContent=a;$("#ebv").textContent=b;$("#est").innerHTML='<span>e = '+(c/A).toFixed(3)+'</span><span>c = '+c.toFixed(2)+'</span><span>'+u.lr+' = '+(2*B*B/A).toFixed(2)+'</span><span>PF₁ + PF₂ = 2·'+A+' = '+2*A+'</span><span>'+u.ar+' = '+(Math.PI*a*b).toFixed(1)+'</span>'};["ea","eb"].forEach(function(x){$("#"+x).oninput=st});st();
  (function f(n){if(!$("#es"))return;var a=+$("#ea").value,b=+$("#eb").value,A=Math.max(a,b),B=Math.min(a,b),c=Math.sqrt(A*A-B*B),hz=a>=b,t=n/700,px=200+a*20*Math.cos(t),py=120-b*20*Math.sin(t),f1=hz?[200-c*20,120]:[200,120-c*20],f2=hz?[200+c*20,120]:[200,120+c*20];
   $("#es").innerHTML='<line x1="0" y1="120" x2="400" y2="120" stroke="var(--line)"/><line x1="200" y1="0" x2="200" y2="240" stroke="var(--line)"/><ellipse cx="200" cy="120" rx="'+a*20+'" ry="'+b*20+'" fill="none" stroke="var(--c)" stroke-width="3"/><line x1="'+f1[0]+'" y1="'+f1[1]+'" x2="'+px+'" y2="'+py+'" stroke="#2a6fdb" stroke-width="2"/><line x1="'+f2[0]+'" y1="'+f2[1]+'" x2="'+px+'" y2="'+py+'" stroke="#2e9e5b" stroke-width="2"/><circle cx="'+f1[0]+'" cy="'+f1[1]+'" r="5" fill="var(--ink)"/><circle cx="'+f2[0]+'" cy="'+f2[1]+'" r="5" fill="var(--ink)"/><circle cx="'+px+'" cy="'+py+'" r="7" fill="var(--c)"/>';window.raf=requestAnimationFrame(f)})(0)}
 if(i==18){var cn=[],tot=0,last="–";for(var z=0;z<13;z++)cn.push(0);
  var draw=function(){var m=Math.max.apply(null,cn.concat([1])),h="";for(var s=2;s<=12;s++){var t=(6-Math.abs(s-7))/36;h+='<div style="flex:1;text-align:center;font-size:.8rem"><div style="position:relative;height:110px;display:flex;align-items:flex-end"><div style="width:100%;height:'+cn[s]/m*100+'px;background:var(--c);border-radius:5px 5px 0 0;transition:height .3s"></div><i style="position:absolute;left:0;right:0;bottom:'+Math.min(110,t*tot/m*100)+'px;border-top:2px dashed var(--ink)"></i></div>'+s+'</div>'}
   $("#db").innerHTML=h;$("#dst").innerHTML='<span>'+u.tot+' = '+tot+'</span><span>'+u.ls+': '+last+'</span><span>P(7) '+u.em+' = '+(tot?(cn[7]/tot).toFixed(3):"–")+'</span><span>'+u.th+' = 1/6 = 0.167</span>'};
  var roll=function(n){for(var k=0;k<n;k++){var a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);cn[a+b]++;tot++;last=a+" + "+b+" = "+(a+b)}draw()};
  $("#r1").onclick=function(){roll(1)};$("#r100").onclick=function(){roll(100)};$("#rr").onclick=function(){cn=cn.map(function(){return 0});tot=0;last="–";draw()};draw()}}
function show(){var c=D.ch[cur],col=cols[cur%8];nav();
 $("#main").innerHTML='<section style="--c:'+col+'"><h2>'+(cur+1)+'. '+c.t+'</h2><div class="grid">'+c.k.map(function(p,j){return '<div class="card" style="animation-delay:'+j*.08+'s"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>'}).join("")+'</div>'+widget(cur)+'<h3 class="s">'+D.ui.quiz+'</h3>'+c.q.map(function(q){return '<button class="q"><b>❓ '+q[0]+'</b><div class="a">✅ '+q[1]+'</div></button>'}).join("")+'<button class="done '+(done[cur]?"y":"")+'">'+(done[cur]?D.ui.dn:D.ui.mk)+'</button></section>';
