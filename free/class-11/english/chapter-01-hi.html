<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sq{display:grid;gap:8px;margin:10px 0}.sq button{font:inherit;text-align:left;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.25s}.sq button:hover{border-color:var(--c);transform:translateX(4px)}.sq button.g{background:color-mix(in srgb,#2e9e5b 22%,var(--card));border-color:#2e9e5b;transform:none;cursor:default}.sq button.x{animation:sk .4s;border-color:#e0452f}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.sq b{display:inline-block;min-width:1.6em;color:var(--c)}

<script>
var D={"ui": {"prog": "दोहराए गए: {n}/21 पाठ", "win": "🎉 शानदार! सभी 21 पाठ पूरे!", "quiz": "🧠 त्वरित जाँच (उत्तर के लिए टैप करें)", "mk": "☐ पाठ दोहराया हुआ चिह्नित करें", "dn": "✅ दोहरा लिया! (हटाने हेतु टैप करें)", "wp": "🧩 घटना-क्रम पहेली", "wi": "कहानी / कविता की घटनाओं को सही क्रम में टैप करें।", "er": "गलतियाँ", "ok": "✅ पूरा – शून्य गलती के लिए फिर कोशिश करें!", "pf": "🏆 बेहतरीन!", "rs": "🔀 फिर से मिलाएँ"}, "ch": [{"s": "Portrait of a Lady", "t": "The Portrait of a Lady – खुशवंत सिंह", "k": [["📖 सारांश", "लेखक अपनी दादी को याद करते हैं – सफ़ेद वस्त्रों में एक बूढ़ी, कमज़ोर स्त्री जो दिन भर प्रार्थना और चरखा कातने में लगी रहती थीं। गाँव में वे उन्हें स्कूल ले जातीं और धर्मग्रंथ सिखातीं; शहर आने पर अंग्रेज़ी शिक्षा और अलग कमरे से दोनों के बीच दूरी बढ़ गई। विदेश से लौटने पर भी उन्होंने उतने ही स्नेह से स्वागत किया, और मृत्यु से एक दिन पहले गाँव की महिलाओं संग ढोलक पर गीत गाए व चिड़ियों को दाना डाला। उनकी शांत मृत्यु पर हज़ारों चिड़ियाँ चुपचाप उनके शरीर के पास बैठी रहीं।"], ["💡 विषय / संदेश", "वृद्धावस्था का सौंदर्य, निःस्वार्थ प्रेम और पीढ़ियों के बीच सेतु। सच्ची महानता सरल आस्था व स्नेह में है, बाहरी चमक में नहीं।"], ["👤 पात्र व शैली", "<b>कथावाचक:</b> खुशवंत सिंह (पोते के रूप में)। <b>दादी:</b> धार्मिक, स्नेही, अनुकूलनशील। <b>अलंकार:</b> उपमा (सफ़ेद बाल सर्दी के दृश्य जैसे), विरोधाभास (गाँव बनाम शहर), प्रतीक (चिड़ियाँ = उनका प्रेम व प्रकृति का मौन शोक)।"], ["⚠️ परीक्षा बिंदु", "पश्चिमी शिक्षा पर उन्होंने कभी नाराज़गी नहीं दिखाई; ढोलक पर उनका अंतिम गीत विदाई थी। चिड़ियों का दाना न चुगना प्राकृतिक शोक दर्शाता है।"]], "q": [["चिड़ियाँ चुपचाप क्यों बैठीं?", "वे दादी की मृत्यु पर शोकाकुल थीं जो उन्हें रोज़ दाना देती थीं; उनका मौन प्रेम व क्षति का प्रतीक है।"], ["शहर में दादी की भूमिका कैसे बदली?", "वे मौन साथी बन गईं – चरखा काततीं व चिड़ियों को दाना देतीं, जबकि लेखक पश्चिमी पढ़ाई में लग गया।"]], "ev": ["दादी गाँव में पढ़ाती हैं", "परिवार शहर जाता है; निकटता घटती है", "विदेश से लौटने पर वे स्वागत करती हैं", "उनकी मृत्यु पर चिड़ियाँ मौन शोक करती हैं"]}, {"s": "Not Afraid to Die", "t": "We're Not Afraid to Die… If We Can All Be Together", "k": [["📖 सारांश", "गॉर्डन कुक, पत्नी मैरी, दो छोटे बच्चे और दो नाविक नौका Wanderer III से विश्व-यात्रा पर निकले। दक्षिणी महासागर में विशाल लहर और तूफ़ानी हवाओं ने नौका को लगभग नष्ट कर दिया। थकान व भय से जूझते हुए परिवार ने रस्सियों से नौका की गति धीमी की, पानी उलीचा और एकजुट रहा। अंततः तूफ़ान थमा और इस संकट ने उन्हें और करीब ला दिया।"], ["💡 विषय / संदेश", "प्रकृति के प्रकोप में साहस, टीम-भावना व पारिवारिक एकता; मानव-हौसला मृत्यु-तुल्य संकट पर भी भारी पड़ता है।"], ["👤 पात्र व शैली", "<b>पात्र:</b> गॉर्डन कुक (शांत नेता), मैरी (साहसी माँ), जोनाथन व सुज़ैन (बच्चे), नाविक। <b>शैली:</b> प्रथम पुरुष कथन, रोमांच, लहरों का सजीव चित्रण।"], ["⚠️ परीक्षा बिंदु", "चरण याद रखें: तैयारी, शांत समुद्र, उठता तूफ़ान, क्षति, बचाव, राहत। शीर्षक दर्शाता है कि परिवार मृत्यु का सामना भी साथ मिलकर करने को तैयार था।"]], "q": [["शीर्षक का क्या महत्त्व है?", "यह परिवार की एकता दर्शाता है: साथ रहें तो हर खतरा स्वीकार।"], ["Wanderer III कैसे बची?", "रस्सियाँ पीछे डालकर गति धीमी की, पानी उलीचा, शांत रहे और सहयोग किया।"]], "ev": ["Wanderer III विश्व-यात्रा पर निकलती है", "दक्षिणी महासागर में भीषण तूफ़ान", "विशाल लहर से नौका संकट में", "तूफ़ान थमता है; परिवार सुरक्षित"]}, {"s": "Discovering Tut", "t": "Discovering Tut: the Saga Continues", "k": [["📖 सारांश", "निबंध फ़राओ तूतनखामेन की खोज व अध्ययन का वर्णन करता है, जिनकी लगभग 1323 ई.पू. कम उम्र में मृत्यु हुई। हावर्ड कार्टर को 1922 में घाटी-ए-राजा में उनकी कब्र मिली; ममी निकालते समय शुरुआती जाँचकर्ताओं ने उसे क्षति पहुँचाई। 1968 के एक्स-रे में खोपड़ी में हड्डी के टुकड़े मिले, जिससे हत्या की अटकलें लगीं। 2005 के CT स्कैन ने सिर पर घातक चोट का प्रमाण नहीं पाया और पैर की चोट व संक्रमण को संभावित कारण बताया।"], ["💡 विषय / संदेश", "विज्ञान इतिहास को निरंतर संशोधित करता है; तूत की मृत्यु का रहस्य दिखाता है कि तकनीक प्रश्न हल भी करती है, बढ़ाती भी है।"], ["👤 पात्र व शैली", "<b>प्रमुख व्यक्ति:</b> हावर्ड कार्टर, डॉ. आर. जी. हैरिसन, डॉ. ज़ाही हवास। <b>शैली:</b> तथ्यात्मक वर्णन, वैज्ञ र्ग की अमर भावना।"], ["👤 पात्र व शैली", "<b>पात्र:</b> मिडलटन, त्सेतन (गाइड), तिब्बती तीर्थयात्री। <b>शैली:</b> यात्रा-वृत्तांत, वर्णनात्मक चित्रण, हास्य, प्रथम पुरुष।"], ["⚠️ परीक्षा बिंदु", "याद रखें: कैलाश पर्वत (हिंदू व बौद्ध हेतु पवित्र), मानसरोवर, ऊँचाई की बीमारी, रेशम मार्ग का व्यापारिक इतिहास।"]], "q": [["मिडलटन को कठिनाइयाँ क्यों हुईं?", "अधिक ऊँचाई, अत्यधिक ठंड, ऊबड़-खाबड़ सड़कें व बीमारी।"], ["कैलाश क्या दर्शाता है?", "अपार आध्यात्मिक महत्त्व का पवित्र तीर्थ।"]], "ev": ["मिडलटन तिब्बत में यात्रा आरंभ करते हैं", "ऊँचाई व ठंड परीक्षा लेती हैं", "वे तीर्थयात्रियों व घुमंतुओं से मिलते हैं", "वे कैलाश क्षेत्र पहुँचते हैं"]}, {"s": "A Photograph", "t": "Poem 1: A Photograph – शर्ली टूलसन", "k": [["📖 सारांश", "कवयित्री अपनी माँ की एक फीकी तस्वीर देखती है जिसमें माँ बारह वर्ष की बच्ची के रूप में चचेरे भाई-बहनों के साथ समुद्र-तट पर पिकनिक में कैमरे की ओर मुस्कुरा रही है। वर्षों बाद वही भाई-बहन माँ की हँसी याद करते हैं। अब माँ नहीं रही और कवयित्री मौन चित्र को ताकती है – क्षति की स्थायिता से स्तब्ध और अपना शोक व्यक्त करने में असमर्थ।"], ["💡 केंद्रीय भाव", "समय निर्मम है; तस्वीरें आनंद सहेजती हैं पर अनुपस्थिति उजागर करती हैं। कविता प्रियजन की क्षति व स्मृति के धूमिल होने का शोक है।"], ["🎨 काव्य-अलंकार", "<b>अलंकार:</b> बिंब (समुद्र, पानी में खेलना), उपमा, मौन की पुनरावृत्ति, अतीत के सुख व वर्तमान के शोक का विरोधाभास, मुक्त छंद।"], ["⚠️ परीक्षा बिंदु", "तीन चरण: माँ बच्ची के रूप में, माँ बड़ी होकर, माँ अब नहीं। माँ की मृत्यु ने कवयित्री को शब्दों से परे मौन कर दिया।"]], "q": [["कविता का केंद्रीय भाव?", "स्मृति व क्षति; तस्वीर खुशी रोक लेती है जबकि समय प्रियजन को छीन लेता है।"], ["अंत में कवयित्री मौन क्यों हो जाती है?", "क्योंकि क्षति इतनी गहरी है कि शब्द कम पड़ जाते हैं।"]], "ev": ["कवयित्री पुरानी तस्वीर देखती है", "माँ समुद्र-तट पर खुश बच्ची है", "भाई-बहन उसकी हँसी याद करते हैं", "कवयित्री क्षति के मौन का सामना करती है"]}, {"s": "The Laburnum Top", "t": "Poem 2: The Laburnum Top – टेड ह्यूज़", "k": [["📖 सारांश", "एक शांत दिन बगीचे में लैबर्नम का पेड़ चुपचाप खड़ा है। एक गोल्डफ़िंच आता है और भोजन करते समय पेड़ अचानक सरसराहट से जीवंत हो उठता है, मानो पीले फूल व पक्षी एक दीप्त ऊर्जा हों। फिर पक्षी उड़ जाता है और पेड़ पुनः शांत हो जाता है। कविता प्रकृति की अचानक जीवंतता का उत्सव है।"], ["💡 केंद्रीय भाव", "प्रकृति में छिपी ऊर्जा है; जीवन क्षण भर में आता-जाता है और पक्षी व पेड़ को जीवंत लय में जोड़ता है।"], ["🎨 काव्य-अलंकार", "<b>अलंकार:</b> मानवीकरण (पेड़ जीवित हो उठता है), ध्वनि व रंग के बिंब, आग/बिजली का रूपक, अनुप्रास।"], ["⚠️ परीक्षा बिंदु", "स्थिरता व सजीवता के विरोधाभास पर ध्यान दें। अंत में पेड़ की शांति चक्र पूरा करती है।"]], "q": [["कविता का केंद्रीय भाव?", "गोल्डफ़िंच के आते ही प्रकृति की शांत स्थिरता आनंदमय ऊर्जा में बदल जाती है।"], ["कवि पेड़ को जीवंत कैसे बनाता है?", "मानवीकरण तथा ध्वनि-गति के बिंबों से।"]], "ev": ["लैबर्नम का पेड़ शांत खड़ा है", "गोल्डफ़िंच आता है", "पेड़ गति व ध्वनि से भर उठता है", "पक्षी उड़ता है; शांति लौटती है"]}, {"s": "Voice of the Rain", "t": "Poem 3: The Voice of the Rain – वॉल्ट व्हिटमैन", "k": [["📖 सारांश", "कवि वर्षा से पूछता है कि वह कौन है, तो वर्षा उत्तर देती है कि वह पृथ्वी की कविता है। वह भूमि व सागर से वाष्प बनकर उठती है, आकाश में तैरती है और फिर बरसकर पृथ्वी को पोषित करती है। उसी प्रकार कविता आत्मा में जन्म लेकर संसार में फैलती है और अपने स्रोत को ताज़गी देने लौटती है।"], ["💡 केंद्रीय भाव", "प्रकृति का चक्र सृजन के चक्र का दर्पण है; वर्षा व कविता दोनों जीवन देती हैं और मूल में लौटती हैं।"], ["🎨 काव्य-अलंकार", "<b>अलंकार:</b> मानवीकरण (वर्षा बोलती है), रूपक (वर्षा = कविता), संवाद, बिंब, वृत्ताकार संरचना।"], ["⚠️ परीक्षा बिंदु", "संवाद शैली मुख्य तकनीक है। वर्षा व कविता दोनों पृथ्वी/आत्मा से आरंभ होकर लौटाती हैं।"]], "q": [["वर्षा कविता जैसी कैसे है?", "दोनों स्रोत से उठती हैं, सौंदर्य फैलाती हैं और उसे नवजीवन देने लौटती हैं।"], ["'पृथ्वी की कविता' का क्या अर्थ है?", "वर्षा प्रकृति का अपना गीत है जो जीवन को पोषित व सुंदर बनाता है।"]], "ev": ["कवि पूछता है यह स्वर किसका है", "वर्षा स्वयं को पृथ्वी की कविता बताती है", "वाष्प उठती है, फिर बरसती है", "कविता व वर्षा चक्र पूरा करती हैं"]}, {"s": "Childhood", "t": "Poem 4: Childhood – मार्कस नैटन", "k": [["📖 सारांश", "कवि पूछता है कि बचपन ठीक कब समाप्त होता है और मासूमियत कहाँ चली गई। वह देखता है कि बड़े होने पर वयस्क ज्ञान, पाखंड व चतुराई आ जाती है। बचपन विश्वास व सरल आस्था का समय है, पर वयस्क विस्मय की निर्मल भावना खो देते हैं। वह सोचता है कि क्या बचपन मन में खो गया और शायद किसी दूर संसार में मिल सके।"], ["💡 केंद्रीय भाव", "आयु के साथ मासूमियत का ह्रास; वयस्कता ज्ञान लाती है पर पाखंड व संशयवाद भी।"], ["🎨 काव्य-अलंकार", "<b>अलंकार:</b> प्रश्नवाचक (rhetorical questions), विरोधाभास (बालक बनाम वयस्क), चिंतनशील स्वर, हाथ-बाल-मन के प्रतीक।"], ["⚠️ परीक्षा बिंदु", "कविता का स्वर: नॉस्टैल्जिक व चिंतनशील। प्रश्न जान-बूझकर अनुत्तरित रखे गए हैं।"]], "q": [["कवि किसका शोक मनाता है?", "बड़े होने पर निर्दोष आस्था व विस्मय के खो जाने का।"], ["कवि प्रश्न क्यों पूछता है?", "पाठक को सोचने हेतु कि बचपन कब और कैसे खिसक जाता है।"]], "ev": ["कवि पूछता है बचपन कहाँ गया", "आयु के साथ बदलाव देखता है", "वयस्क ज्ञान पाते, मासूमियत खोते", "सोचता है शायद बचपन कहीं और है"]}, {"s": "Father to Son", "t": "Poem 5: Father to Son – एलिज़ाबेथ जेनिंग्स", "k": [["📖 सारांश", "पिता सोचता है कि रक्त से निकट होने पर भी वह और उसका पुत्र एक-दूसरे को नहीं समझते। वे बातें करते हैं, एक छत के नीचे रहते हैं फिर भी दूर हैं, क्योंकि पिता पुत्र को वह जीवन नहीं दे सकता जो वह चाहता है। वह मौन की खाई पाटने और पुत्र के हृदय तक पहुँचने का मार्ग चाहता है।"], ["💡 केंद्रीय भाव", "पीढ़ी-अंतराल व संवादहीनता; प्रेम होने पर भी माता-पिता व संतान एक-दूसरे को समझने में संघर्ष करते हैं।"], ["🎨 काव्य-अलंकार", "<b>अलंकार:</b> सरल बोलचाल का स्वर, विरोधाभास, पुनरावृत्ति, भावनात्मक अपील, मुक्त छंद।"], ["⚠️ परीक्षा बिंदु", "कविता पिता के दृष्टिकोण से है। मुख्य भाव: तड़प व असहायता, क्रोध नहीं।"]], "q": [["पिता किस समस्या का सामना करता है?", "न वह पुत्र को समझ पाता है, न पुत्र उसे।"], ["कविता क्या सुझाती है?", "पीढ़ी-अंतराल पाटने हेतु प्रेम के साथ समझ आवश्यक है।"]], "ev": ["पिता बढ़ती दूरी महसूस करता है", "वे बिना समझे साथ रहते-बोलते हैं", "पिता को संवाद की कमी खलती है", "वह पुत्र से समझ की चाह रखता है"]}, {"s": "Summer of the White Horse", "t": "The Summer of the Beautiful White Horse – विलियम सरोयन", "k": [["📖 सारांश", "नौ वर्षीय आराम को उसका चचेरा भाई मूराद जगाता है, जिसके पास एक शानदार सफ़ेद घोड़ा है। ईमानदार पर गरीब अर्मेनियाई परिवार के ये भाई जानते हैं कि घोड़ा जॉन बायरो से चुराया गया है। वे हफ़्तों उसकी सवारी करते हैं, दाख-बाड़ी के खलिहान में छिपाते हैं और लौटा देते हैं; मालिक घोड़ा बेहतर पाकर उन्हें क्षमा कर देता है। कहानी दर्शाती है कि गरीबी के प्रलोभन में भी ईमानदारी परिवार का गर्व है।"], ["💡 विषय / संदेश", "ईमानदारी बनाम प्रलोभन; मासूमियत व अर्मेनियाई परिवार का सत्यनिष्ठा पर गर्व।"], ["👤 पात्र व शैली", "<b>पात्र:</b> आराम (कथावाचक), मूराद (शरारती, घोड़ा-प्रेमी), अंकल खोसरोव (ज़िद्दी, ऊँची आवाज़), जॉन बायरो (किसान)। <b>शैली:</b> हास्य, विडंबना, बाल-दृष्टि से प्रथम पुरुष कथन।"], ["⚠️ परीक्षा बिंदु", "पारिवारिक प्रतिष्ठा याद रखें: 'हम ईमानदार हैं।' अंत कोमल है: बायरो घोड़े को स्वस्थ पाकर दंड नहीं देता।"]], "q": [["लड़कों ने घोड़ा क्यों लौटाया?", "क्योंकि उनके परिवार में ईमानदारी महत्त्वपूर्ण थी और उन्होंने केवल उधार लिया था।"], ["अंकल खोसरोव की क्या प्रतिक्रिया रही?", "वे क्रोधित थे और परिवार के सम्मान की रक्षा हेतु तैयार थे।"]], "ev": ["मूराद सफ़ेद घोड़े के साथ आता है", "भाई गुपचुप हफ़्तों सवारी करते हैं", "वे उसे दाख-बाड़ी के खलिहान में छिपाते हैं", "वे जॉन बायरो को लौटा देते हैं"]}, {"s": "The Address", "t": "The Address – मार्गा मिंको", "k": [["📖 सारांश", "द्वितीय विश्वयुद्ध में लेखिका की माँ अपना कीमती सामान श्रीमती डॉर्लिंग को सुरक्षित रखने देकर पता बता देती है। युद्ध के बाद लेखिका उन वस्तुओं को देखने उस घर जाती है, पर श्रीमती डॉर्लिंग लौटाने को राज़ी नहीं। वह माँ की चीज़ें किसी अजनबी के हाथ में देखती है और विचलित होकर लौटती है, स्मृतियों से घिरी। वर्षों बाद जिज्ञासावश उसी सड़क पर लौटती है पर भीतर जाने का साहस नहीं जुटा पाती।"], ["💡 विषय / संदेश", "युद्ध की पीड़ा, स्मृति व क्षति; वस्तुएँ भावनाएँ व पहचान संजोती हैं।"], ["👤 पात्र व शैली", "<b>पात्र:</b> लेखिका (पुत्री), श्रीमती एस (माँ), श्रीमती डॉर्लिंग। <b>शैली:</b> प्रथम
