<title>Class 11 English – One Page Revision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sq{display:grid;gap:8px;margin:10px 0}.sq button{font:inherit;text-align:left;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.25s}.sq button:hover{border-color:var(--c);transform:translateX(4px)}.sq button.g{background:color-mix(in srgb,#2e9e5b 22%,var(--card));border-color:#2e9e5b;transform:none;cursor:default}.sq button.x{animation:sk .4s;border-color:#e0452f}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.sq b{display:inline-block;min-width:1.6em;color:var(--c)}
</style></head><body>
<header><button id="th" aria-label="theme">🌓</button><h1>📚 Class 11 English – Revision</h1><p>SSTC English · Hornbill &amp; Snapshots · 21 lessons · Summary, theme, devices &amp; plot game</p><div class="bar"><i id="pb"></i></div><div id="pt"></div></header>
<nav id="nav"></nav><main id="main"></main><canvas id="cf"></canvas><footer>SSTC English · Class 11 · Quick Revision</footer>
<script>
var D={"ui": {"prog": "Revised: {n}/21 lessons", "win": "🎉 Superb! All 21 lessons revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark lesson as revised", "dn": "✅ Revised! (tap to undo)", "wp": "🧩 Plot Sequencer", "wi": "Tap the events in the correct order of the story / poem.", "er": "Mistakes", "ok": "✅ Done – try once more for zero mistakes!", "pf": "🏆 Perfect!", "rs": "🔀 Shuffle again"}, "ch": [{"s": "Portrait of a Lady", "t": "The Portrait of a Lady – Khushwant Singh", "k": [["📖 Summary", "The narrator remembers his grandmother, an old, frail woman in white who spent her days praying and spinning. In the village she walked him to school and taught him scriptures; after the move to the city their closeness faded as English education and a separate room grew between them. When he returned from university abroad she welcomed him as lovingly as ever, and on the day before she died she sang with the village women and fed the sparrows. After her peaceful death, thousands of sparrows sat silently around her body."], ["💡 Theme / Central Idea", "The beauty of old age, selfless love, and the bridge between generations. True greatness lies in simple faith and affection, not outward glamour."], ["👤 Characters &amp; Devices", "<b>Narrator:</b> Khushwant Singh (as grandson). <b>Grandmother:</b> devout, loving, adaptable. <b>Devices:</b> simile (her white hair like a winter landscape), contrast (village vs city life), symbolism (sparrows = her love and the silent mourning of nature)."], ["⚠️ Exam Points", "She never showed displeasure over his Western education, and her last song with the drum was her way of saying goodbye. Sparrows refusing the bread crumbs show natural grief."]], "q": [["Why did the sparrows sit silently?", "They mourned the death of the grandmother, who had fed them daily; their silence symbolises love and loss."], ["How did the grandmother's role change in the city?", "She became a silent companion, spinning and feeding sparrows, as the narrator turned towards Western studies."]], "ev": ["Grandmother teaches him in the village", "Family moves to the city; bond weakens", "He returns from abroad; she welcomes him", "She dies; sparrows mourn in silence"]}, {"s": "Not Afraid to Die", "t": "We're Not Afraid to Die… If We Can All Be Together", "k": [["📖 Summary", "Gordon Cook, his wife Mary, their two small children and two crew members sailed round the world on the yacht Wanderer III. In the stormy Southern Ocean a giant wave and hurricane-force winds nearly destroyed the boat. Fighting fatigue and fear, the family used ropes to slow the yacht, bailed water and held together as a team. The storm finally passed, and the ordeal left them stronger and closer."], ["💡 Theme / Central Idea", "Courage, teamwork and family unity in the face of nature's fury; the human spirit can overcome even death-like danger."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Gordon Cook (leader, calm), Mary (brave mother), Jonathan and Suzanne (children), crew. <b>Devices:</b> first-person narration, suspense, vivid imagery of the waves."], ["⚠️ Exam Points", "Note the stages: preparation, calm sea, rising storm, damage, survival, relief. The title expresses the family's willingness to face death only together."]], "q": [["Why is the title significant?", "It reflects the family's unity: they would face any danger as long as they stayed together."], ["How did they save Wanderer III?", "By trailing ropes to slow the boat, bailing water, staying calm and cooperating."]], "ev": ["Wanderer III sails round the world", "A fierce storm builds in the Southern Ocean", "A huge wave hits; crew struggle to keep afloat", "Storm eases; family survives together"]}, {"s": "Discovering Tut", "t": "Discovering Tut: the Saga Continues", "k": [["📖 Summary", "The essay traces the discovery and study of Pharaoh Tutankhamun, who died young around 1323 BC. Howard Carter found his tomb in the Valley of the Kings in 1922, and early investigators damaged the mummy while removing it. X-rays in 1968 revealed bone fragments in the skull, fuelling murder theories. A 2005 CT scan by Egyptian experts showed no evidence of a violent blow and suggested a leg injury and infection as the likely cause of death."], ["💡 Theme / Central Idea", "Science constantly revises history; the mystery of Tut's death shows how technology both solves and raises questions."], ["👤 Characters &amp; Devices", "<b>Key figures:</b> Howard Carter, Dr R. G. Harrison, Dr Zahi Hawass. <b>Devices:</b> factual narration, scientific argument, cause–effect analysis."], ["⚠️ Exam Points", "Remember the dates: 1922 (discovery), 1968 (X-rays), 2005 (CT scan). Tut's tomb was unusually intact and filled with golden treasures."]], "q": [["What did the 2005 CT scan conclude?", "No sign of a murderous blow to the head; a leg fracture and infection probably killed him."], ["Why is Tut called a 'saga'?", "His story continues through repeated investigations, new theories and technologies."]], "ev": ["1922: Carter discovers the tomb", "Mummy removed; damage caused", "1968: X-rays show skull fragments", "2005: CT scan rejects murder theory"]}, {"s": "Landscape of the Soul", "t": "Landscape of the Soul", "k": [["📖 Summary", "The essay compares Chinese and Western traditions of painting. Western artists, under the influence of Christianity and later realism, sought lifelike depiction and used perspective. Chinese painters, guided by Daoist and Buddhist ideas, painted landscapes to express inner harmony between humans and nature. Their scrolls blend mountains, water and poetry, inviting the viewer to wander through the painting."], ["💡 Theme / Central Idea", "Art can express the soul as much as outward reality; different cultures see the world differently."], ["👤 Characters &amp; Devices", "<b>Devices:</b> comparison and contrast, cultural analysis, art terminology such as perspective and shan-shui."], ["⚠️ Exam Points", "Be ready to contrast: Western – realism, human figures, perspective; Chinese – spiritual unity, mountains and water, empty space."]], "q": [["How do Chinese landscapes differ from Western art?", "They stress spirit and harmony with nature, not exact likeness or one fixed viewpoint."], ["Why is the essay titled 'Landscape of the Soul'?", "Chinese painters showed the inner self through nature."]], "ev": ["Western art seeks realism and perspective", "Chinese art seeks spiritual harmony", "Chinese scrolls blend nature and poetry", "Both traditions reveal different worldviews"]}, {"s": "Ailing Planet", "t": "The Ailing Planet: the Green Movement's Role", "k": [["📖 Summary", "Nani Palkhivala describes Earth as a sick planet suffering from pollution, ozone depletion, deforestation and climate change caused by human greed. He highlights the Green Movement, which began in the 1960s–70s, as a vital force for awareness and reform. He urges every individual to protect the planet and live sustainably, because the Earth belongs to future generations too."], ["💡 Theme / Central Idea", "Human responsibility for the environment; sustainable development is essential for survival."], ["👤 Characters &amp; Devices", "<b>Writer:</b> Nani Palkhivala. <b>Devices:</b> argumentative style, statistics, appeal to reason and emotion."], ["⚠️ Exam Points", "Important terms: ozone layer, greenhouse effect, Green Movement, sustainable development. Earth should be treated as borrowed from our children."]], "q": [["What role does the Green Movement play?", "It spreads awareness, influences policy and pressures governments to protect nature."], ["What message does the writer give?", "Preserve the environment now, since we hold the planet in trust for future generations."]], "ev": ["Earth is shown as an ailing planet", "Causes: pollution, greed, resource misuse", "Green Movement raises awareness", "Writer calls for sustainable action"]}, {"s": "The Browning Version", "t": "The Browning Version – Terence Rattigan", "k": [["📖 Summary", "Andrew Crocker-Harris, a strict Classics teacher, is leaving his school due to ill health. Students dislike him as cold and unfeeling, but a shy pupil, Taplow, shows unexpected kindness by giving him a book — Browning's translation of Agamemnon. The gesture breaks Crocker-Harris's emotional barrier and shows his hidden warmth. His wife Millie coldly mocks him, while colleague Frobisher also shows quiet respect."], ["💡 Theme / Central Idea", "Kindness can transform even the hardest hearts; teachers, too, need appreciation and affection."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Crocker-Harris (stern, lonely), Taplow (kind, observant), Millie (cruel, unfaithful), Frobisher (sympathetic). <b>Devices:</b> dramatic irony, stage directions, symbolism of the gift."], ["⚠️ Exam Points", "The play shows humanity behind a strict exterior. Taplow's inscription on the book matters because it recognises the teacher's gentle side."]], "q": [["What does Taplow's gift symbolise?", "Genuine affection and respect, which touch Crocker-Harris emotionally."], ["How does Millie treat her husband?", "With contempt and cruelty, adding to his isolation."]], "ev": ["Taplow waits for his strict teacher", "Crocker-Harris is seen as cold", "Taplow gives the Browning book", "The teacher is moved to tears"]}, {"s": "The Adventure", "t": "The Adventure – Jayant Narlikar", "k": [["📖 Summary", "Professor Gaitonde, a historian, leaves for Bombay after a lecture and is caught up in a strange sequence of events during a riot. He finds himself in a parallel world where history took a different course: the Marathas won at Panipat and the British never ruled India. After this unsettling experience he returns, doubting whether it was real, and wonders how small events change history."], ["💡 Theme / Central Idea", "Science fiction explores 'what-if' history and parallel universes; chance events shape destiny."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Prof. Gaitonde, Jayant. <b>Devices:</b> frame narrative, fantasy, historical what-ifs, suspense."], ["⚠️ Exam Points", "Key idea: the many-worlds concept of quantum physics. Hinge event: Marathas winning the Third Battle of Panipat."]], "q": [["What is a parallel world?", "A separate version of reality in which history unfolded differently."], ["Why did Gaitonde feel confused?", "The world he entered had different history, places and customs."]], "ev": ["Gaitonde leaves for Bombay", "Riot and strange events occur", "He enters a parallel world", "He returns and ponders chance in history"]}, {"s": "Silk Road", "t": "Silk Road – Nick Middleton", "k": [["📖 Summary", "Nick Middleton travels through Western Tibet toward the sacred Mount Kailash, retracing part of the ancient Silk Road. He faces the cold, high altitude and arduous roads with his guide Tsetan and driver. He is moved by the beauty, faith and hospitality of Tibetan people and by pilgrims who walk round the holy mountain."], ["💡 Theme / Central Idea", "Travel as discovery: endurance, respect for local faith and the lasting spirit of the Silk Road."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Middleton, Tsetan (guide), Tibetan pilgrims. <b>Devices:</b> travelogue, descriptive imagery, humour, first-person narration."], ["⚠️ Exam Points", "Remember: Mount Kailash (sacred to Hindus and Buddhists), Lake Manasarovar, altitude sickness, the Silk Road's trade history."]], "q": [["Why did Middleton face difficulties?", "High altitude, extreme cold, rough roads and illness."], ["What does Kailash represent?", "A sacred pilgrimage site of immense spiritual importance."]], "ev": ["Middleton begins his trek in Tibet", "Altitude and cold test him", "He meets pilgrims and nomads", "He reaches the holy region of Kailash"]}, {"s": "A Photograph", "t": "Poem 1: A Photograph – Shirley Toulson", "k": [["📖 Summary", "The poet looks at a faded photograph of her mother as a twelve-year-old girl on a seaside picnic with cousins, smiling at the camera. Years later the same cousins can talk of the mother's cheerful laughter. Now the mother is gone, and the poet is left staring at a silent image, struck by the permanence of loss and her inability to express her grief."], ["💡 Central Idea", "Time is cruel; photographs preserve joy but reveal absence. The poem grieves the loss of a loved one and the fading of memory."], ["🎨 Poetic Devices", "<b>Devices:</b> imagery (sea, paddling), simile, repetition of silence, contrast between past joy and present grief, free verse tone."], ["⚠️ Exam Points", "Three stages: mother as a child, mother as a lady, mother gone. Her mother's death left the poet silent beyond words."]], "q": [["What is the central idea?", "Memory and loss; a photograph freezes happiness while time takes loved ones away."], ["Why does the poet fall silent at the end?", "Because the loss is too deep for words."]], "ev": ["Poet examines the old photograph", "Mother is seen as a happy child at the sea", "Cousins recall her laughter", "Poet faces the silence of loss"]}, {"s": "The Laburnum Top", "t": "Poem 2: The Laburnum Top – Ted Hughes", "k": [["📖 Summary", "On a still day the laburnum tree stands silent in the garden. A goldfinch arrives, and the tree suddenly rustles with life as the bird feeds, as if its yellow flowers and bird were one glowing energy. Then the bird flies away and the tree returns to quiet. The poem celebrates nature's sudden bursts of vitality."], ["💡 Central Idea", "Nature is full of hidden energy; life arrives and departs in a moment, linking bird and tree in a living rhythm."], ["🎨 Poetic Devices", "<b>Devices:</b> personification (the tree comes alive), imagery of sound and colour, metaphor of fire/electricity, alliteration."], ["⚠️ Exam Points", "Notice the contrast between stillness and animation. The tree's silence at the end completes the cycle."]], "q": [["What is the central idea?", "Nature's silent stillness transforms into joyful energy when the goldfinch arrives."], ["How does the poet bring the tree to life?", "By personifying it and using sound and movement imagery."]], "ev": ["Laburnum tree stands silent", "Goldfinch arrives", "Tree bursts into movement and sound", "Bird leaves; stillness returns"]}, {"s": "Voice of the Rain", "t": "Poem 3: The Voice of the Rain – Walt Whitman", "k": [["📖 Summary", "The poet asks the rain who it is, and the rain replies that it is the poem of the earth. It rises as vapour from land and sea, floats to the sky and falls again to nourish the earth. Likewise, a poem begins in the soul, goes outward to the world, and returns to refresh its source."], ["💡 Central Idea", "Nature's cycle mirrors the cycle of creativity; rain and poetry both give life and return to origin."], ["🎨 Poetic Devices", "<b>Devices:</b> personification (rain speaks), metaphor (rain = poem), dialogue, imagery, circular structure."], ["⚠️ Exam Points", "Dialogue form is the key technique. Both rain and poetry begin in the earth/soul and give back."]], "q": [["How is rain like a poem?", "Both rise from their source, spread beauty and return to renew it."], ["What does 'the poem of the earth' mean?", "Rain is nature's own song that nourishes and beautifies life."]], "ev": ["Poet asks who the voice is", "Rain says it is the earth's poem", "Vapour rises, then falls again", "Poem and rain complete a cycle"]}, {"s": "Childhood", "t": "Poem 4: Childhood – Markus Natten", "k": [["📖 Summary", "The poet asks when exactly childhood ends and wonders where the innocence has gone. He notices that growing up brings adult knowledge, hypocrisy and shrewdness. Childhood is a time of faith and simple belief, but adults lose their pure sense of wonder. He wonders whether childhood is lost in the mind and perhaps found in a faraway world."], ["💡 Central Idea", "Loss of innocence with age; adulthood brings knowledge but also hypocrisy and cynicism."], ["🎨 Poetic Devices", "<b>Devices:</b> rhetorical questions, contrast (child vs adult), reflective tone, symbolism of hands, hair and mind."], ["⚠️ Exam Points", "Poem's tone: nostalgic, reflective. Questions are intentionally unanswered."]], "q": [["What does the poet mourn?", "The loss of innocent faith and wonder as one grows up."], ["Why does he ask questions?", "To make readers reflect on how and when childhood slips away."]], "ev": ["Poet asks where childhood has gone", "He notes the change that comes with age", "Adults gain knowledge, lose innocence", "He wonders if childhood lives elsewhere"]}, {"s": "Father to Son", "t": "Poem 5: Father to Son – Elizabeth Jennings", "k": [["📖 Summary", "A father reflects that he and his son, though close in blood, do not understand each other. They talk and live under one roof yet remain distant, because the father cannot give the son the life he wants. He wishes for a way to bridge the silence and reach the son's heart."], ["💡 Central Idea", "Generation gap and communication failure; despite love, parent and child struggle to understand each other."], ["🎨 Poetic Devices", "<b>Devices:</b> simple conversational tone, contrast, repetition, emotional appeal, free verse."], ["⚠️ Exam Points", "Poem is told from the father's view. Key emotion: longing and helplessness, not anger."]], "q": [["What problem does the father face?", "He cannot understand his son nor make him understand him."], ["What does the poem suggest?", "Love must be backed by understanding to bridge the generation gap."]], "ev": ["Father senses growing distance", "They live and talk without understanding", "Father regrets lack of communication", "He yearns for understanding with his son"]}, {"s": "Summer of the White Horse", "t": "The Summer of the Beautiful White Horse – William Saroyan", "k": [["📖 Summary", "Nine-year-old Aram is woken by his cousin Mourad, who has a magnificent white horse. The cousins, belonging to an honest but poor Armenian family, know the horse must be stolen from John Byro. They ride the horse for weeks, hide it in a vineyard barn and return it, only for its owner to accept it back, forgiving them after discovering it had improved. The story shows that honesty is the family's pride, even when poverty tempts."], ["💡 Theme / Central Idea", "Honesty versus temptation; innocence and the Armenian family's pride in integrity."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Aram (narrator), Mourad (mischievous, horse-lover), Uncle Khosrove (stubborn, loud), John Byro (the farmer). <b>Devices:</b> humour, irony, first-person child narration."], ["⚠️ Exam Points", "Remember the family reputation: 'We are honest.' The ending is gentle: Byro sees the horse is healthier and does not punish."]], "q": [["Why did the boys return the horse?", "Because honesty mattered to their family and they had only borrowed it."], ["How did Uncle Khosrove react?", "He was angry and ready to defend the family's honour."]], "ev": ["Mourad appears with a white horse", "Boys ride it secretly for weeks", "They hide it in the vineyard barn", "They return it to John Byro"]}, {"s": "The Address", "t": "The Address – Marga Minco", "k": [["📖 Summary", "During the Second World War, the narrator's mother gives her valuables to Mrs Dorling for safekeeping and gives her address. After the war the narrator visits the house to see the belongings she once used, only to find Mrs Dorling unwilling to return them. She sees a mother's things in a stranger's hands, and leaves unsettled, haunted by memory. Years later she returns to the same street out of curiosity but cannot bring herself to enter."], ["💡 Theme / Central Idea", "The pain of war, memory and loss; objects hold emotions and identity."], ["👤 Characters &amp; Devices", "<b>Characters:</b> narrator (daughter), Mrs S (mother), Mrs Dorling (Mrs Dorling's family). <b>Devices:</b> first-person narration, symbolism of objects, flashback, understated tone."], ["⚠️ Exam Points", "The title 'address' symbolises the lost connection to her mother. Emotional detachment shows the trauma of war."]], "q": [["Why does the narrator not take back her belongings?", "They stirred painful memories and no longer felt like home."], ["What do the objects symbolise?", "Her lost family and the identity destroyed by war."]], "ev": ["Mother gives belongings and address", "War ends; narrator visits Mrs Dorling", "She sees familiar things in a strange house", "She leaves, haunted by loss"]}, {"s": "Ranga's Marriage", "t": "Ranga's Marriage – Masti Venkatesha Iyengar", "k": [["📖 Summary", "Ranga returns from Bangalore to his village Hosahalli after his education. The village elder Shyama Shastri believes in child marriage and tries to match Ranga with young Ratna. Ranga resists, but the narrator cleverly makes him think it was his own idea. The story ends with a happy marriage and an amused comment on traditions and modern thinking."], ["💡 Theme / Central Idea", "Clash between tradition and modernity; gentle satire of orthodox customs and clever persuasion."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Ranga, Shyama Shastri, Ratna, Ranga's mother. <b>Devices:</b> humour, irony, satire, local colour."], ["⚠️ Exam Points", "The cleverness lies in the narrator's psychological trick, not force. The story is humorous, never harsh."]], "q": [["How is Ranga persuaded?", "The narrator makes him believe the match is his own idea."], ["What does the story satirise?", "Rigid village customs of early marriage and matchmaking."]], "ev": ["Ranga returns to Hosahalli", "Shastri plans the child-marriage match", "Narrator tricks Ranga into agreeing", "Ranga and Ratna marry"]}, {"s": "Einstein at School", "t": "Albert Einstein at School", "k": [["📖 Summary", "At the Luitpold Gymnasium in Munich young Albert Einstein hated the rigid discipline and rote learning. His teacher Mr Braun and Greek teacher considered him stubborn and disrespectful, telling him he would never succeed. Einstein believed that learning should be curious and free. Eventually he left with a medical excuse, moved to Italy and later Switzerland, where he flourished."], ["💡 Theme / Central Idea", "Rote learning kills creativity; real education requires freedom, questioning and encouragement."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Einstein, Greek teacher, the headmaster. <b>Devices:</b> biographical narrative, criticism of rigid education."], ["⚠️ Exam Points", "Einstein left school at 15 and later became a great physicist. Critique of authority-oriented schools."]], "q": [["Why did Einstein dislike school?", "Because it emphasised memorising and discipline over curiosity."], ["What advice did the teacher give?", "That he'd never amount to anything and should leave."]], "ev": ["Einstein joins the Gymnasium", "Teachers clash with his questioning", "He is told to leave", "He leaves and thrives elsewhere"]}, {"s": "Mother's Day", "t": "Mother's Day – J. B. Priestley", "k": [["📖 Summary", "Mrs Pearson is a quiet housewife exploited by her husband and children. When her neighbour Mrs Fitzgerald, a fortune-teller, learns how she is treated, they swap personalities by magic. The assertive 'Mrs Pearson' shocks the family by refusing to cook and by going out with friends. Realising their mistake, the family learns to respect her, and she regains her independence."], ["💡 Theme / Central Idea", "A mother must be respected, not exploited; self-respect is necessary in relationships."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Mrs Pearson (docile), Mrs Fitzgerald (bold), Mr Pearson (domineering), Doris and Cyril (selfish). <b>Devices:</b> comedy, irony, role reversal, stage directions."], ["⚠️ Exam Points", "The one-act play ends with a changed family. The title mocks society's ritualistic attitude to mothers."]], "q": [["How does the family treat Mrs Pearson?", "They ignore her needs and take her for granted."], ["What lesson does the play give?", "Treat family members with respect and equality."]], "ev": ["Mrs Pearson is taken for granted", "Mrs Fitzgerald swaps personalities", "Family faces her new confidence", "Family learns respect for her"]}, {"s": "Ghat of the Only World", "t": "The Ghat of the Only World – Amitav Ghosh", "k": [["📖 Summary", "Amitav Ghosh writes a tribute to his friend, the poet Agha Shahid Ali, who died of brain cancer in 2001. He recalls Shahid's courage, humour, love for poetry and cultural roots in Kashmir, India and America. Despite illness, Shahid fought bravely and wrote until the end. The ghat symbolises the meeting point of life and death, where he is remembered."], ["💡 Theme / Central Idea", "Friendship, grief and the enduring power of poetry; art outlives its maker."], ["👤 Characters &amp; Devices", "<b>Devices:</b> memoir style, reflective tone, symbolism of the ghat and river, personal anecdotes."], ["⚠️ Exam Points", "Facts: Shahid died in 2001, aged 52. His poems blend Urdu, English and Kashmiri heritage."]], "q": [["Who was Agha Shahid Ali?", "A Kashmiri-American poet, friend of Amitav Ghosh."], ["What does the ghat symbolise?", "The boundary between life and death and a place of final goodbye."]], "ev": ["Writer remembers Shahid's life and poetry", "Shahid is diagnosed with cancer", "He keeps writing despite illness", "Ghosh pays tribute at the ghat"]}, {"s": "Birth", "t": "Birth – A. J. Cronin", "k": [["📖 Summary", "Young Dr Andrew Manson is called to deliver a baby for Susan Mason. The baby is born appearing lifeless and the senior attendants give up, but he first attends to the mother, then refuses to give up on the newborn. By alternately dipping the baby in hot and cold water, he finally revives it with a cry. The story is a triumph of hope and perseverance."], ["💡 Theme / Central Idea", "Hope, perseverance and dedication to duty, especially in medicine; every life is precious."], ["👤 Characters &amp; Devices", "<b>Characters:</b> Dr Andrew Manson, Susan Mason, nurse. <b>Devices:</b> suspense, vivid description, emotional tone, symbolism of new life."], ["⚠️ Exam Points", "Notice the doctor's determination after others lost hope. The title 'Birth' signifies both the baby's and the doctor's emotional rebirth."]], "q": [["How did Dr Manson save the baby?", "By alternating hot and cold baths and refusing to give up."], ["What does the story teach?", "Never abandon hope; perseverance can save a life."]], "ev": ["Manson arrives at Susan's house", "Baby is born lifeless", "He first saves the mother", "Hot-cold treatment revives the baby"]}, {"s": "Tale of Melon City", "t": "The Tale of Melon City – Vikram Seth", "k": [["📖 Summary", "A narrative poem about a king who orders an arch to be built across the road. When the arch is too low and brushes the king's crown, he blames the builders, and a chain of blame leads to the hanging order. At last the noose fits no one but the king. A bizarre rule follows: the next passer-by becomes king, a fool who names the city Melon City."], ["💡 Central Idea", "Satire on foolish rulers, blind obedience and unjust justice."], ["🎨 Poetic Devices", "<b>Devices:</b> satire, irony, humour, narrative verse, repetition, absurd cause-effect chain."], ["⚠️ Exam Points", "The poem is a political satire. The absurd chain of blame mocks authorities who punish others for their own mistakes."]], "q": [["What does the poem satirise?", "Arbitrary rule, unjust justice and blind obedience."], ["How does the king end up hanged?", "The noose was too wide for others and fit him exactly."]], "ev": ["King orders a grand arch", "Arch brushes the king's head; blame begins", "Chain of accused leads to the king", "A fool becomes ruler: Melon City"]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
