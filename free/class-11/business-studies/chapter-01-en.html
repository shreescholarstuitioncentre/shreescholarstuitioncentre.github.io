o.", "cs": [["1 · Promotion", "Idea, feasibility, selecting promoters, name, preparing MOA/AOA and getting consents."], ["2 · Incorporation", "Application to Registrar of Companies with MOA, AOA, declarations → <b>Certificate of Incorporation</b> (CIN)."], ["3 · Capital subscription", "SEBI approval, issue of <b>prospectus</b>, minimum subscription, allotment, stock-exchange listing."], ["4 · Commencement", "Declaration/certificate to commence business; operations start."]], "cv": [["1 · Promotion", "Idea, feasibility, promoters, name, MOA/AOA."], ["2 · Incorporation", "Application to ROC → <b>Certificate of Incorporation</b>."], ["3 · Commencement", "No prospectus or public issue; business can start after incorporation."]], "w7": "💹 Trading on Equity (Capital ₹10 lakh, tax 30%)", "eb": "EBIT", "dp": "Debt share of capital", "ir": "Interest rate", "e0": "EPS all-equity", "e1": "EPS with debt", "fv": "Favourable (ROI &gt; interest)", "uf": "Unfavourable (ROI ≤ interest)", "in": "Interest", "w10": "🌐 Trade & Payments Balance", "ge": "Goods exports", "gi": "Goods imports", "se": "Services exports", "si": "Services imports", "bt": "Balance of Trade", "bs": "Services balance", "ca": "Current account", "su": "surplus", "de": "deficit", "nt": "Units: ₹ thousand crore"}, "ch": [{"s": "Nature & Purpose", "t": "Nature and Purpose of Business", "k": [["📘 Key Ideas", "Business is an economic activity involving regular production or purchase and sale of goods and services to earn profit. <b>Industry</b> (primary, secondary, tertiary) + <b>Commerce</b> (trade + aids to trade) = business. Objectives: profit, market standing, innovation, productivity, social contribution. Business risk arises from uncertainty and cannot be fully eliminated."], ["📋 Features &amp; Classification", "<b>Features:</b> economic activity, production/exchange, regular dealing, profit motive, uncertainty, risk<br><b>Industry:</b> primary (genetic, extractive) · secondary (manufacturing, construction) · tertiary (services)<br><b>Aids to trade:</b> banking, insurance, transport, warehousing, communication, advertising<br><b>Business vs profession vs employment</b> – profit / fees / wages"], ["⚠️ Exam Trap", "Profit is <i>not</i> the only objective – survival, growth and social service matter too. Profession needs specialised knowledge and a professional body. Commerce = trade + auxiliaries, not manufacturing."]], "q": [["Four features of business?", "Economic activity, regular dealings, profit motive, risk and uncertainty of return."], ["Business vs employment (any two)?", "Business: profit, risk, capital needed; Employment: wages/salary, no risk, no capital."]]}, {"s": "Forms of Organisation", "t": "Forms of Business Organisation", "k": [["📘 Key Ideas", "Forms: sole proprietorship, partnership (Indian Partnership Act 1932), Joint Hindu Family, co-operative society, company (Companies Act 2013). Each balances liability, continuity, capital, control and formalities."], ["📋 Features &amp; Classification", "<b>Sole:</b> one owner, unlimited liability, no separate entity<br><b>Partnership:</b> 2–50 partners, mutual agency, unlimited joint &amp; several liability; types: active, sleeping, secret, nominal<br><b>JHF:</b> Karta unlimited liability; coparceners limited to share<br><b>Co-operative:</b> min 10 members, one-member-one-vote<br><b>Company:</b> separate legal entity, perpetual succession, limited liability"], ["⚠️ Exam Trap", "Registration of a partnership is optional, but an unregistered firm can't sue third parties. LLP is a separate entity from a general partnership. Sleeping partner still has unlimited liability."]], "q": [["Partnership vs company (any two)?", "Partnership: no separate entity, unlimited liability; Company: separate legal entity, limited liability."], ["Types of partners?", "Active, sleeping, secret, nominal and partner by estoppel."]]}, {"s": "Private, Public & Global", "t": "Private, Public and Global Enterprises", "k": [["📘 Key Ideas", "Private eference shares<br><b>Borrowed:</b> debentures, bank loans, public deposits, lease<br><b>Short-term:</b> trade credit, commercial paper, factoring<br><b>Internal:</b> retained earnings, depreciation funds"], ["⚠️ Exam Trap", "Equity shares carry no fixed charge; debentures and loans create fixed interest liabilities. Preference shares have priority in dividend and capital repayment. Retained earnings are internal sources."]], "q": [["Equity vs preference shares?", "Equity: variable dividend, voting rights; Preference: fixed dividend, preferential payment."], ["What is trading on equity?", "Using borrowed funds to raise equity-holder returns when ROI exceeds interest."]]}, {"s": "Small Business", "t": "Small Business", "k": [["📘 Key Ideas", "MSMEs form a major part of Indian economy. Entrepreneurship is the process of creating and managing a business. MSMED Act classifies by investment and turnover. Government supports via NSIC, SIDBI, DICs and training."], ["📋 Features &amp; Classification", "<b>MSME limits:</b> Micro ≤ ₹1 cr invest / ₹5 cr turnover; Small ≤ ₹10 cr / ₹50 cr; Medium ≤ ₹50 cr / ₹250 cr<br><b>Role:</b> employment, balanced growth, exports<br><b>Problems:</b> finance, raw material, marketing, skilled labour<br><b>Support:</b> NSIC, SIDBI, DIC, KVIC, tax incentives"], ["⚠️ Exam Trap", "MSME classification now combines investment <i>and</i> turnover. Small business problems include finance and marketing; government support fills these gaps."]], "q": [["Role of small business?", "Generates employment, balanced regional development, exports."], ["Problems of small business?", "Finance, raw material, marketing, skilled labour, competition."]]}, {"s": "Internal Trade", "t": "Internal Trade", "k": [["📘 Key Ideas", "Internal trade is buying and selling within a country: <b>wholesale</b> (bulk) and <b>retail</b> (small quantities). Wholesalers and retailers perform services for manufacturers and customers. Types of retailers: itinerant (hawkers) and fixed shop (departmental store, chain store, supermarket, mail order)."], ["📋 Features &amp; Classification", "<b>Wholesale:</b> bulk, link to manufacturer<br><b>Retail:</b> small quantities, last link<br><b>Fixed shop:</b> departmental store, supermarket, chain store, speciality shop<br><b>Terms:</b> GST, COD, FOB, E&amp;OE"], ["⚠️ Exam Trap", "Departmental stores sell under one roof by departments; supermarkets are self-service. Chambers of commerce and trade fairs promote trade (FICCI, CII, ASSOCHAM)."]], "q": [["Wholesale vs retail?", "Wholesale: bulk to retailers; retail: small quantities to consumers."], ["Features of a departmental store?", "Under one roof, many departments, centralised management, wide range."]]}, {"s": "International Business", "t": "International Business", "k": [["📘 Key Ideas", "International business involves trade across borders for goods, services and capital. Reasons: uneven resources, advantages, growth. Benefits to nation include foreign exchange; to firms, higher profit and growth. Export–import procedure involves enquiry, order, letter of credit, shipping. WTO (1995) promotes free trade."], ["📋 Features &amp; Classification", "<b>Export docs:</b> invoice, bill of lading, shipping bill, certificate of origin, mate's receipt<br><b>Promotion:</b> duty drawback, EOU, SEZ, EPCG<br><b>BoT = exports − imports (goods); BoP records all transactions</b><br><b>Modes:</b> exports/imports, licensing, franchising, joint ventures"], ["⚠️ Exam Trap", "Balance of Trade covers only goods; Balance of Payments covers goods, services and capital. Letter of credit assures the exporter of payment."]], "q": [["Domestic vs international trade?", "International has different currencies, regulations and risks."], ["What is WTO?", "World Trade Organisation, established in 1995 to promote and regulate trade."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};

 if(i==6){var pub=1,s=0,st=function(){return pub?u.cs:u.cv},rd=function(){var a=st();if(s>=a.length)s=a.length-1;$("#cd").innerHTML=a.map(function(x,k){return '<b class="'+(k==s?"a":k<s?"d":"")+'">'+(k+1)+'</b>'+(k<a.length-1?"<hr>":"")}).join("");$("#cc").innerHTML='<div class="pp"><div style="font-weight:800;color:var(--c)">'+a[s][0]+'</div><div>'+a[s][1]+'</div></div>'};

 if(i==7){var f=function(){var E=+$("#e1").value,d=+$("#e2").value,r=+$("#e3").value,C=1000000,sh0=C/10,D1=C*d/100,sh1=(C-D1)/10,I=D1*r/100,e0=E*.7/sh0,e1=Math.max(E-I,0)*.7/sh1,mx=Math.max(e0,e1,1);$("#e1v").textContent="₹"+N(E);$("#e2v").textContent=d+"%";$("#e3v").textContent=r+"%";
  var bar=function(l,x,c){return '<div class="lb">'+l+' ₹'+x.toFixed(2)+'</div><div class="bx"><i style="width:'+x/mx*100+'%;background:'+c+'"></i></div>'};$("#ob").innerHTML=bar(u.e0,e0,"var(--c)")+bar(u.e1,e1,e1>=e0?"#2e9e5b":"#e0452f");
  var roi=E/C*100;$("#ost").innerHTML='<span>ROI = '+roi.toFixed(1)+'%</span><span>'+u.ir+' = '+r+'%</span><span>'+(d==0?"–":roi>r?u.fv:u.uf)+'</span><span>'+u.in+' = ₹'+N(I)+'</span>'};["e1","e2","e3"].forEach(function(x){$("#"+x).oninput=f});f()}
