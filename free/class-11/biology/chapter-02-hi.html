<title>🧬 कक्षा 11 जीव विज्ञान – सूत्र व समीकरण</title>

<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#2e9e5b;--cell:#e9f7ee;--nuc:#c9b6f2;--gold:#f2a900;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif}

header{max-width:1000px;margin:auto;padding:26px 16px 10px;position:relative}

#q{width:100%;padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.ban{background:linear-gradient(90deg,#f2a900,#e0452f);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;animation:in .5s both}
.grid{columns:300px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;cursor:pointer;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.gold .card{border-left-color:var(--gold)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.card.k{background:linear-gradient(135deg,var(--card),var(--cell))}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top h3{font-size:1.05rem}.st{border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--gold);transition:transform .3s}.st:hover{transform:rotate(72deg) scale(1.2)}
.f{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.02rem;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:6px;overflow-wrap:anywhere}
.n{max-height:0;overflow:hidden;color:var(--mut);font-size:.93rem;transition:max-height .4s,margin .4s}.open .n{max-height:200px;margin-top:6px}
.pan{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;animation:in .5s both}
.pan h2{font-size:1.3rem;color:var(--c);margin-bottom:8px}
svg{max-width:100%;height:auto;display:block;margin:auto}
svg text{fill:var(--ink);font:13px Hind,sans-serif}svg .ln{stroke:var(--mut);stroke-width:1;fill:none}
.part{cursor:pointer;transition:filter .2s,transform .3s;transform-box:fill-box;transform-origin:center}.part:hover,.part.on{filter:drop-shadow(0 0 6px #f2a900);transform:scale(1.12)}
#pd{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--bg);min-height:3em}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 4s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
label{display:block;font-size:.92rem;margin:6px 0}input[type=range]{width:100%;accent-color:var(--c)}
select,input[type=number]{font:inherit;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=number]{width:90px}.res{font-weight:600;color:var(--c);margin:4px 0 10px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
