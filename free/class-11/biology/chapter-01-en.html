<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 11 Biology – One Page Revision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.ch button{font:inherit;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.2s}.ch button:hover{border-color:var(--c)}.ch button.on{background:var(--c);color:#fff;border-color:var(--c)}.bx{height:26px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;margin:4px 0 8px}.bx i{display:block;height:100%;transition:width .5s;font-style:normal;font-size:.72rem;color:#fff;text-align:center;line-height:26px;overflow:hidden;white-space:nowrap}.lb{font-size:.85rem;color:var(--mut)}.pp{animation:pop .35s}@keyframes pop{from{transform:scale(.94);opacity:.3}}svg text{fill:var(--mut);font-size:11px}.hb{font-size:4rem;text-align:center;animation:hb 1s infinite}@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}.lg{font-size:3.5rem;text-align:center;animation:lg 4s ease-in-out infinite}@keyframes lg{50%{transform:scale(1.3)}}
</style></head><body>
<header><button id="th" aria-label="theme">🌓</button><h1>🧬 Class 11 Biology – Revision</h1><p>SSTC Biology · All 19 chapters · Concepts, tables, traps &amp; live simulators</p><div class="bar"><i id="pb"></i></div><div id="pt"></div></header>
<nav id="nav"></nav><main id="main"></main><canvas id="cf"></canvas><footer>SSTC Biology · Class 11 · Quick Revision</footer>
<script>
var D={"ui": {"prog": "Revised: {n}/19 chapters", "win": "🎉 Superb! All 19 chapters revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "pl": "▶ Play", "ps": "⏸ Pause", "w8": "🧬 Enzyme Kinetics (with competitive inhibitor)", "sc": "[S] substrate", "vm": "Vmax", "km": "Km", "inh": "Inhibitor [I]", "same": "unchanged", "ci": "Km rises, Vmax same", "w9": "🔬 Mitosis Stage Explorer (2n = 4)", "ph": [["Interphase", "G₁ growth → S: DNA replication → G₂ preparation. Chromatin is thread-like inside an intact nucleus.", "2C → 4C", "4 chromosomes (8 chromatids after S)"], ["Prophase", "Chromatin condenses into chromosomes (two chromatids each); centrioles move apart; nucleolus and nuclear envelope begin to disappear.", "4C", "4 chromosomes, 8 chromatids"], ["Metaphase", "Spindle attaches at kinetochores; chromosomes align on the equatorial plate. Best stage to count chromosomes.", "4C", "4 chromosomes lined up"], ["Anaphase", "Centromeres split; sister chromatids are pulled to opposite poles.", "4C (2C per pole)", "8 chromosomes moving apart"], ["Telophase", "Chromosomes de-condense; nuclear envelopes reform at each pole; nucleoli reappear.", "2C per nucleus", "4 chromosomes per nucleus"], ["Cytokinesis", "Cytoplasm divides (furrow in animals, cell plate in plants) giving two identical daughter cells.", "2C each", "2 cells, each 2n = 4"]], "w10": "🌿 Limiting Factors (Blackman)", "lt": "Light", "co": "CO₂", "tp": "Temperature", "lf": "limiting", "rate": "Photosynthesis rate", "bl": "Rate = factor in shortest supply", "w13": "🫁 Lung Volumes & Capacities", "tv": "Tidal volume (TV)", "irv": "IRV", "erv": "ERV", "rv": "Residual volume (RV)", "mv": "Minute ventilation (12/min)", "w14": "❤️ Heart Rate & Cardiac Output", "hr": "Heart rate", "sv": "Stroke volume", "cy": "Cycle", "br": "Bradycardia", "ta": "Tachycardia", "nm": "Normal", "w17": "⚡ Action Potential", "tm": "Time", "th": "threshold", "apx": ["Resting (polarised): −70 mV", "Depolarisation: Na⁺ rushes in", "Repolarisation: K⁺ moves out", "Hyperpolarisation → Na⁺/K⁺ pump restores −70 mV"]}, "ch": [{"s": "Living World", "t": "The Living World", "k": [["📘 Key Ideas", "Defining features of life: growth (internal, from within), reproduction, metabolism, cellular organisation, consciousness (response to environment). Taxonomy identifies, names and classifies. Hierarchy: <b>Species → Genus → Family → Order → Class → Phylum/Division → Kingdom</b>. Taxonomic aids: herbarium, botanical gardens, museums, zoological parks, keys."], ["📋 Facts &amp; Classification", "<b>Binomial nomenclature</b> (Linnaeus): genus capitalised, species lower case, italicised/underlined, e.g. <i>Mangifera indica</i><br>Rules: ICBN (plants), ICZN (animals)<br>Metabolism and consciousness are true defining properties"], ["⚠️ Exam Trap", "Growth in non-living objects is by external accumulation; in living organisms it is intrinsic. Reproduction is not a defining feature (mules, sterile worker bees). Species is the basic unit of classification."]], "q": [["Define a species.", "A group of individuals with fundamental similarities that can interbreed."], ["Rules of binomial nomenclature?", "Two-part Latin name; genus capital, species small; italics or underlined; author's name abbreviated at end."]]}, {"s": "Biological Classification", "t": "Biological Classification", "k": [["📘 Key Ideas", "Whittaker (1969) proposed five kingdoms: Monera, Protista, Fungi, Plantae, Animalia, based on cell structure, body organisation, nutrition, reproduction and phylogeny. Viruses, viroids and lichens are not placed in these kingdoms."], ["📋 Facts &amp; Classification", "<b>Monera:</b> archaebacteria (halophiles, thermoacidophiles, methanogens), eubacteria, cyanobacteria, mycoplasma<br><b>Protista:</b> diatoms, dinoflagellates, euglenoids, slime moulds, protozoans<br><b>Fungi:</b> Phycomycetes, Ascomycetes (yeast, <i>Penicillium</i>), Basidiomycetes (mushrooms), Deuteromycetes<br>Lichen = alga + fungus; viroid = free RNA; prion = protein"], ["⚠️ Exam Trap", "Mycoplasma lacks a cell wall and is the smallest living cell. Diatomaceous earth is made of diatom shells. Euglenoids are photosynthetic in light but heterotrophic in darkness."]], "q": [["Why aren't viruses placed in any kingdom?", "They are non-cellular and show life only inside a host."], ["Four classes of fungi?", "Phycomycetes, Ascomycetes, Basidiomycetes, Deuteromycetes."]]}, {"s": "Plant Kingdom", "t": "Plant Kingdom", "k": [["📘 Key Ideas", "Plants are classified into algae, bryophytes, pteridophytes, gymnosperms and angiosperms. Life cycles show <b>alternation of generations</b>: haplontic (Spirogyra), diplontic (Fucus, seed plants), haplo-diplontic (bryophytes, pteridophytes)."], ["📋 Facts &amp; Classification", "<b>Algae:</b> Chlorophyceae (chl a, b; starch), Phaeophyceae (chl a, c; fucoxanthin; mannitol), Rhodophyceae (chl a, d; phycoerythrin)<br><b>Bryophytes:</b> gametophyte dominant; liverworts, mosses<br><b>Pteridophytes:</b> sporophyte dominant; first vascular plants<br><b>Gymnosperms:</b> naked seeds (<i>Cycas</i>, <i>Pinus</i>)"], ["⚠️ Exam Trap", "Bryophytes are the 'amphibians' of the plant kingdom. Gametophyte is haploid; sporophyte is diploid. Pteridophytes have vascular tissue but no seeds."]], "q": [["Why are bryophytes called amphibians of plants?", "They live on land but need water for fertilisation."], ["Pigments of brown algae?", "Chlorophyll a, c and fucoxanthin."]]}, {"s": "Animal Kingdom", "t": "Animal Kingdom", "k": [["📘 Key Ideas", "Animals are classified by symmetry, germ layers, coelom, segmentation and notochord. Phyla: Porifera, Cnidaria, Ctenophora, Platyhelminthes, Aschelminthes, Annelida, Arthropoda, Mollusca, Echinodermata, Hemichordata and Chordata."], ["📋 Facts &amp; Classification", "<b>Coelom:</b> acoelomate (Platyhelminthes) · pseudocoelomate (Aschelminthes) · coelomate (rest)<br>Porifera: cellular grade, choanocytes · Cnidaria: cnidoblasts, diploblastic<br>Arthropoda: largest phylum · Mollusca: mantle, radula · Echinodermata: water vascular system<br>Chordata: cyclostomes (jawless), fishes, amphibians, reptiles, aves, mammals"], ["⚠️ Exam Trap", "Cyclostomes are jawless (Agnatha); fish are gnathostomes. Mammals have mammary glands, hair and a diaphragm. Annelida show true metamerism."]], "q": [["Acoelomate vs pseudocoelomate?", "Acoelomates have no body cavity; pseudocoelomates have a cavity not lined by mesoderm."], ["Key features of Chordata?", "Notochord, dorsal hollow nerve cord, paired pharyngeal gill slits."]]}, {"s": "Morphology of Plants", "t": "Morphology of Flowering Plants", "k": [["📘 Key Ideas", "Root, stem, leaf, inflorescence, flower, fruit and seed are studied. Roots: tap, fibrous, adventitious; modifications for storage and support. Leaves: venation and phyllotaxy. Flower: aestivation, placentation, ovary position. Families: Fabaceae, Solanaceae, Liliaceae."], ["📋 Facts &amp; Classification", "<b>Root regions:</b> root cap → meristematic → elongation → maturation<br><b>Venation:</b> reticulate (dicot), parallel (monocot)<br><b>Inflorescence:</b> racemose, cymose<br><b>Ovary:</b> hypogynous (superior), perigynous, epigynous (inferior)<br>Floral formula: ⊕ actinomorphic, % zygomorphic, K, C, A, G"], ["⚠️ Exam Trap", "Monocots have fibrous roots; tendrils may be stem or leaf modifications. Floral formula symbol Ğ means superior ovary and Ḡ inferior. Dicot seed: 2 cotyledons; monocot: 1."]], "q": [["Types of root systems?", "Tap root, fibrous root and adventitious roots."], ["Define placentation.", "The arrangement of ovules within the ovary."]]}, {"s": "Anatomy of Plants", "t": "Anatomy of Angiospermic Plants", "k": [["📘 Key Ideas", "Tissues: meristematic (apical, intercalary, lateral) and permanent (simple: parenchyma, collenchyma, sclerenchyma; complex: xylem, phloem). Tissue systems: epidermal, ground and vascular. Secondary growth in dicot stem and root through vascular and cork cambium."], ["📋 Facts &amp; Classification", "<b>Dicot stem:</b> open vascular bundles, ring arrangement<br><b>Monocot stem:</b> closed bundles scattered<br><b>Xylem:</b> tracheids, vessels, fibres, parenchyma; <b>Phloem:</b> sieve tubes, companion cells, parenchyma, fibres<br>Heartwood (dead, dark) vs sapwood (living, light)"], ["⚠️ Exam Trap", "Monocots show no secondary growth because their bundles are closed. Annual rings reflect cambium activity. Roots have radial vascular bundles."]], "q": [["Why do monocots lack secondary growth?", "Vascular bundles are closed, with no cambium."], ["Open vs closed vascular bundles?", "Open bundles have cambium (dicots); closed bundles lack cambium (monocots)."]]}, {"s": "Animal Tissues", "t": "Structural Organisation in Animals", "k": [["📘 Key Ideas", "Four basic tissues: epithelial, connective, muscular and neural. Epithelium may be simple (squamous, cuboidal, columnar) or compound. Connective tissue: loose, dense, specialised (cartilage, bone, blood). Cell junctions: tight, adhering, gap. Cockroach (<i>Periplaneta americana</i>) is the animal type."], ["📋 Facts &amp; Classification", "<b>Muscle:</b> skeletal (striated, voluntary), smooth (non-striated, involuntary), cardiac (striated, involuntary, intercalated discs)<br><b>Cockroach:</b> 10-segment abdomen, 2 pairs of wings (tegmina + hind), chewing mouthparts, open circulation, Malpighian tubules, mosaic vision"], ["⚠️ Exam Trap", "Cardiac muscle is striated, branched and involuntary. Tight junctions prevent leakage; gap junctions allow communication. Cockroach has a 13-chambered heart."]], "q": [["Types of muscle tissue?", "Skeletal, smooth and cardiac."], ["Function of gap junctions?", "They connect cytoplasm of adjacent cells and allow exchange of ions and small molecules."]]}, {"s": "Cell", "t": "Cell: The Unit of Life", "k": [["📘 Key Ideas", "Cell theory (Schleiden, Schwann; Virchow: new cells arise from pre-existing cells). Prokaryotes have no membrane-bound nucleus and have 70S ribosomes; eukaryotes have 80S. <b>Fluid mosaic model</b> (Singer &amp; Nicolson, 1972) describes the membrane. Organelles: ER, Golgi, lysosomes, mitochondria, plastids, ribosomes, cytoskeleton, centrosome, nucleus."], ["📋 Facts &amp; Classification", "<b>Mitochondria:</b> double membrane, cristae, own DNA<br><b>Chloroplast:</b> thylakoids, grana, stroma<br><b>Golgi:</b> packaging and secretion; <b>lysosomes:</b> hydrolytic enzymes<br>Plant cell wall: cellulose; middle lamella: calcium pectate"], ["⚠️ Exam Trap", "Mycoplasma lacks a cell wall. Ribosomes in mitochondria and plastids are 70S. Plant cells have plastids and a cell wall; animal cells have centrioles."]], "q": [["Prokaryotic vs eukaryotic cells?", "Prokaryotic: no true nucleus, 70S ribosomes; eukaryotic: true nucleus, organelles, 80S ribosomes."], ["Why are mitochondria called powerhouses?", "They produce most of the cell's ATP."]]}, {"s": "Biomolecules", "t": "Biomolecules", "k": [["📘 Key Ideas", "Cells contain carbohydrates, proteins, lipids and nucleic acids. Proteins have four structural levels: primary (peptide bond), secondary (α-helix, β-sheet), tertiary, quaternary (haemoglobin). <b>Enzymes</b> lower activation energy and are classified into 6 classes. Factors: temperature, pH, substrate concentration, inhibitors."], ["📋 Facts &amp; Classification", "<b>Michaelis–Menten:</b> V = V<sub>max</sub>[S]/(K<sub>m</sub> + [S])<br>K<sub>m</sub> = [S] at ½V<sub>max</sub><br>Classes: oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases<br>Cofactors: prosthetic group, co-enzyme, metal ion"], ["⚠️ Exam Trap", "Competitive inhibitors raise apparent K<sub>m</sub> without changing V<sub>max</sub>. Enzymes don't change equilibrium. DNA has thymine; RNA has uracil."]], "q": [["What is Km?", "The substrate concentration at which the reaction rate is half of Vmax."], ["What is competitive inhibition?", "The inhibitor resembles the substrate and competes for the active site."]]}, {"s": "Cell Cycle", "t": "Cell Cycle and Cell Division", "k": [["📘 Key Ideas", "The cell cycle has interphase (G₁, S, G₂) and M phase. <b>Mitosis</b> (equational): prophase, metaphase, anaphase, telophase. <b>Meiosis</b> (reductional) has two divisions; prophase I has leptotene, zygotene, pachytene, diplotene and diakinesis."], ["📋 Facts &amp; Classification", "S phase doubles DNA (2C → 4C); chromosome number is unchanged<br>Crossing over at <b>pachytene</b>; chiasmata at <b>diplotene</b><br>Mitosis: 2n → 2n (2 cells); Meiosis: 2n → n (4 cells)<br>G₀: quiescent stage"], ["⚠️ Exam Trap", "In mitosis chromosome number stays constant; in meiosis it halves. Anaphase begins with centromere splitting. Synapsis occurs in zygotene."]], "q": [["Significance of meiosis?", "Maintains chromosome number and creates variation by crossing over."], ["Mitosis vs meiosis?", "Mitosis: one division, 2 identical cells; meiosis: two divisions, 4 haploid cells."]]}, {"s": "Photosynthesis", "t": "Photosynthesis in Higher Plants", "k": [["📘 Key Ideas", "Light reaction (thylakoids): PSII splits water, releases O₂; ATP and NADPH formed. Dark reaction (stroma): Calvin cycle in C₃ plants (carboxylation by RuBisCO, reduction, regeneration). C₄ plants have Kranz anatomy and PEP carboxylase; photorespiration is minimal."], ["📋 Facts &amp; Classification", "3 ATP + 2 NADPH per CO₂ fixed (C₃); 5 ATP in C₄<br>Glucose needs 18 ATP + 12 NADPH<br>Blackman: rate limited by the factor in minimum<br>Examples of C₄: maize, sugarcane"], ["⚠️ Exam Trap", "The oxygen comes from water, not CO₂. RuBisCO can act as oxygenase (photorespiration). C₄ plants show higher productivity at high temperature."]], "q": [["Source of O₂ in photosynthesis?", "Photolysis of water."], ["What is Kranz anatomy?", "Bundle sheath cells arranged around vascular bundles in C₄ leaves."]]}, {"s": "Respiration in Plants", "t": "Respiration in Plants", "k": [["📘 Key Ideas", "Glycolysis in cytoplasm converts glucose to 2 pyruvate (net 2 ATP, 2 NADH). Aerobic respiration: pyruvate oxidation, Krebs cycle (matrix) and ETS (inner mitochondrial membrane) with oxygen as final acceptor. Anaerobic: ethanol or lactic acid fermentation."], ["📋 Facts &amp; Classification", "<b>RQ = CO₂ evolved / O₂ consumed</b><br>Carbohydrates 1; fats ≈ 0.7; proteins ≈ 0.9; organic acids &gt; 1<br>Net 36–38 ATP per glucose (aerobic)<br>Oxidative phosphorylation: chemiosmosis, ATP synthase"], ["⚠️ Exam Trap", "ETS final acceptor is O₂, forming water. Glycolysis needs no oxygen. RQ of fats is less than 1 because they need more O₂."]], "q": [["Meaning of RQ?", "The ratio of CO₂ released to O₂ consumed."], ["Where does Krebs cycle occur?", "In the mitochondrial matrix."]]}, {"s": "Growth & Development", "t": "Plant Growth and Development", "k": [["📘 Key Ideas", "Growth is irreversible increase in size. Phases: meristematic, elongation, maturation. Growth curves are sigmoid. <b>PGRs:</b> auxins (apical dominance, rooting), gibberellins (stem elongation, bolting), cytokinins (cell division, delay senescence), ethylene (ripening), ABA (stress, dormancy)."], ["📋 Facts &amp; Classification", "Geometric growth: W₁ = W₀e^(rt)<br>Photoperiodism: short-day, long-day, day-neutral plants<br>Vernalisation: cold treatment induces flowering<br>Ethylene is the only gaseous PGR"], ["⚠️ Exam Trap", "ABA is antagonistic to GA. Ethylene promotes ripening, not auxin. Cytokinins were first isolated from coconut milk (kinetin)."]], "q": [["Which PGR is gaseous?", "Ethylene."], ["Role of auxin in apical dominance?", "Auxin from the apical bud inhibits lateral bud growth."]]}, {"s": "Breathing", "t": "Breathing and Exchange of Gases", "k": [["📘 Key Ideas", "Inspiration: diaphragm contracts and external intercostals lift ribs, volume ↑, pressure ↓. Expiration is passive. Gas exchange by diffusion across the thin alveolar membrane. O₂ is carried mostly as oxyhaemoglobin; CO₂ mostly as bicarbonate. Rhythm centre in medulla; pneumotaxic centre in pons."], ["📋 Facts &amp; Classification", "<b>VC = TV + IRV + ERV</b>; TLC = VC + RV; IC = TV + IRV; FRC = ERV + RV<br>O₂: 97% Hb; CO₂: 70% bicarbonate, 20–25% carbaminohaemoglobin<br>Disorders: asthma, emphysema, occupational lung diseases"], ["⚠️ Exam Trap", "CO₂ diffuses about 20–25 times faster than O₂. One Hb binds 4 O₂. Bohr effect: high pCO₂ shifts curve right."]], "q": [["Vital capacity formula?", "TV + IRV + ERV."], ["How is CO₂ transported?", "~70% as bicarbonate, 20–25% as carbaminohaemoglobin, 7% dissolved."]]}, {"s": "Circulation", "t": "Body Fluids and Circulation", "k": [["📘 Key Ideas", "Blood: plasma, RBC, WBC, platelets. Blood groups: ABO, Rh. Coagulation: fibrinogen → fibrin. Heart: 4 chambers with double circulation. Cardiac cycle (0.8 s): systole and diastole. Pacemaker SAN → AVN → bundle of His → Purkinje fibres."], ["📋 Facts &amp; Classification", "<b>CO = HR × SV</b> ≈ 72 × 70 mL ≈ 5 L/min<br>ECG: P (atrial depolarisation), QRS (ventricular depolarisation), T (ventricular repolarisation)<br>BP ≈ 120/80 mm Hg<br>O⁻ universal donor; AB⁺ universal recipient"], ["⚠️ Exam Trap", "Erythroblastosis foetalis occurs when an Rh⁻ mother carries an Rh⁺ foetus. SAN is the natural pacemaker. Lymph is plasma-like, with fewer proteins."]], "q": [["Cardiac output formula?", "Heart rate × stroke volume."], ["What does the QRS complex represent?", "Depolarisation of the ventricles."]]}, {"s": "Excretion", "t": "Excretory Products and their Elimination", "k": [["📘 Key Ideas", "Kidneys filter blood through nephrons: glomerulus + Bowman's capsule, PCT, loop of Henle, DCT and collecting duct. Urine formation: filtration, reabsorption and secretion. Countercurrent mechanism concentrates urine. Control: ADH, RAAS, ANF."], ["📋 Facts &amp; Classification", "GFR ≈ 125 mL/min (≈ 180 L/day)<br>Kidneys receive ≈ 1/5 of cardiac output<br>ADH ↑ water reabsorption; aldosterone ↑ Na⁺ reabsorption; ANF ↓ BP<br>Disorders: uremia, renal calculi, glomerulonephritis; treatment: dialysis"], ["⚠️ Exam Trap", "Juxtamedullary nephrons have long loops and conserve water. Most reabsorption occurs in PCT. Diabetes insipidus is due to ADH deficiency."]], "q": [["Function of loop of Henle?", "Creates osmotic gradient for concentrating urine."], ["What is GFR?", "Volume of filtrate formed per minute by all nephrons (~125 mL)."]]}, {"s": "Locomotion", "t": "Locomotion and Movement", "k": [["📘 Key Ideas", "Muscles: skeletal, smooth, cardiac. <b>Sliding filament theory:</b> actin slides over myosin using ATP; Ca²⁺ exposes myosin binding sites. Skeleton: 206 bones; axial 80, appendicular 126. Joints: fibrous, cartilaginous, synovial."], ["📋 Facts &amp; Classification", "Sarcomere: Z-line to Z-line; I band (actin), A band (myosin), H zone<br>Red fibres: myoglobin, mitochondria (aerobic); white fibres: anaerobic<br>Disorders: myasthenia gravis, tetany, muscular dystrophy, arthritis, osteoporosis, gout"], ["⚠️ Exam Trap", "During contraction I band and H zone shorten, while A band stays constant. Ball-and-socket joints: shoulder, hip. Ca²⁺ binds troponin."]], "q": [["What does the A band represent?", "The region containing myosin filaments, constant in length."], ["Types of synovial joints?", "Ball and socket, hinge, pivot, gliding, saddle."]]}, {"s": "Neural Control", "t": "Neural Control and Co-ordination", "k": [["📘 Key Ideas", "Neuron: dendrites, cell body, axon. Resting potential ≈ −70 mV; action potential through Na⁺ influx (depolarisation) then K⁺ efflux (repolarisation); Na⁺/K⁺ pump (3 Na⁺ out, 2 K⁺ in). Synapse: electrical or chemical (acetylcholine). Brain: forebrain, midbrain, hindbrain."], ["📋 Facts &amp; Classification", "<b>Brain:</b> cerebrum (intelligence), thalamus, hypothalamus (thermoregulation), pons, cerebellum (balance), medulla (breathing, heartbeat)<br><b>Eye:</b> rods (dim light, rhodopsin), cones (colour)<br><b>Ear:</b> cochlea (organ of Corti), vestibular apparatus (balance)"], ["⚠️ Exam Trap", "Myelinated fibres conduct faster by saltatory conduction. Reflex arc: receptor → afferent → CNS → efferent → effector. Cones concentrate at fovea."]], "q": [["What causes depolarisation?", "Rapid influx of Na⁺ ions."], ["Function of cerebellum?", "Co-ordination and balance."]]}, {"s": "Chemical Co-ordination", "t": "Chemical Co-ordination and Integration", "k": [["📘 Key Ideas", "Endocrine glands release hormones: hypothalamus, pituitary, pineal, thyroid, parathyroid, thymus, adrenal, pancreas and gonads. Hormones act through membrane receptors (second messenger cAMP) or intracellular receptors (steroids)."], ["📋 Facts &amp; Classification", "<b>Anterior pituitary:</b> GH, TSH, ACTH, LH, FSH, prolactin; <b>posterior:</b> oxytocin, vasopressin (stored)<br>Thyroid: T₃, T₄; PTH ↑ Ca²⁺; adrenal cortex: cortisol, aldosterone; medulla: adrenaline<br>Pancreas: insulin (β, lowers glucose), glucagon (α, raises glucose)"], ["⚠️ Exam Trap", "Posterior pituitary stores, not synthesises, oxytocin and ADH. Iodine deficiency causes goitre. Diabetes insipidus = ADH deficiency; diabetes mellitus = insulin deficiency."]], "q": [["Which hormone lowers blood glucose?", "Insulin."], ["Disorder due to iodine deficiency?", "Simple goitre (enlarged thyroid)."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
