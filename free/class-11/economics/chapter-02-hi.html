<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}

.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;cursor:pointer;transition:.2s;flex:none}.pill:hover{transform:translateY(-2px)}
.pill[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}

main{max-width:1000px;margin:auto;padding:16px}
h3.s{margin:22px 0 8px;font-size:1.25rem;color:var(--c);animation:in .5s both}

.grid{columns:290px;column-gap:14px}

.card h3{font-size:1.02rem;color:var(--c)}.f{margin-top:2px;overflow-wrap:anywhere}
.card.ok{border-left-color:#2e9e5b}.card.ok h3::after{content:" ✓";color:#2e9e5b}
.test .f{filter:blur(7px);transition:filter .3s}.test .show .f{filter:none}
.ex{display:none;color:var(--mut);font-size:.92rem;margin-top:4px}.open .ex{display:block}
.pr small{color:var(--mut)}
.dg{cursor:default}.dg:hover{transform:none}
.tilt{transform-origin:300px 150px;animation:tilt 4s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(2.5deg)}0%,100%{transform:rotate(-2.5deg)}}
.fl{animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}
.pop{animation:in .6s both}@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;margin:0 0 14px;animation:in .6s both}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.ins label{font-size:.85rem;color:var(--mut);display:block}.ins input{width:100%;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.out{display:flex;flex-wrap:wrap;gap:8px}.out div{flex:1;min-width:130px;background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.85rem;color:var(--mut)}.out b{display:block;font-size:1.15rem;color:var(--ink)}
.sb{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:8px}.sb i{transition:width .6s;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
