<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}

header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;font-size:.92em}.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin:4px 0}.st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.st span{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:99px;padding:2px 12px;font-weight:600}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.ch button,.ch select{font:inherit;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.2s}.ch button:hover{border-color:var(--c)}.ch button.on{background:var(--c);color:#fff;border-color:var(--c)}.bx{height:30px;border-radius:8px;background:var(--line);overflow:hidden;display:flex;margin:4px 0 10px}.bx i{display:block;height:100%;transition:width .5s}.big{font:800 1.8rem 'Baloo 2',sans-serif;text-align:center;padding:10px;border-radius:14px;background:var(--card);border:2px solid var(--c);margin:8px 0;animation:pop .35s}@keyframes pop{from{transform:scale(.85);opacity:.3}}.lb{font-size:.85rem;color:var(--mut)}
</style></head><body>

var D={"ui": {"loc": "en-IN", "prog": "Revised: {n}/10 chapters", "win": "🎉 Superb! All 10 chapters revised!", "quiz": "🧠 Quick Check (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w1": "⚖️ Accounting Equation Balancer", "as": "Assets", "lc": "Liabilities (amber) + Capital (green)", "A": "Assets", "Li": "Liabilities", "Cp": "Capital", "ev": [["Owner starts with ₹50,000 cash", 50000, 0, 50000], ["Buy goods on credit ₹20,000", 20000, 20000, 0], ["Pay creditors ₹8,000", -8000, -8000, 0], ["Bank loan ₹30,000", 30000, 30000, 0], ["Earn commission ₹5,000", 5000, 0, 5000], ["Pay rent ₹3,000", -3000, 0, -3000], ["Drawings ₹4,000", -4000, 0, -4000], ["Buy furniture for cash ₹10,000", 0, 0, 0]], "w2": "🔁 Debit or Credit?", "inc": "Increase", "dec": "Decrease", "ty": ["Asset", "Liability", "Capital", "Income / Gain", "Expense / Loss"], "tx": ["Assets: debit increase, credit decrease (e.g., cash comes in → Dr Cash).", "Liabilities: credit increase, debit decrease (e.g., pay creditor → Dr Creditors).", "Capital: credit increase, debit decrease (drawings → Dr Drawings).", "Income: credit increase, debit decrease (commission earned → Cr Commission).", "Expenses: debit increase, credit decrease (rent paid → Dr Rent)."], "w6": "📉 SLM vs WDV Depreciation", "cost": "Cost", "scr": "Scrap value (% of cost)", "life": "Life (years)", "wr": "WDV rate", "yr": "yr", "rt": "SLM rate", "y1": "yr-1", "bv": "End book value", "w7": "📅 Bill Maturity Calculator", "dd": "Date of drawing / acceptance", "per": "Period of bill", "mo": "months", "dr": "Drawn", "gr": "grace days", "sn": "Falls on Sunday → due on previous business day", "w8": "📊 Mini Trading & P&L", "ns": "Net sales", "os": "Opening stock", "pu": "Net purchases", "de": "Direct expenses", "cs": "Closing stock", "ie": "Indirect expenses", "gp": "Gross profit", "np": "Net profit", "nl": "Net loss"}, "ch": [{"s": "Introduction", "t": "Introduction to Accounting", "k": [["📘 Key Ideas", "Accounting = identifying, measuring, recording and communicating financial information. Book-keeping records; accounting also classifies, summarises and interprets. Users: owners, managers, investors, creditors, government. Basic terms: assets, liabilities, capital, drawings, revenue, expenses, debtors, creditors. Accounting cycle runs from transaction → journal → ledger → trial balance → financial statements."], ["🧮 Rules &amp; Formulas", "Accounting equation: Assets = Liabilities + Capital<br>Capital = Assets − Liabilities<br>Profit = Closing capital − Opening capital + Drawings − Additional capital"], ["⚠️ Exam Trap", "Drawings <i>reduce</i> capital and are not an expense. Business is treated as separate from the owner. Book-keeping is clerical; accounting is analytical."]], "q": [["Difference between book-keeping and accounting?", "Book-keeping only records transactions; accounting also classifies, summarises, analyses and communicates results."], ["Opening capital ₹1,00,000, closing ₹1,40,000, drawings ₹10,000. Profit?", "40,000 + 10,000 = ₹50,000."]]}, {"s": "Theory Base", "t": "Theory Base of Accounting", "k": [["📘 Key Ideas", "GAAP are accepted rules. Concepts: business entity, money measurement, going concern, accounting period, cost, dual aspect, revenue recognition, matching, full disclosure, consistency, conservatism, materiality, objectivity. Ind AS converge with IFRS. Basis: cash vs accrual."], ["🧮 Rules &amp; Formulas", "Dual aspect: Assets = Equities (every debit has equal credit)<br>Matching: expenses of the period set against its revenue<br>Conservatism: provide for all probable losses, ignore unrealised profits"], ["⚠️ Exam Trap", "Going concern justifies depreciation and showing fixed assets at cost. Accrual basis (not cash basis) is required by Companies Act. Consistency ≠ conservatism."]], "q": [["Which concept supports charging depreciation?", "Going concern concept (the business will continue for the foreseeable future)."], ["What is the dual aspect concept?", "Every transaction has two effects – a debit and an equal credit."]]}, {"s": "Recording I", "t": "Recording of Transactions – I", "k": [["📘 Key Ideas", "Source documents (vouchers) → Journal → Ledger. Rules: <b>Personal</b> – debit the receiver, credit the giver; <b>Real</b> – debit what comes in, credit what goes out; <b>Nominal</b> – debit expenses/losses, credit incomes/gains. Cash book: single, double (cash+bank), triple (cash+discount+bank) column; it is both journal and ledger."], ["🧮 Rules &amp; Formulas", "Assets/Expenses: ↑ Dr, ↓ Cr<br>Liabilities/Capital/Income: ↑ Cr, ↓ Dr<br>Discount allowed → Dr; Discount received → Cr<br>Contra entry: both accounts in cash book (marked C)"], ["⚠️ Exam Trap", "Discount allowed is a loss (debit side); discount received is a gain (credit side). Contra entries aren't posted to ledger. Cash book never shows credit balance of cash."]], "q": [["Give the rule for real accounts.", "Debit what comes in, credit what goes out."], ["Which side records cash received from debtor?", "Debit (receipts) side of cash book."]]}, {"s": "Recording II", "t": "Recording of Transactions – II", "k": [["📘 Key Ideas", "Special purpose books: purchases book, sales book, purchases return (debit note), sales return (credit note), journal proper. Petty cash book works on the <b>imprest system</b>. Posting to ledger, balancing, trade vs cash discount. GST shown separately as input/output tax."], ["🧮 Rules &amp; Formulas", "Trade discount: deducted in invoice, not recorded in books<br>Imprest = fixed float; reimbursed = amount spent<br>Debit note → purchase returns; Credit note → sales returns"], ["⚠️ Exam Trap", "Credit purchase of an asset (furniture) goes to <b>journal proper</b>, not purchases book. Only credit transactions in goods are entered in purchases/sales books."]], "q": [["Where is credit purchase of furniture recorded?", "Journal proper (it is not goods for resale)."], ["What is the imprest system?", "A fixed advance is given to the petty cashier and replenished periodically to the original amount."]]}, {"s": "Bank Reconciliation", "t": "Bank Reconciliation Statement", "k": [["📘 Key Ideas", "BRS reconciles the cash book (bank column) with the passbook. Differences arise due to timing (cheques issued/deposited not yet cleared) and items known only to one party (charges, interest, direct payments, dishonour)."], ["🧮 Rules &amp; Formulas", "<b>Start from Dr balance of cash book:</b><br>Add: cheques issued not presented, interest/direct credits by bank<br>Less: cheques deposited not cleared, bank charges, direct debits, dishonour<br>Starting from passbook balance → reverse all signs"], ["⚠️ Exam Trap", "If overdraft or credit balance is given, reverse the sign of every item. Bank charges are known to the bank first, so cash book needs adjustment. BRS is not an account."]], "q": [["Cheque issued but not yet presented – effect?", "Add to cash book balance (or deduct from passbook balance)."], ["Why prepare a BRS?", "To locate differences and detect errors/frauds."]]}, {"s": "Trial Balance & Errors", "t": "Trial Balance and Rectification of Errors", "k": [["📘 Key Ideas", "Trial balance lists all ledger balances to check arithmetical accuracy (Dr = Cr). Errors: omission (complete/partial), commission, principle, compensating. Differences are put in the <b>suspense account</b> until rectified."], ["🧮 Rules &amp; Formulas", "TB agrees even with: complete omission, errors of principle, compensating errors<br>TB disagrees with: partial omission, wrong posting amount on one side, wrong totalling<br>Rectify: use suspense for one-sided errors only"], ["⚠️ Exam Trap", "Agreement of TB is not proof of accuracy. Errors of principle (capital vs revenue) don't affect TB totals. Never use suspense in two-sided errors."]], "q": [["Does a complete omission affect the TB?", "No – both debit and credit are missed, so it still agrees."], ["What is a suspense account?", "A temporary account to hold TB difference until errors are located."]]}, {"s": "Depreciation", "t": "Depreciation, Provisions and Reserves", "k": [["📘 Key Ideas", "Depreciation = fall in the value of fixed assets from wear, time or obsolescence. Methods: <b>SLM</b> (fixed amount) and <b>WDV</b> (fixed %). Provision = charge against profit for known liabilities/losses (e.g., doubtful debts). Reserve = appropriation of profit (general/specific, revenue/capital, secret)."], ["🧮 Rules &amp; Formulas", "SLM: (Cost − Scrap)/Life; WDV: Rate × opening book value<br>Book value = Cost − Accumulated depreciation<br>Profit/loss on sale = Sale price − Book value"], ["⚠️ Exam Trap", "Provision is charged <i>before</i> profit; reserve is created <i>from</i> profit. WDV never reaches zero. Depreciation is charged on use, not on market value."]], "q": [["SLM on cost ₹1,00,000, scrap ₹10,000, life 5 years?", "(1,00,000 − 10,000)/5 = ₹18,000 per year."], ["Provision vs reserve?", "Provision is a charge against profit for a known liability; reserve is an appropriation of profit to strengthen finances."]]}, {"s": "Bills of Exchange", "t": "Bills of Exchange", "k": [["📘 Key Ideas", "A bill is an unconditional written order from <b>drawer</b> to <b>drawee</b> to pay a sum to the <b>payee</b>. Bill vs promissory note. Maturity = date + period + 3 grace days. Treatments: retained till maturity, endorsed, discounted, dishonoured (noting charges), retired, renewed."], ["🧮 Rules &amp; Formulas", "Due date = Date of drawing + period + 3 days of grace<br>Discount = Amount × Rate × days/365<br>Receiver: Bills Receivable A/c Dr; Payer: Bills Payable A/c Cr<br>Dishonour: Drawee A/c Dr to Bills Receivable A/c"], ["⚠️ Exam Trap", "If maturity falls on a public holiday the bill is due on the previous business day. Drawer = maker of bill; drawee accepts it. Promissory note has two parties, bill has three."]], "q": [["Due date of a 3-month bill drawn on 1 Jan?", "1 Apr + 3 days = 4 April."], ["Entry in drawer's books on dishonour?", "Drawee's A/c Dr to Bills Receivable A/c."]]}, {"s": "Financial Statements I", "t": "Financial Statements – I", "k": [["📘 Key Ideas", "Capital vs revenue items (benefit > 1 year = capital). Final accounts: <b>Trading A/c</b> (gross profit), <b>Profit &amp; Loss A/c</b> (net profit), <b>Balance Sheet</b> (position). Closing entries transfer nominal accounts to Trading and P&amp;L."], ["🧮 Rules &amp; Formulas", "COGS = Opening stock + Net purchases + Direct expenses − Closing stock<br>GP = Net sales − COGS<br>Net profit = GP + Other incomes − Indirect expenses"], ["⚠️ Exam Trap", "Carriage inwards, wages, freight → Trading A/c; carriage outwards, salaries, rent → P&amp;L. Purchase of machinery or its installation cost is capital, not an expense."]], "q": [["Formula for cost of goods sold?", "Opening stock + Net purchases + Direct expenses − Closing stock."], ["Is carriage outward a trading item?", "No – it is an indirect (selling) expense in P&amp;L."]]}, {"s": "Financial Statements II", "t": "Financial Statements – II", "k": [["📘 Key Ideas", "Adjustments: closing stock, outstanding/prepaid expenses, accrued/advance income, depreciation, bad debts, provision for doubtful debts, interest on capital and drawings. Each adjustment is shown <b>twice</b> – in P&amp;L (or Trading) and on the Balance Sheet. Balance sheet order: liquidity or permanence."], ["🧮 Rules &amp; Formulas", "Expense in P&amp;L = Paid + Outstanding − Prepaid<br>Income in P&amp;L = Received + Accrued − Advance<br>Provision charge = New provision − Old provision<br>Bad debts + new provision (Dr); old provision (Cr)"], ["⚠️ Exam Trap", "Outstanding expense → added to expense and shown as liability; prepaid → deducted and shown as asset. Adjustments given outside the trial balance are shown twice, those inside only once. Drawings reduce capital."]], "q": [["Treatment of outstanding rent?", "Add to rent in P&amp;L; show as current liability in Balance Sheet."], ["Where does drawings appear in the Balance Sheet?", "Deducted from capital on the liabilities side."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
