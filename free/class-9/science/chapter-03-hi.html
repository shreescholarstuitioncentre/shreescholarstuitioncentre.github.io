["राइबोसोम","राइबोसोम RNA और प्रोटीन के सूक्ष्म कण हैं जहाँ प्रोटीन बनते हैं।",["mRNA दोनों उप-इकाइयों के बीच बँध जाता है।","tRNA प्रत्येक कोडॉन के अनुरूप अमीनो अम्ल लाता है।","अमीनो अम्ल जुड़कर बढ़ती पॉलीपेप्टाइड शृंखला बनाते हैं।"],"कोशिकाद्रव्य में मुक्त या खुरदरी ER पर मिलते हैं। इन्हें प्रोटीन के कारखाने कहते हैं।"],
["हरितलवक","हरितलवक हरा लवक है जो प्रकाश संश्लेषण करता है।",["थाइलैकॉइड में क्लोरोफ़िल प्रकाश को अवशोषित करता है।","प्रकाश अभिक्रियाएँ जल को विघटित करती हैं, O₂ मुक्त करती हैं और ATP बनाती हैं।","पीठिका में केल्विन चक्र CO₂ का उपयोग करके ग्लूकोज़ बनाता है।"],"इसके अपने DNA और राइबोसोम होते हैं। पादपों और शैवालों में पाया जाता है।"],
["रिक्तिका","रिक्तिकाएँ द्रव से भरी थैलियाँ हैं जो पदार्थों का भंडारण करती हैं।",["पादप कोशिका में टोनोप्लास्ट से घिरी एक बड़ी केंद्रीय रिक्तिका होती है।","जल परासरण से अंदर आता है और कोशिकाद्रव्य को भित्ति से दबा देता है (स्फीति)।","रिक्तिकाएँ शर्करा, लवण, वर्णक और अपशिष्ट भी जमा करती हैं।"],"जंतुओं में रिक्तिकाएँ छोटी और अस्थायी होती हैं; पादपों में बड़ी और स्थायी।"],
["लयनकाय","लयनकाय पाचक एंजाइमों की छोटी थैलियाँ हैं।",["गॉल्जी एंजाइमों से भरे लयनकाय कलिका के रूप में अलग करता है।","लयनकाय खाद्य रिक्तिका या क्षतिग्रस्त कोशिकांग से जुड़ जाता है।","एंजाइम उसे पचा देते हैं और उपयोगी उत्पाद मुक्त हो जाते हैं।"],"क्षतिग्रस्त कोशिका अपने लयनकाय फोड़कर स्वयं को पचा लेती है, इसलिए इन्हें आत्मघाती थैली कहते हैं।"],
["परासरण","परासरण वरणात्मक पारगम्य झिल्ली से जल की वह नेट गति है जो अधिक जल सांद्रता से कम जल सांद्रता की ओर होती है।",["अल्पपरासरी विलयन में जल अंदर आता है; पादप कोशिका स्फीत हो जाती है।","समपरासरी विलयन में जल दोनों ओर बराबर जाता है।","अतिपरासरी विलयन में जल बाहर निकलता है; कोशिका सिकुड़ती है (पादपों में जीवद्रव्यकुंचन)।"],"उदाहरण: किशमिश पानी में फूलती है, अचार में नमक डालने से पानी निकलता है, जड़ें जल अवशोषित करती हैं।"],
["कोशिकाओं में विसरण","विसरण अणुओं की अधिक सांद्रता से कम सांद्रता की ओर गति है, जिसमें ऊर्जा खर्च नहीं होती।",["O₂ बाहर अधिक है, इसलिए वह कोशिका में विसरित होती है।","CO₂ अंदर अधिक है, इसलिए वह बाहर विसरित होती है।","गति तब तक चलती है जब तक सांद्रताएँ बराबर न हो जाएँ।"],"यह निष्क्रिय प्रक्रिया है। कोशिका झिल्ली के पार गैसों का आदान-प्रदान इसी पर निर्भर है।"],
["विभज्योतक ऊतक","विभज्योतक ऊतक सक्रिय रूप से विभाजित होती कोशिकाओं से बना है, जो पादप के वृद्धि क्षेत्रों में मिलता है।",["कोशिकाएँ समसूत्री विभाजन से बार-बार विभाजित होती हैं।","संतति कोशिकाएँ बढ़कर स्थायी ऊतक बन जाती हैं।","नई कोशिकाएँ शीर्षों, पर्वसंधियों और पार्श्वों पर जुड़ती हैं।"],"कोशिकाएँ छोटी, पतली भित्ति वाली, सघन कोशिकाद्रव्य, बड़े केंद्रक वाली होती हैं; रिक्तिका नहीं और बीच में खाली स्थान नहीं।"],
["शीर्षस्थ विभज्योतक","शीर्षस्थ विभज्योतक जड़ों और प्ररोहों के वृद्धि शीर्षों पर होता है।",["शीर्ष की कोशिकाएँ विभाजित होती हैं।","नई कोशिकाएँ शीर्ष को आगे धकेलती हैं।","पुरानी कोशिकाएँ पीछे लंबी होकर परिपक्व हो जाती हैं।"],"यह तने और जड़ की लंबाई बढ़ाता है।"],
["अंतर्विष्ट विभज्योतक","अंतर्विष्ट विभज्योतक पत्तियों या पर्वों के आधार पर स्थित होता है।",["यह पर्वसंधियों के पास सक्रिय रहता है।","इसकी कोशिकाएँ पर्वसंधियों के बीच लंबाई जोड़ती हैं।","चरी गई घास इसी विभज्योतक से दोबारा उगती है।"],"घास और बाँस में पाया जाता है। शीर्ष हटाने के बाद भी यह बना रहता है।"],
["पार्श्व विभज्योतक","पार्श्व विभज्योतक (एधा) तनों और जड़ों के पार्श्वों में स्थित होता है।",["संवहन एधा भीतर की ओर जाइलम और बाहर की ओर फ्लोएम जोड़ती है।","कॉर्क एधा बाहर की ओर कॉर्क बनाती है।","काष्ठ जुड़ने पर वार्षिक वलय बनते हैं।"],"यह काष्ठीय पादपों की मोटाई (घेरा) बढ़ाता है।"],
["मृदूतक","मृदूतक जीवित, पतली भित्ति वाली कोशिकाओं का सबसे सरल स्थायी ऊतक है।",["अंतरकोशिकीय स्थान वाली कोशिकाएँ भोजन और जल का भंडारण करती हैं।","हरितलवक सहित यह क्लोरेनकाइमा है और प्रकाश संश्लेषण करता है।","जलीय पादपों में वायु-स्थान वायुतक बनाते हैं, जो उत्प्लावकता देता है।"],"मंड संचित करता है; वल्कुट, मज्जा और पत्तियों में मिलता है।"],
["स्थूलकोण ऊतक","स्थूलकोण ऊतक की जीवित कोशिकाएँ कोनों पर स्थूलित होती हैं।",["कोनों का स्थूलन (सेलुलोज़ + पेक्टिन) मज़बूती देता है।","कोशिकाएँ लचीली रहती हैं, इसलिए अंग मुड़ सकता है।","यह पर्णवृंत और वृद्धि करते तनों को सहारा देता है।"],"तनों और पर्णवृंतों की बाह्यत्वचा के ठीक नीचे मिलता है।"],
["दृढ़ोतक","दृढ़ोतक की कोशिकाएँ मृत होती हैं, जिनकी मोटी लिग्निनयुक्त भित्ति और संकरी गुहा होती है।",["लिग्निन भित्तियों को कठोर और दृढ़ बनाता है।","मृत कोशिकाओं में जीवद्रव्य नहीं होता।","तंतु और स्क्लेरीड पादप को कठोर और मज़बूत बनाते हैं।"],"नारियल के रेशे, बीज आवरण और नाशपाती की किरकिरी में; जूट के तंतु।"],
["जाइलम","जाइलम जटिल ऊतक है जो जल और खनिज जड़ों से ऊपर की ओर ले जाता है।",["जड़ें जल अवशोषित करती हैं; मूल दाब और वाष्पोत्सर्जन उसे ऊपर खींचते हैं।","यह मृत वाहिकाओं और वाहिनिकाओं से गुजरता है।","मृदूतक भोजन संचित करता है; तंतु सहारा देते हैं।"],"तत्व: वाहिनिकाएँ, वाहिकाएँ, मृदूतक, तंतु। केवल जाइलम मृदूतक जीवित होता है।"],
["फ्लोएम","फ्लोएम जटिल ऊतक है जो भोजन (शर्करा) पत्तियों से अन्य भागों तक ले जाता है।",["पत्तियाँ प्रकाश संश्लेषण से शर्करा बनाती हैं।","शर्करा चालनी नलिकाओं में प्रवेश करके भंडारण या वृद्धि वाले भागों तक बहती है।","सहकोशिकाएँ भरने के लिए ऊर्जा देती हैं।"],"चालनी नलिकाएँ, सहकोशिकाएँ, मृदूतक और तंतु। केवल फ्लोएम तंतु मृत होते हैं।"],
["रेखित पेशी","रेखित (कंकाल) पेशी के तंतु लंबे, बेलनाकार और बहुकेंद्रकी होते हैं, जिन पर हल्की और गहरी पट्टियाँ होती हैं।",["एक्टिन और मायोसिन तंतु दोहराई जाती पट्टियों में स्थित होते हैं।","तंत्रिका संकेत से तंतु खिसकते हैं और पेशी तंतु छोटा हो जाता है।","संकेत रुकने पर पेशी शिथिल हो जाती है।"],"ऐच्छिक; अस्थियों से जुड़ी होती है।"],
["अरेखित पेशी","अरेखित (चिकनी) पेशी की कोशिकाएँ तर्कुरूप होती हैं, जिनमें एक केंद्रीय केंद्रक होता है।",["तंत्रिका या हार्मोन के संकेत धीमा संकुचन आरंभ करते हैं।","संकुचन की तरंगें नलियों में पदार्थ आगे बढ़ाती हैं (क्रमाकुंचन)।","ये धीरे-धीरे थकती हैं।"],"अनैच्छिक; आहारनाल, आमाशय, रक्त वाहिकाओं, मूत्राशय और उपतारा (आइरिस) में मिलती है।"],
["हृदय पेशी","हृदय पेशी हृदय की भित्ति बनाती है।",["गति-निर्धारक हर आवेग शुरू करता है।","अंतर्वेशित पट्टिकाएँ संकेत को एक कोशिका से दूसरी तक तेज़ी से पहुँचाती हैं।","हृदय बिना विश्राम के लयबद्ध रूप से संकुचित होता है।"],"अनैच्छिक, रेखित, शाखित, प्रत्येक कोशिका में एक केंद्रक।"],
["न्यूरॉन (तंत्रिका कोशिका)","न्यूरॉन तंत्रिका तंत्र की संरचनात्मक और कार्यात्मक इकाई है।",["द्रुमिकाएँ उद्दीपन ग्रहण करती हैं।","आवेग कोशिका काय से होकर तंत्रिकाक्ष के अनुदिश जाता है, माइलिन पर अधिक तेज़ी से।","अंतस्थ अगले न्यूरॉन तक रसायन (न्यूरोट्रांसमीटर) छोड़ते हैं।"],"लंबी कोशिकाएँ; इनकी लंबाई एक मीटर तक हो सकती है।"],
["उपकला ऊतक","उपकला ऊतक शरीर की सतहों का आवरण और अस्तर बनाता है।",["कोशिकाएँ आधार झिल्ली पर निरंतर परत बनाती हैं।","शल्की: विसरण। घनाकार: स्रावण और अवशोषण। स्तंभाकार: अवशोषण (आंत)।","पक्ष्माभी कोशिकाएँ श्लेष्मा को बुहारती हैं (श्वास नली)।"],"रक्षा करता, अवशोषित करता और स्रावित करता है; आधात्री बहुत कम।"],
["एरिओलर संयोजी ऊतक","एरिओलर ऊतक ढीला संयोजी ऊतक है जो अंगों के भीतर के स्थान भरता है।",["कोलैजन और प्रत्यास्थ तंतु जेली जैसी आधात्री में होते हैं।","तंतुकोरक तंतु बनाते हैं, मैक्रोफ़ेज रोगाणुओं को निगलते हैं, मास्ट कोशिकाएँ हिस्टामिन छोड़ती हैं।","यह अंगों को सहारा देता है और ऊतक की मरम्मत में मदद करता है।"],"अंगों, रक्त वाहिकाओं और तंत्रिकाओं के आसपास तथा त्वचा के नीचे मिलता है।"],
["वसा ऊतक","वसा ऊतक संयोजी ऊतक है जो वसा का भंडारण करता है।",["कोशिकाएँ वसा को बड़ी बूँदों के रूप में जमा करती हैं।","भोजन की कमी में वसा ऊर्जा का भंडार है।","यह ऊष्मीय रोधन और अंगों को गद्दी जैसा सहारा देता है।"],"त्वचा के नीचे और वृक्कों के आसपास मिलता है।"],
