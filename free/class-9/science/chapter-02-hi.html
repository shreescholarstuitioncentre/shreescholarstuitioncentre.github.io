const N=[
["ठोस में कणों की व्यवस्था (Arrangement of Particles in Solid)","ठोस में कणों के बीच प्रबल आकर्षण बल होता है, इसलिए कण नियमित और पास-पास सटी हुई व्यवस्था में रहते हैं।",["प्रबल आकर्षण हर कण को एक निश्चित स्थान पर बाँधे रखता है।","कण एक जगह से दूसरी जगह नहीं जा सकते, वे केवल अपनी जगह पर कंपन करते हैं।","गर्म करने पर कंपन बढ़ते हैं और अंत में ठोस पिघल जाता है।"],"निश्चित आकार और आयतन, नगण्य संपीड्यता, उच्च घनत्व।"],
["द्रव में कणों की व्यवस्था (Arrangement of Particles in Liquid)","द्रव के कण पास-पास होते हैं, परंतु बल ठोस से कमज़ोर होते हैं, इसलिए कण गति कर सकते हैं।",["कण एक-दूसरे के ऊपर फिसलते रहते हैं।","कण पास रहते हैं, इसलिए आयतन निश्चित रहता है।","द्रव बर्तन के आकार में बह जाता है।"],"निश्चित आयतन, निश्चित आकार नहीं, बहता है, बहुत कम संपीड्य।"],
["गैस में कणों की व्यवस्था (Arrangement of Particles in Gas)","गैस के कण बहुत दूर-दूर होते हैं और उनके बीच आकर्षण बल लगभग शून्य होता है।",["कण सीधी रेखा में तेज़ी से और यादृच्छिक गति करते हैं।","वे आपस में और बर्तन की दीवारों से टकराते हैं।","दीवारों से इन टकराहटों से गैस का दाब उत्पन्न होता है।"],"न आकार निश्चित, न आयतन; अत्यधिक संपीड्य; सबसे कम घनत्व।"],
["पदार्थ की अवस्थाओं का अंतरूपांतरण (Interconversion of States of Matter)","तापमान या दाब बदलने से कणों की गतिज ऊर्जा बदलती है और पदार्थ की अवस्था बदल जाती है।",["गर्म करने पर: कण ऊर्जा पाते हैं, बल कमज़ोर पड़ते हैं (ठोस → द्रव → गैस)।","ठंडा करने पर: कण ऊर्जा खोते हैं, बल जीतते हैं (गैस → द्रव → ठोस)।","कुछ ठोस द्रव बने बिना सीधे गैस बन जाते हैं (ऊर्ध्वपातन)।"],"गैस को दबाकर और ठंडा करके द्रवित किया जा सकता है। ठोस CO₂ (शुष्क बर्फ) ऊर्ध्वपातित होती है।"],
["गलना और जमना (Melting and Freezing)","गलनांक पर ठोस का द्रव में बदलना गलन कहलाता है। इसकी उल्टी प्रक्रिया जमना है।",["ऊष्मा से बर्फ का तापमान 0 °C (273 K) तक बढ़ता है।","0 °C पर तापमान स्थिर रहता है। ऊष्मा (गलन की गुप्त ऊष्मा) कणों की व्यवस्था तोड़ने में लगती है।","सारी बर्फ पिघलने के बाद जल का तापमान फिर बढ़ने लगता है।"],"बर्फ का गलनांक = 0 °C = 273 K। गुप्त ऊष्मा छिपी रहती है: तापमान नहीं बदलता।"],
["वाष्पन और संघनन (Evaporation and Condensation)","क्वथनांक से कम तापमान पर द्रव का वाष्प बनना वाष्पन है। वाष्प का फिर द्रव बनना संघनन है।",["सतह के तेज़ कण हवा में निकल जाते हैं।","बचा हुआ द्रव अपने उच्च ऊर्जा वाले कण खो देता है, इसलिए ठंडा हो जाता है।","ठंडी होकर वाष्प ऊर्जा खोती है और बूँदें बनाती है।"],"वाष्पन तापमान, सतह क्षेत्रफल और हवा से बढ़ता है तथा आर्द्रता से घटता है।"],
["ऊर्ध्वपातन (Sublimation)","ठोस का गर्म करने पर द्रव बने बिना सीधे वाष्प में बदलना ऊर्ध्वपातन है।",["NH₄Cl + रेत के मिश्रण को चीनी मिट्टी की प्याली में गर्म करते हैं।","NH₄Cl सीधे वाष्प बनकर ऊपर उठता है।","वाष्प ठंडी कीप की दीवार से टकराकर शुद्ध ठोस के रूप में जम जाती है। रेत नीचे रह जाती है।"],"ऊर्ध्वपातित होने वाले पदार्थ: अमोनियम क्लोराइड, कपूर, नैफ्थैलीन, आयोडीन, शुष्क बर्फ।"],
["कणों का विसरण (Diffusion of Particles)","कणों की यादृच्छिक गति के कारण अलग-अलग पदार्थों के कणों का अपने-आप आपस में मिल जाना विसरण है।",["पानी में स्याही की एक बूँद डाली जाती है।","स्याही और पानी के कण यादृच्छिक गति करते हुए आपस में टकराते हैं।","स्याही के कण अधिक सांद्रता से कम सांद्रता की ओर फैलते हैं, जब तक मिश्रण एकसमान न हो जाए।"],"गैसों में सबसे तेज़, द्रवों में धीमा, ठोसों में सबसे धीमा। तापमान बढ़ने पर तेज़।"],
["विलयन, निलंबन और कोलॉइड (Solution, Suspension and Colloid)","ये मिश्रण कणों के आकार में भिन्न होते हैं, और यही उनके रूप व व्यवहार को तय करता है।",["विलयन: बहुत छोटे कण, पारदर्शी, नीचे नहीं बैठते, छानने से अलग नहीं होते।","निलंबन: बड़े दिखने वाले कण, अपारदर्शी, रखने पर नीचे बैठते हैं, छानने से अलग होते हैं।","कोलॉइड: मध्यम कण, नीचे नहीं बैठते, प्रकाश का प्रकीर्णन करते हैं (टिंडल प्रभाव)।"],"उदाहरण: नमक का पानी (विलयन), गंदा पानी (निलंबन), दूध और कोहरा (कोलॉइड)।"],
["निस्यंदन द्वारा पृथक्करण (Separation by Filtration)","निस्यंदन से द्रव में उपस्थित अघुलनशील ठोस को अलग किया जाता है।",["फ़नल में फ़िल्टर पेपर लगाकर उसे साफ़ बीकर के ऊपर रखें।","काँच की छड़ की सहायता से मिश्रण को धीरे-धीरे डालें।","द्रव छिद्रों से निकल जाता है (निस्यंद)। ठोस कागज़ पर रुक जाता है (अवशेष)।"],"उपयोग: पानी से रेत, चाय की पत्ती से चाय, गंदे पानी की सफ़ाई।"],
["वाष्पीकरण द्वारा पृथक्करण (Separation by Evaporation)","द्रव को उड़ाकर विलयन से घुला हुआ ठोस प्राप्त किया जाता है।",["नमक के विलयन को तिपाई पर रखी चीनी मिट्टी की प्याली में गर्म करें।","पानी वाष्प बनकर उड़ जाता है।","प्याली में सूखे नमक के क्रिस्टल बच जाते हैं।"],"यह तभी उपयुक्त है जब ठोस गर्म करने पर न टूटे। अन्यथा क्रिस्टलन विधि अपनाएँ।"],
["सरल आसवन उपकरण (Simple Distillation Apparatus)","सरल आसवन से द्रव को घुले ठोस से, या दो मिश्रणीय द्रवों को अलग किया जाता है जिनके क्वथनांक में 25 K से अधिक अंतर हो।",["मिश्रण को गर्म करें। कम क्वथनांक वाला घटक पहले वाष्प बनता है।","वाष्प संघनित्र में जाती है, जिसमें नीचे से ठंडा पानी बहता है।","वह संघनित होकर आसुत के रूप में ग्राही पात्र में टपकती है।"],"उदाहरण: खारे पानी से शुद्ध जल, जल से एसीटोन।"],
["प्रभाजी आसवन उपकरण (Fractional Distillation Apparatus)","जब दो मिश्रणीय द्रवों के क्वथनांक में 25 K से कम अंतर हो, तब इसका उपयोग होता है।",["मिश्रण को गर्म करने पर वाष्प स्तंभ में ऊपर उठती है।","काँच के मनके बड़ी सतह देते हैं। वाष्प बार-बार संघनित और वाष्पित होती है।","अधिक वाष्पशील द्रव सबसे पहले ऊपर पहुँचता है और एकत्र होता है।"],"उदाहरण: एथेनॉल और जल, वायु की गैसें, पेट्रोलियम के प्रभाज।"],
["पृथक्कारी कीप (Separating Funnel)","इससे घनत्व के अंतर के आधार पर दो अमिश्रणीय द्रवों को अलग किया जाता है।",["मिश्रण को कीप में डालकर परतें बनने तक रखें।","अधिक घना द्रव नीचे बैठता है।","टोंटी खोलकर निचली परत निकालें, फिर टोंटी बंद करें। ऊपरी परत अलग से एकत्र करें।"],"उदाहरण: तेल और पानी, मिट्टी का तेल और पानी।"],
["अपकेंद्रण (Centrifugation)","अपकेंद्रण में तेज़ घुमाकर निलंबित बहुत छोटे कणों को अलग किया जाता है।",["मिश्रण की नलियाँ रोटर में रखकर तेज़ी से घुमाई जाती हैं।","घूमने से बाहर की ओर प्रबल बल उत्पन्न होता है।","भारी कण नीचे बैठ जाते हैं। हल्का द्रव ऊपर रहता है।"],"उपयोग: दूध से क्रीम, रक्त की जाँच, वॉशिंग मशीन का ड्रायर।"],
