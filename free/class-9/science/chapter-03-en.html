["Plant Cell","A plant cell has a rigid cell wall, a large central vacuole and chloroplasts, besides the organelles it shares with animal cells.",["The cellulose cell wall gives fixed shape and protection.","Chloroplasts trap sunlight to make food by photosynthesis.","The large vacuole stores cell sap and keeps the cell firm (turgid)."],"Plastids and the cell wall are found only in plant cells."],
["Animal Cell","An animal cell is bounded only by a flexible plasma membrane. It has small vacuoles and centrioles.",["The membrane controls what enters and leaves.","The nucleus directs all activities; mitochondria release energy.","Lysosomes digest waste and foreign material."],"No cell wall and no chloroplasts, so the shape can change."],
["Prokaryotic Cell","Prokaryotic cells (bacteria, blue-green algae) have no true nucleus and no membrane-bound organelles.",["Genetic material lies free in the cytoplasm as a nucleoid.","Ribosomes make proteins; small DNA rings are called plasmids.","Cell wall and capsule protect the cell; flagella help movement."],"Size about 1 to 10 µm. Ribosomes are the only organelle."],
["Eukaryotic Cell","Eukaryotic cells (plants, animals, fungi, protists) have a true nucleus with a nuclear membrane and membrane-bound organelles.",["The nuclear envelope separates DNA from the cytoplasm.","Organelles share the work: energy, protein making, packaging, digestion.","This division of labour allows larger, more complex cells."],"Size about 10 to 100 µm. Much larger than prokaryotic cells."],
["Plasma Membrane","The plasma membrane is a thin, flexible, selectively permeable layer of lipids and proteins (fluid mosaic model).",["Phospholipid heads face water and tails face inward, forming a bilayer.","Small molecules (O₂, CO₂) pass by diffusion; water by osmosis.","Protein channels and carriers move other substances in or out."],"Selective permeability keeps the inside different from the outside. Flexibility allows endocytosis."],
["Cell Wall","The cell wall is a rigid outer layer around the plasma membrane of plants (cellulose), fungi (chitin) and bacteria.",["The middle lamella (pectin) glues neighbouring cells.","Primary and secondary walls of cellulose give strength.","Plasmodesmata are channels linking neighbouring cells."],"It is freely permeable, stops the cell bursting in water and gives shape."],
["Nucleus","The nucleus is the control centre. It holds DNA as chromatin and is enclosed by a double nuclear envelope.",["DNA instructions are copied into mRNA.","mRNA leaves through nuclear pores.","Ribosomes in the cytoplasm use it to build proteins."],"The nucleolus makes ribosomal RNA. Chromatin condenses into chromosomes during cell division."],
["Mitochondria","Mitochondria are the powerhouses of the cell. They release energy from food.",["Glucose is broken down in the matrix and on the cristae.","The energy is stored as ATP, the energy currency of the cell.","They have their own DNA and ribosomes, so they make some of their own proteins."],"Double membrane; the folded inner membrane (cristae) increases surface area."],
["Endoplasmic Reticulum (ER)","The ER is a network of membrane-bound tubes and sheets running through the cytoplasm.",["Rough ER carries ribosomes and makes proteins.","Smooth ER makes lipids and detoxifies drugs and poisons.","Both transport materials around the cell."],"It forms the internal transport system and gives mechanical support."],
["Golgi Apparatus","The Golgi apparatus is a stack of flat membrane sacs that modifies, packs and dispatches materials.",["Vesicles from the ER fuse with the cis face.","Proteins and lipids are modified as they pass through the stack.","Finished products leave the trans face in vesicles."],"It also forms lysosomes and makes complex sugars."],
["Ribosomes","Ribosomes are tiny granules of RNA and protein where proteins are made.",["mRNA binds between the two subunits.","tRNA brings the amino acid matching each codon.","Amino acids join to form a growing polypeptide chain."],"Found free in the cytoplasm or on rough ER. Called the protein factories."],
["Chloroplast","A chloroplast is a green plastid that carries out photosynthesis.",["Chlorophyll in the thylakoids absorbs light.","Light reactions split water, release O₂ and make ATP.","The Calvin cycle in the stroma uses CO₂ to make glucose."],"It has its own DNA and ribosomes. Found in plants and algae."],
["Vacuole","Vacuoles are fluid-filled sacs that store substances.",["A plant cell has one large central vacuole bounded by the tonoplast.","Water enters by osmosis and presses the cytoplasm to the wall (turgor).","Vacuoles also store sugars, salts, pigments and waste."],"In animals vacuoles are small and temporary; in plants large and permanent."],
["Lysosome","Lysosomes are small sacs of digestive enzymes.",["The Golgi buds off lysosomes full of enzymes.","A lysosome fuses with a food vacuole or damaged organelle.","Enzymes digest it and the useful products are released."],"A damaged cell bursts its lysosomes and digests itself, so they are called suicide bags."],
["Osmosis","Osmosis is the net movement of water through a selectively permeable membrane from higher to lower water concentration.",["In a hypotonic solution, water enters; a plant cell becomes turgid.","In an isotonic solution, water moves equally both ways.","In a hypertonic solution, water leaves; the cell shrinks (plasmolysis in plants)."],"Examples: raisins swell in water, salting pickles draws out water, roots absorb water."],
["Diffusion in Cells","Diffusion is the movement of molecules from higher to lower concentration, without using energy.",["O₂ is higher outside, so it diffuses into the cell.","CO₂ is higher inside, so it diffuses out.","Movement continues until concentrations are equal."],"A passive process. Gas exchange across cell membranes depends on it."],
["Meristematic Tissue","Meristematic tissue is made of actively dividing cells found in growing regions of the plant.",["Cells divide repeatedly by mitosis.","Daughter cells grow and become permanent tissues.","New cells are added at tips, nodes and sides."],"Cells are small, thin-walled, with dense cytoplasm, a large nucleus, no vacuole and no gaps."],
["Apical Meristem","Apical meristem is at the growing tips of roots and shoots.",["Cells at the tip divide.","New cells push the tip forward.","Older cells elongate behind and mature."],"It increases the length of stem and root."],
["Intercalary Meristem","Intercalary meristem lies at the base of leaves or internodes.",["It stays active near the nodes.","Its cells add length between the nodes.","Grazed grass regrows from this meristem."],"Found in grasses and bamboo. It remains after the tip is removed."],
["Lateral Meristem","Lateral meristem (cambium) lies along the sides of stems and roots.",["Vascular cambium adds xylem inward and phloem outward.","Cork cambium produces cork outward.","Annual growth rings form as wood is added."],"It increases the girth (thickness) of woody plants."],
["Parenchyma","Parenchyma is the simplest permanent tissue of living, thin-walled cells.",["Cells with intercellular spaces store food and water.","With chloroplasts it is chlorenchyma and does photosynthesis.","In aquatic plants air spaces form aerenchyma, which gives buoyancy."],"Stores starch; found in cortex, pith and leaves."],
["Collenchyma","Collenchyma has living cells thickened at the corners.",["Corner thickening (cellulose + pectin) adds strength.","Cells stay flexible so the organ can bend.","It supports leaf stalks and young stems while they grow."],"Found just below the epidermis of stems and petioles."],
["Sclerenchyma","Sclerenchyma has dead cells with thick lignified walls and a narrow lumen.",["Lignin makes the walls hard and rigid.","Dead cells have no protoplasm.","Fibres and sclereids make the plant stiff and strong."],"Found in coconut husk, seed coats and pear grit; jute fibres."],
["Xylem","Xylem is a complex tissue that carries water and minerals from roots upward.",["Roots absorb water; root pressure and transpiration pull it up.","It moves through dead vessels and tracheids.","Parenchyma stores food; fibres give support."],"Elements: tracheids, vessels, parenchyma, fibres. Only xylem parenchyma is living."],
["Phloem","Phloem is a complex tissue that carries food (sugars) from leaves to other parts.",["Leaves make sugars by photosynthesis.","Sugars enter sieve tubes and flow to storage or growing parts.","Companion cells supply energy for loading."],"Sieve tubes, companion cells, parenchyma and fibres. Only phloem fibres are dead."],
["Striated Muscle","Striated (skeletal) muscle has long cylindrical, multinucleate fibres with light and dark bands.",["Actin and myosin filaments lie in repeating bands.","A nerve signal makes the filaments slide, shortening the fibre.","The muscle relaxes when the signal stops."],"Voluntary; attached to bones."],
["Smooth Muscle","Smooth (unstriated) muscle has spindle-shaped cells with one central nucleus.",["Nerve or hormone signals trigger slow contraction.","Waves of contraction move contents along tubes (peristalsis).","They tire slowly."],"Involuntary; found in food pipe, stomach, blood vessels, bladder and iris."],
["Cardiac Muscle","Cardiac muscle forms the wall of the heart.",["The pacemaker starts each impulse.","Intercalated discs pass the signal quickly from cell to cell.","The heart contracts rhythmically without rest."],"Involuntary, striated, branched, with one nucleus per cell."],
["Neuron (Nerve Cell)","A neuron is the structural and functional unit of the nervous system.",["Dendrites receive the stimulus.","The impulse passes through the cell body and along the axon, faster over myelin.","The terminals release a chemical (neurotransmitter) to the next neuron."],"Long cells; they can be up to a metre in length."],
["Epithelial Tissue","Epithelial tissue forms the covering and lining of body surfaces.",["Cells form a continuous sheet on a basement membrane.","Squamous: diffusion. Cuboidal: secretion and absorption. Columnar: absorption (intestine).","Ciliated cells sweep mucus (windpipe)."],"Protects, absorbs and secretes; very little matrix."],
["Areolar Connective Tissue","Areolar tissue is a loose connective tissue that fills spaces inside organs.",["Collagen and elastic fibres lie in a jelly-like matrix.","Fibroblasts make fibres, macrophages engulf germs, mast cells release histamine.","It supports organs and helps repair tissue."],"Found around organs, blood vessels and nerves, and under the skin."],
["Adipose Tissue","Adipose tissue is a connective tissue that stores fat.",["Cells store fat as large droplets.","Fat is an energy reserve when food is short.","It insulates and cushions organs."],"Found below the skin and around the kidneys."],
["Blood Cells","Blood is a fluid connective tissue made of plasma and cells.",["RBCs carry O₂ using haemoglobin.","WBCs fight germs.","Platelets help blood to clot; plasma carries food, CO₂ and hormones."],"Mature RBCs have no nucleus (in mammals)."],
["Bone and Cartilage","Bone and cartilage are skeletal connective tissues.",["Bone: hard matrix of calcium and phosphorus with osteocytes around Haversian canals.","Cartilage: flexible matrix with chondrocytes; no blood vessels.","Cartilage is found in the nose, ear, trachea and joints."],"Bone supports and protects; cartilage smooths joints and adds flexibility."],
["Crop Production and Management","Crop production management is a set of steps that give a good yield with minimum loss.",["Choose high-yielding, disease-resistant seeds and prepare loose soil.","Sow at the right depth; add manure or fertiliser and irrigate.","Weed, protect from pests, then harvest and store safely."],"Kharif crops: June to October (rice, maize). Rabi crops: November to April (wheat, gram)."],
["Manure and Fertilizer Application","Manure and fertiliser add nutrients to the soil.",["Manure (compost, vermicompost, green manure) comes from animal and plant waste.","Fertilisers (urea, DAP, NPK) are factory-made and give N, P, K quickly.","Use the right amount, otherwise soil and water are harmed."],"Manure improves humus and soil structure; fertiliser raises yield fast."],
["Irrigation Methods","Irrigation supplies water to crops at the right time.",["Wells, canals, rivers and tanks supply water.","Dug wells use buckets and pulleys; tube wells use pumps.","Canals bring water from dams and rivers to far fields."],"Traditional methods: moat, chain pump, dhekli, rahat."],
["Sprinkler Irrigation","Sprinklers spray water over the crop like rain.",["Pipes with rotating nozzles are laid on the field.","A pump pushes water through the pipes.","The nozzles spray water onto the leaves and soil."],"Suits uneven land and sandy soil; saves water."],
["Drip Irrigation","Drip irrigation delivers water drop by drop to the roots.",["Water flows from the tank through a filter into the pipes.","Emitters release drops at each plant.","Only the root zone gets wet, so little water evaporates."],"Best for orchards and vegetables; the most water-saving method."],
["Crop Rotation","Crop rotation is growing different crops one after another in the same field.",["A different crop is chosen each season.","Legumes restore nitrogen in the soil.","Pest and disease cycles break; less fertiliser is needed."],"Example: wheat, then gram, then rice."],
["Intercropping","Intercropping is growing two or more crops together in a definite row pattern.",["Crops are chosen with different nutrient needs and maturity times.","Seeds are sown in alternating row patterns.","Pests of one crop spread less; yield per area rises."],"Examples: soybean + maize, finger millet + cowpea."],
["Mixed Cropping","Mixed cropping is growing two or more crops together with no fixed pattern.",["Seeds of different crops are mixed and sown together.","If one crop fails, another still gives a harvest.","This reduces the risk of total loss."],"Examples: wheat + gram, wheat + mustard, groundnut + sunflower."],
["Poultry Farming","Poultry farming raises fowl for eggs (layers) and meat (broilers).",["Chicks are kept warm under a brooder lamp.","Housing is clean, dry and ventilated; birds are vaccinated.","Balanced feed is given; eggs are collected and broilers sold."],"Broilers grow fast for meat; layers need good feed with vitamins A and K."],
["Fish Farming","Fish farming raises fish in ponds for food.",["The pond is filled and fingerlings are stocked.","Composite culture: catla (top), rohu (middle), mrigal and common carp (bottom), grass carp (weeds).","Fish are fed and harvested when grown."],"Fingerlings come from hormone-induced breeding. Species do not compete for food."],
["Bee-Keeping (Apiculture)","Apiculture is the rearing of honeybees for honey and wax.",["Workers collect nectar from flowers.","They store it as honey in wax combs.","The beekeeper takes honey frames from the super; the brood stays."],"Needs good flowering pasture. Bees also pollinate crops. Common species: Apis mellifera."],
["Cattle Farming","Cattle farming raises animals for milk (milch) and farm work (draught).",["Milch cows give milk; bullocks do ploughing and carting.","Breeds: Jersey and Brown Swiss (exotic), Sahiwal and Red Sindhi (indigenous).","Provide a clean shed, roughage plus concentrate, and vaccination."],"The milk-producing period after calving is the lactation period."]
];

for(let k=1;k<=g[1];k++,idx++){const n=N[idx],id=g[2]+k;
nv.insertAdjacentHTML('beforeend',`<a href="#${id}">${k}</a>`);
m.insertAdjacentHTML('beforeend',`<article id="${id}"><h2>${g[2].toUpperCase()}${k}. ${n[0]}</h2><figure style="margin:0">${D[idx]}</figure><div><p>${n[1]}</p><h4>How it works</h4><ol>${n[2].map(s=>`<li>${s}</li>`).join('')}</ol><p class="k">${n[3]}</p></div></article>`)}});
