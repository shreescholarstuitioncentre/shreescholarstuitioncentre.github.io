["Arrangement of Particles in Solid","In a solid, strong forces of attraction hold the particles in a regular, closely packed arrangement.",["Strong attraction fixes every particle at one position.","Particles cannot move from place to place, they only vibrate.","On heating, the vibrations grow until the solid melts."],"Definite shape and volume, negligible compressibility, high density."],
["Arrangement of Particles in Liquid","Liquid particles are close together but the forces are weaker than in a solid, so they are free to move.",["Particles slip and slide over one another.","Because they stay close, volume is fixed.","Particles flow into the shape of the container."],"Definite volume, no fixed shape, flows, very slightly compressible."],
