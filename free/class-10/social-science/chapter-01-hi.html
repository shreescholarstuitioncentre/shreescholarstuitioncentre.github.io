<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#55627a;--line:#d9e0ec;--hl:#ffd60a;--pk:#d6336c;--gr:#1f8a5b;--bl:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16213a;--ink:#eef2fb;--mut:#9fb0cf;--line:#2a3a5c;--pk:#ff6b9b;--gr:#4cd39a;--bl:#7aa5ff}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16213a;--ink:#eef2fb;--mut:#9fb0cf;--line:#2a3a5c;--pk:#ff6b9b;--gr:#4cd39a;--bl:#7aa5ff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif}
header{padding:48px 20px 28px;max-width:1000px;margin:auto}
h1{font-size:clamp(32px,6.5vw,58px);line-height:1.25;margin:0 0 10px;font-weight:800}
h1 span{background:linear-gradient(var(--hl),var(--hl)) 0 90%/0 .34em no-repeat;animation:mark 1.2s .3s forwards}
@keyframes mark{to{background-size:100% .34em}}
header p{color:var(--mut);margin:0;max-width:60ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:10px 16px;display:flex;gap:8px;align-items:center}
nav a{color:var(--ink);text-decoration:none;font-size:14px;padding:3px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
nav a:hover,nav a:focus-visible{background:var(--hl);color:#14213d;outline:none}
nav button{margin-left:auto;font:inherit;font-size:14px;padding:3px 12px;border-radius:99px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
main{max-width:1000px;margin:auto;padding:0 16px 80px}
.grp{font-size:clamp(22px,4vw,30px);font-weight:800;margin:56px 0 4px;padding-left:14px;border-left:8px solid var(--pk)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin:18px 0}
h2{margin:0 0 10px;font-size:20px;font-weight:600}
.q{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 0;border-top:1px dashed var(--line)}
.q b{font-weight:600}.q i{font-style:normal;color:var(--gr);font-weight:600;transition:filter .3s,opacity .3s}
.hide .q i{filter:blur(7px);opacity:.5;cursor:pointer}.hide .q i.on{filter:none;opacity:1}
h3{font-size:16px;margin:18px 0 8px;color:var(--pk)}
.tl{position:relative;margin:4px 0 14px 8px;padding-left:22px;border-left:3px solid var(--line)}
.tl:before{content:"";position:absolute;left:-3px;top:0;width:3px;height:var(--p,0%);background:var(--pk);transition:height 1.6s ease-out}
.tl.go:before{--p:100%}
.ev{position:relative;padding:5px 0 9px;opacity:0;transform:translateX(-14px);transition:.5s}
.go .ev{opacity:1;transform:none;transition-delay:calc(var(--i)*90ms)}
.ev:before{content:"";position:absolute;left:-30px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--hl);border:3px solid var(--pk)}
.ev strong{color:var(--bl);margin-right:8px;font-weight:800}
.dia{margin:14px 0;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.dia svg{width:100%;height:auto;display:block}.dia svg text{fill:var(--ink);font-family:inherit}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{50%{transform:scale(1.06)}}
.cap{font-size:14px;color:var(--mut);margin:4px 4px 2px}
footer{text-align:center;color:var(--mut);font-size:14px;padding:0 0 40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ev{opacity:1;transform:none}h1 span{background-size:100% .34em}}
@media(min-width:700px){.q{grid-template-columns:1.6fr 1fr;gap:20px}}
