 easy, personal loans but <b>high interest</b>; use hundi."], ["Economics", "Adam Smith – wealth; Marshall – <b>welfare</b>; Robbins – <b>scarcity</b> and choice."], ["Scope", "<b>Consumption, production, exchange, distribution</b>."]], "q": [["Marshall's view?", "Economics is about welfare."], ["Four parts of economics?", "Consumption, production, exchange, distribution."]]}, {"s": "Factors of Production", "t": "Factors of Production and Consumer's Surplus", "k": [["Factors", "<b>Land</b> → rent, <b>Labour</b> → wages, <b>Capital</b> → interest, <b>Organisation</b>, <b>Enterprise</b> → profit."], ["Features", "Land: gift of nature, fixed supply. Capital: man-made. Entrepreneur bears <b>risk</b>."], ["Consumer's Surplus", "Marshall: <b>what one is ready to pay − what one actually pays</b>; based on diminishing utility."]], "q": [["Reward of labour?", "Wages."], ["Consumer's surplus formula?", "Willing price − actual price."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
