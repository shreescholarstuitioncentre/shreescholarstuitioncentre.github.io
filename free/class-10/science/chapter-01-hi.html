<style>
:root{--bg:#f7f5ee;--card:#fff;--ink:#16213a;--mut:#56607a;--line:#d9d5c6;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2340;--ink:#eef0f7;--mut:#a4adc7;--line:#2c3760;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2340;--ink:#eef0f7;--mut:#a4adc7;--line:#2c3760;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Devanagari",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Sans Devanagari","Trebuchet MS",sans-serif;margin:0;line-height:1.35}
header{padding:36px 18px 18px;max-width:1100px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800}
h1 span{color:var(--c)}
header p{color:var(--mut);margin:.6em 0 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:99px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:18px}
h2{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;color:var(--c);margin-bottom:14px}
.grid{columns:300px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.card h3{font-size:1.05rem;margin-bottom:6px}
.card p{margin:.35em 0}.card ul{margin:.3em 0;padding-left:1.1em}
.card em{color:var(--mut)}
.eq{font-family:"Trebuchet MS",sans-serif;background:color-mix(in srgb,var(--c) 10%,transparent);padding:4px 8px;border-radius:6px;display:block;margin:.4em 0;overflow-x:auto}
svg{width:100%;height:auto;display:block;margin-top:8px;background:color-mix(in srgb,var(--c) 7%,transparent);border-radius:8px}
svg text{fill:var(--ink);font:10.5px "Noto Sans Devanagari",sans-serif}
.s{stroke:var(--ink);fill:none;stroke-width:1.6}
.f{stroke:var(--c);fill:none;stroke-width:2.4;stroke-dasharray:7 6;animation:d 1s linear infinite}
.r{animation-direction:reverse}
@keyframes d{to{stroke-dashoffset:-13}}
.p{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
footer{text-align:center;color:var(--mut);padding:20px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){.f,.p{animation:none}}

var C=[
{n:'रासायनिक अभिक्रियाएँ और समीकरण',c:'#e0452f',k:[
['संतुलित रासायनिक समीकरण','वे अभिक्रियाएँ जिनमें अभिकारकों और उत्पादों दोनों ओर प्रत्येक तत्व के परमाणुओं की कुल संख्या बराबर हो, संतुलित रासायनिक समीकरण कहलाती हैं।'],
['1. संयोजन अभिक्रिया','दो या अधिक अभिकारक मिलकर एकल उत्पाद बनाते हैं।<span class="eq">A + B → AB</span>कोयले का जलना:<span class="eq">C(s) + O₂(g) → CO₂(g)</span><em>कार्बन + ऑक्सीजन → कार्बन डाइऑक्साइड</em>'],
['2. अपघटन अभिक्रिया','एकल अभिकारक टूटकर दो या अधिक सरल उत्पाद बनाता है।<span class="eq">AB → A + B</span><b>ऊष्मीय अपघटन:</b> इसमें अपघटन के लिए ऊष्मा का उपयोग होता है। जिंक कार्बोनेट को गर्म करना इसका उदाहरण है।<span class="eq">ZnCO₃(s) –ऊष्मा→ ZnO(s) + CO₂(g)</span>'],
['3. ऊष्माक्षेपी अभिक्रिया','वे अभिक्रियाएँ जिनमें ऊष्मा निकलती है।<span class="eq">C₆H₁₂O₆(aq) + 6O₂(aq) → 6CO₂(aq) + 6H₂O(l) + ऊर्जा</span><b>ऊष्माशोषी अभिक्रिया:</b> जिनमें ऊष्मा का अवशोषण होता है, जैसे प्रकाश-संश्लेषण।<span class="eq">6CO₂(aq) + 12H₂O(l) –सूर्य का प्रकाश/क्लोरोफिल→ C₆H₁₂O₆ + 6O₂ + 6H₂O</span>','exo'],
['4. विस्थापन अभिक्रिया','एक तत्व दूसरे तत्व को उसके यौगिक से विस्थापित कर देता है।<span class="eq">A–B + C → A–C + B</span>'],
['5. द्विविस्थापन अभिक्रिया','<span class="eq">AB + CD → AD + CB</span>उदा. <span class="eq">Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl</span><em>सोडियम सल्फेट + बेरियम क्लोराइड → बेरियम सल्फेट + सोडियम क्लोराइड</em>']]},
{n:'अम्ल, क्षारक और लवण',c:'#8a3fc4',k:[
['अम्ल','खट्टे स्वाद वाले पदार्थ जो नीले लिटमस को लाल करते हैं। जल में H⁺ आयन देते हैं।'],
['क्षारक','कड़वे स्वाद वाले पदार्थ जो लाल लिटमस को नीला करते हैं। जलीय विलयन में OH⁻ आयन देते हैं।'],
['लवण','अम्ल और क्षारक की उदासीनीकरण अभिक्रिया के उत्पाद।'],
['अम्ल और क्षारक के सामान्य गुण','<ul><li>जल की उपस्थिति में सभी अम्ल H⁺ और सभी क्षारक OH⁻ आयन देते हैं।</li><li>दोनों अपने जलीय विलयन में विद्युत चालन करते हैं।</li></ul>'],
['क्रिस्टलन जल','कुछ लवणों के शुष्क अवस्था में भी जल के निश्चित अणु जुड़े रहते हैं। इन्हें क्रिस्टलन जल कहते हैं और ऐसे लवण जलयोजित लवण हैं, जैसे धावन सोडा (Na₂CO₃·10H₂O), नीला थोथा (CuSO₄·5H₂O)।'],
['pH पैमाना','हाइड्रोजन आयन सांद्रता मापने का पैमाना, मान 0 (अति अम्लीय) से 14 (अति क्षारीय) तक।<b>दैनिक जीवन में pH का महत्त्व</b><ul><li>पौधे और जंतु pH के प्रति संवेदनशील हैं; पौधों की वृद्धि मिट्टी की प्रकृति पर निर्भर है।</li><li>पाचन में pH महत्त्वपूर्ण है; आमाशय HCl बनाता है।</li><li>मुँह का pH 5.5 से कम होने पर दाँतों का इनेमल गलने लगता है।</li><li>सांद्र अम्ल और क्षारक के पात्रों पर चेतावनी चिह्न उनकी संक्षारक प्रकृति दर्शाता है।</li></ul>'],
['अम्ल या क्षारक का तनुकरण','अम्ल या क्षारक को जल में मिलाना तनुकरण है; यह अभिक्रिया अत्यंत ऊष्माक्षेपी है। जलीय विलयन आयनों में वियोजित होकर आवेश का चालन करते हैं, इसलिए दोनों विद्युत चालक हैं।'],
['सूचक','ऐसे पदार्थ जो अम्लीय या क्षारीय विलयन में मिलाने पर अपना रंग या गंध बदल लेते हैं।']]},
{n:'धातु और अधातु',c:'#d98a0b',k:[
['धातु','विद्युत धनात्मक; इलेक्ट्रॉन त्यागकर धनायन बनाने की प्रवृत्ति, जैसे Cu, Fe, Au, Na।<br><b>अभिक्रियाशीलता श्रेणी</b> (घटते क्रम में):<span class="eq">K &gt; Na &gt; Ca &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Pb &gt; H &gt; Cu &gt; Hg &gt; Ag &gt; Au</span>'],
['अधातु','विद्युत ऋणात्मक; इलेक्ट्रॉन ग्रहण कर ऋणायन बनाने की प्रवृत्ति, जैसे आयोडीन (I₂), सल्फर (S), हाइड्रोजन (H₂)।'],
['रासायनिक गुण','<ul><li><b>ऑक्सीजन से अभिक्रिया:</b> अधातु ऑक्साइड प्रायः अम्लीय (P₂O₅, SO₂, CO₂) या उदासीन (CO, H₂O) होते हैं।</li><li>अम्लीय ऑक्साइड + जल → अम्ल: <span class="eq">CO₂ + H₂O → H₂CO₃ (कार्बोनिक अम्ल)</span></li><li>अधातुएँ अम्लों से H₂ विस्थापित नहीं करतीं, क्योंकि वे इलेक्ट्रॉन ग्राही हैं और हाइड्रोजन को इलेक्ट्रॉन नहीं दे सकतीं।</li></ul>'],
['मिश्रातु','दो या अधिक धातुओं, या धातु और अधातु का समांगी मिश्रण। पारे (Hg) के साथ बना मिश्रातु अमलगम कहलाता है।'],
['धातु निष्कर्षण','<b>धातुकर्म:</b> अयस्कों से धातुओं का निष्कर्षण।<br><b>खनिज:</b> भू-पर्पटी में प्राकृतिक रूप से मिलने वाले तत्व या यौगिक।<br><b>अयस्क और गैंग:</b> जिन खनिजों से धातु लाभप्रद रूप से निकाली जाती है वे अयस्क हैं; उनके साथ की अशुद्धियाँ गैंग हैं।'],
['अम्लराज','सांद्र HCl और सांद्र HNO₃ का 3:1 अनुपात में मिश्रण। सोना और प्लैटिनम इसमें घुल जाते हैं।'],
['यशदलेपन (गैल्वनीकरण)','लोहे और इस्पात की वस्तुओं पर जिंक की पतली परत चढ़ाना।'],
['आयनिक (विद्युत संयोजी) बंध','धातु परमाणु से अधातु परमाणु में इलेक्ट्रॉन के पूर्ण स्थानांतरण से बना बंध।']]},
{n:'कार्बन और उसके यौगिक',c:'#2a7d4f',k:[
['ईंधन और ज्वाला','ईंधन जलने पर ऊष्मा और प्रकाश देते हैं; जीवाश्म से मिलने वाले जीवाश्म ईंधन हैं, जैसे कोयला, पेट्रोलियम। ज्वाला वह क्षेत्र है जहाँ गैसों का दहन होता है।<ul><li><b>नीली (अदीप्त):</b> ऑक्सीजन पर्याप्त या अधिक होने पर।</li><li><b>पीली (दीप्त):</b> इसका रंग अजले कार्बन कणों के कारण है।</li></ul>'],
['अपरूप','<b>हीरा:</b> सबसे कठोर त्रिविमीय जालक, अचालक; बहुमूल्य रत्न और अपघर्षक में उपयोग।<br><b>ग्रेफाइट:</b> अपारदर्शी, षट्कोणीय परतें, विद्युत का सुचालक; पेंसिल लेड और इलेक्ट्रोड में उपयोग।<br><b>फुलरीन:</b> पहला ज्ञात C-60 है, कार्बन परमाणु फुटबॉल के आकार में।'],
['सहसंयोजी यौगिक','सहसंयोजी बंध वाले यौगिक; निम्न गलनांक और क्वथनांक; प्रायः विद्युत के कुचालक।'],
['हाइड्रोकार्बन','केवल कार्बन और हाइड्रोजन के यौगिक।<br><b>संतृप्त:</b> कार्बन परमाणुओं के बीच केवल एकल बंध; सामान्य सूत्र CₙH₂ₙ₊₂।<br><b>असंतृप्त:</b> कार्बन परमाणुओं के बीच कम से कम एक बहुबंध।'],
['दहन','वह अभिक्रिया जिसमें कार्बनिक यौगिकों के जलने से CO₂ और H₂O बनते हैं। संतृप्त हाइड्रोकार्बन पूर्ण दहन के कारण नीली ज्वाला से जलते हैं।'],
['साबुन','<ul><li>लंबी शृंखला वाले वसा अम्लों के सोडियम या पोटैशियम लवण (RCOONa), R = C₁₅H₃₁, C₁₇H₃₅।</li><li>वसा और तेलों के क्षारीय जल-अपघटन (साबुनीकरण) से बनते हैं।</li><li>मिसेल बनाकर मैल और तेल हटाते हैं।</li><li>कठोर जल के साथ झाग नहीं, स्कम बनाते हैं।</li></ul>'],
['अपमार्जक (डिटर्जेंट)','<ul><li>लंबी शृंखला वाले कार्बोक्सिलिक अम्ल के अमोनियम या सल्फोनेट लवण।</li><li>कठोर जल में स्कम नहीं बनाते।</li><li>इन्हें साबुन-रहित साबुन भी कहते हैं।</li></ul>'],
['कार्बन की बहुमुखी प्रकृति','<b>शृंखलन:</b> सीधी शृंखला या वलय में स्वयं जुड़ने की प्रवृत्ति।<br><b>चतुःसंयोजकता:</b> संयोजकता चार, अतः चार अन्य परमाणुओं से बंध बनाता है।<br><b>बहुबंध:</b> C या O, N, S जैसे परमाणुओं से एक से अधिक इलेक्ट्रॉन युग्म साझा करता है।']]},
{n:'जैव प्रक्रम',c:'#1b8a8a',k:[
['पोषण','वह प्रक्रम जिसमें जीव भोजन से पोषक तत्व लेकर उनसे ऊर्जा प्राप्त करता है, ताकि जीवित संरचनाएँ बनी रहें और जीवन के मूल कार्य हों।'],
['मानव पाचन तंत्र','पाचन एक अपचयी प्रक्रम है। आहारनाल एक लंबी नली (7-8 मी) है जहाँ पाचन पूरा होता है; लार ग्रंथि, यकृत, अग्न्याशय जैसी पाचक ग्रंथियाँ सहायता करती हैं।','dig'],
['श्वसन','भोजन का ऑक्सीकरण कर ऊर्जा मुक्त की जाती है; शरीर के बाहर से O₂ आवश्यक है।<br><b>वायवीय:</b> ऑक्सीजन की उपस्थिति में, अधिक ऊर्जा मुक्त।<br><b>अवायवीय:</b> ऑक्सीजन की अनुपस्थिति में, कम ऊर्जा मुक्त।'],
['मानव में परिवहन','परिवहन तंत्र में रुधिर नामक तरल है जिसे हृदय रक्त वाहिकाओं में पंप करता है। रुधिर पोषक तत्व, लवण, ऑक्सीजन… ले जाता है।'],
['पादपों में परिवहन','जल और खनिज जड़ से पत्तियों तक, तथा संचित भोजन पत्तियों से अन्य भागों तक दो संवहन ऊतकों, जाइलम और फ्लोएम, से जाता है।'],
['मानव में उत्सर्जन','नाइट्रोजनी अपशिष्ट, जैसे यूरिया, वृक्क द्वारा मूत्र के रूप में बाहर निकलते हैं।'],
['पादपों में उत्सर्जन','पादप विभिन्न अपशिष्ट उत्सर्जित करते हैं, जैसे रेजिन।'],
['कृत्रिम वृक्क','वृक्क विफल होने पर अपोहन द्वारा रुधिर से नाइट्रोजनी अपशिष्ट हटाने वाली युक्ति।']]},
{n:'नियंत्रण एवं समन्वय',c:'#c2327a',k:[
['समन्वय','जीव के विभिन्न अंगों का व्यवस्थित, नियंत्रित और दक्ष ढंग से मिलकर उद्दीपनों के प्रति अनुक्रिया करना। मनुष्य में तंत्रिका तंत्र और हॉर्मोन; पादपों में विद्युत-रासायनिक साधन, और कोशिकाएँ जल की मात्रा बदलकर आकार बदलती हैं।'],
['तंत्रिका तंत्र','न्यूरॉन, तंत्रिकाओं और तंत्रिका अंगों का तंत्र जो अंगों की क्रियाओं को जोड़ता, समन्वित और नियंत्रित करता है।<br><b>न्यूरॉन:</b> संरचनात्मक और क्रियात्मक इकाई; तंत्रिका में कोशिका काय, ऐक्सॉन, डेंड्राइट और तंत्रिका अंत होते हैं।'],
['मस्तिष्क','<b>अग्रमस्तिष्क:</b> मुख्य सोचने वाला भाग; सुनना, देखना, सूँघना, भूख नियंत्रित करता है (प्रमस्तिष्क)।<br><b>मध्यमस्तिष्क:</b> अनैच्छिक क्रियाएँ नियंत्रित करता है।<br><b>पश्चमस्तिष्क:</b> पोन्स, मेडुला, अनुमस्तिष्क; शरीर की स्थिति और संतुलन बनाए रखता है। साथ ही हाइपोथैलेमस, पीयूष ग्रंथि, मेरुरज्जु।'],
['अनुवर्तन गति','उद्दीपन की ओर या उससे दूर गति: प्रकाशानुवर्तन, गुरुत्वानुवर्तन, जलानुवर्तन, रसायनानुवर्तन।'],
['अनुकुंचन (नास्टिक) गति','उद्दीपन की दिशा से स्वतंत्र गति: प्रकाशानुकुंचन, स्पर्शानुकुंचन, तापानुकुंचन, निशानुकुंचन।'],
['जंतु हॉर्मोन','जीव में सूचना पहुँचाते हैं; अंतःस्रावी ग्रंथियों से स्रावित; रासायनिक संदेशवाहक भी कहलाते हैं।'],
['पादप हॉर्मोन','पादपों में प्राकृतिक रूप से बनने वाले रासायनिक पदार्थ जो वृद्धि, विकास और अनुक्रियाओं का नियमन करते हैं: ऑक्सिन, जिबरेलिन, साइटोकाइनिन, एब्सिसिक अम्ल।']]},
{n:'जीव जनन कैसे करते हैं?',c:'#e07a1f',k:[
['पुष्पी पादपों में','<b>पुंकेसर</b> (नर, परागकण बनाता है): परागकोश, तंतु। <b>स्त्रीकेसर</b> (मादा, अंड बनाता है): वर्तिकाग्र, वर्तिका, अंडाशय, बीजांड। साथ ही पंखुड़ी, बाह्यदल, पुष्पासन, वृंत।'],
['अलैंगिक जनन','युग्मकों के बनने और संलयन के बिना, एकल जनक से संतान की उत्पत्ति।'],
['विखंडन','एककोशिकीय जीव का दो या अधिक संतति कोशिकाओं में बँटना।<ul><li><b>द्विखंडन:</b> <em>अमीबा, यूग्लीना</em></li><li><b>बहुखंडन:</b> <em>प्लाज़्मोडियम</em></li></ul>'],
['खंडन','बहुकोशिकीय जीव छोटे टुकड़ों में टूट जाता है और प्रत्येक टुकड़ा नया जीव बन जाता है, जैसे <em>स्पाइरोगायरा</em>।'],
['लैंगिक जनन','युग्मकों के बनने और संलयन से नए जीव का विकास, जैसे मनुष्य, कुत्ते, बिल्ली, मेंढक।'],
['रजोधर्म','चक्र यौवनारंभ (11-13 वर्ष) से शुरू होता है; पहला <b>रजोदर्शन</b> कहलाता है। स्थायी रूप से रुक जाना <b>रजोनिवृत्ति</b> है, जो 45-50 वर्ष में होती है।'],
['जनन तंत्र','<b>नर:</b> वृषण, वृषणकोश, शुक्रवाहिका, शुक्राशय, प्रोस्टेट ग्रंथि, मूत्रमार्ग, शिश्न।<br><b>मादा:</b> अंडाशय, अंडवाहिनी (कीप), गर्भाशय, ग्रीवा, योनि।'],
['जन्म नियंत्रण','रोध, हॉर्मोनल, रासायनिक और शल्य विधियाँ।<ul><li><b>रोध:</b> कंडोम, डायाफ्राम; गर्भाशय में लगने वाली युक्ति (IUD)</li><li><b>हॉर्मोनल:</b> मुख से ली जाने वाली गर्भनिरोधक गोलियाँ</li><li><b>रासायनिक:</b> शुक्राणुनाशी</li><li><b>शल्य:</b> पुरुष नसबंदी, ट्यूबेक्टॉमी</li></ul>'],
['यौन संचारित रोग','संक्रमित व्यक्ति से यौन संपर्क द्वारा फैलते हैं, जैसे AIDS, सिफलिस।<ul><li><b>गोनोरिया:</b> <em>नाइसेरिया गोनोरिया</em></li><li><b>सिफलिस:</b> <em>ट्रेपोनिमा पैलिडम</em></li><li><b>AIDS-HIV:</b> ह्यूमन इम्यूनोडेफिशिएंसी वायरस</li></ul>']]},
{n:'आनुवंशिकता',c:'#3a57c4',k:[
['लक्षण','किसी जीव की विशेषताएँ (समानताएँ या भिन्नताएँ)।<br><b>अर्जित:</b> अनुवांशिक नहीं, वंशागत नहीं, जैसे भाषा, बुद्धि।<br><b>वंशागत:</b> अनुवांशिक, वंशानुगत, जैसे ऊँचाई, त्वचा और आँखों का रंग।'],
['विविधता','जनन के दौरान किसी जाति के जीवों में लक्षणों का अंतर।<br><b>पर्यावरणीय:</b> आहार, रसायन, विकिरण, प्रदूषण।<br><b>आनुवंशिक:</b> उत्परिवर्तन, अर्धसूत्री विभाजन और लैंगिक जनन से उत्पन्न।'],
['मेंडलवाद','कारक (अब जीन) लक्षणों के वाहक हैं।<ul><li>प्रभाविता का नियम</li><li>पृथक्करण का नियम</li><li>स्वतंत्र अपव्यूहन का नियम</li></ul>'],
['उत्परिवर्तन','जीन या गुणसूत्र में अचानक होने वाला वंशानुगत परिवर्तन।'],
['अर्धसूत्री विभाजन','न्यूनीकरण विभाजन, जो युग्मक निर्माण के लिए आवश्यक है।'],
['लैंगिक जनन','दो युग्मकों का संलयन, जो संतानों में विविधता का कारण है।'],
['लिंग निर्धारण','वह क्रियाविधि जिससे नवजात का लिंग तय होता है; लिंग कुछ लक्षणों की वंशागति को भी प्रभावित करता है। मनुष्य में यह पिता के लिंग गुणसूत्र (X या Y) से तय होता है।<span class="eq">पिता X या Y + माता X → XX = मादा, XY = नर</span>']]},
{n:'मानव नेत्र तथा रंगबिरंगा संसार',c:'#0f8fbf',k:[
['प्रिज़्म से अपवर्तन','काँच में विभिन्न रंग भिन्न चाल से चलते हैं। आपतित किरण और निर्गत किरण के बीच का कोण <b>विचलन कोण</b> है।<br>PQ आपतित किरण, QM अपवर्तित किरण, MR निर्गत किरण; ∠A प्रिज़्म कोण, ∠i आपतन कोण, ∠r अपवर्तन कोण, ∠e निर्गत कोण, ∠D विचलन कोण।'],
['प्रकाश का विक्षेपण','<ul><li>श्वेत प्रकाश का अपने संघटक रंगों में बँट जाना।</li><li>लाल रंग सबसे कम और बैंगनी सबसे अधिक विचलित होता है।</li><li>इंद्रधनुष का बनना।</li></ul>','prism'],
['निकट-दृष्टि दोष (मायोपिया)','पास की वस्तुएँ स्पष्ट दिखती हैं, दूर की नहीं।<br><b>कारण:</b> नेत्र लेंस की अत्यधिक वक्रता; नेत्र गोलक का लंबा होना।<br><b>उपचार:</b> अवतल लेंस।'],
['दूर-दृष्टि दोष (हाइपरमेट्रोपिया)','दूर की वस्तुएँ स्पष्ट दिखती हैं, पास की नहीं।<br><b>कारण:</b> नेत्र लेंस की फोकस दूरी अधिक हो जाती है।<br><b>उपचार:</b> उत्तल लेंस।'],
['जरा-दूरदृष्टिता (प्रेसबायोपिया)','निकट और दूर दोनों दोष, समंजन क्षमता घटने के कारण।<br><b>कारण:</b> पक्ष्माभी पेशियों की दुर्बलता; लचीलेपन में कमी।<br><b>उपचार:</b> द्विफोकसी लेंस।'],
['वायुमंडलीय अपवर्तन','पृथ्वी के वायुमंडल से गुजरते प्रकाश का मुड़ना: तारों का टिमटिमाना, ग्रह नहीं टिमटिमाते, सूर्योदय जल्दी और सूर्यास्त देर से।'],
['प्रकाश का प्रकीर्णन','निलंबित कणों पर पड़ने पर प्रकाश का सभी दिशाओं में बिखर जाना: टिंडल प्रभाव, आकाश का नीला दिखना।'],
