<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#fffbea;--card:#fff;--ink:#2b2b3a;--ink2:#1b3a8a;--ac:#e8590c;--ac2:#1c7ed6;--ln:#f2d98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b26;--card:#26263a;--ink:#f1efe6;--ink2:#8ec5ff;--ln:#4a4a66}}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.7 Kalam,"Segoe UI",cursive;background-image:repeating-linear-gradient(transparent 0 33px,var(--ln) 33px 34px)}
header{text-align:center;padding:28px 14px;background:linear-gradient(135deg,var(--ac),#f59f00);color:#fff}h1{margin:0;font-size:1.5em}
main{max-width:880px;margin:auto;padding:12px}section{background:var(--card);border:2px dashed var(--ac2);border-radius:16px;padding:14px 18px;margin:18px 0;animation:up .6s both}
h2{color:var(--ac);margin:0 0 8px}@keyframes up{from{opacity:0;transform:translateY(20px)}}svg{width:100%}
.g{fill:#dee2e6;animation:gl 7s infinite}@keyframes gl{0%,18%,100%{fill:#dee2e6}8%{fill:#ffd43b}}svg text{fill:#222}
.fl{display:flex;flex-wrap:wrap;gap:8px}.st,.ch{flex:1;min-width:120px;background:var(--ac2);color:#fff;border-radius:12px;padding:6px 10px;text-align:center;animation:pop 2s infinite alternate}.ch{flex:none;min-width:0;background:var(--ac)}@keyframes pop{to{transform:translateY(-5px)}}
.cd{border:2px solid var(--ln);border-radius:12px;padding:6px 12px;margin:8px 0}.cd b{color:var(--ac)}
.lt{display:grid;grid-template-columns:minmax(80px,28%) 1fr;gap:2px 10px;margin:8px 0}.lb{color:#e03131;font-size:.8em;text-align:right}.tx{color:var(--ink2)}
.pp{color:var(--ink2);padding:4px 10px}.pp h4{text-align:center;margin:4px}summary{cursor:pointer;color:var(--ac2);font-weight:700;margin:4px 0}table{border-collapse:collapse;width:100%}td{border:1px solid var(--ln);padding:4px 8px}.q{border-left:4px solid var(--ac);padding-left:10px;margin:4px 0}</style></head><body>
<header><h1>✍️ Composition: Letter, Application, Paragraph, Report & Article</h1><div>Class 10 · UP Board · English Notes</div></header><main id="m"></main><script>
const D={"lang": "en", "title": "Composition: Letter, Application, Paragraph, Report & Article", "sub": "Class 10 · UP Board · English Notes", "h": ["Most Repeated Board Topics", "Diagram: Parts of a Letter / Application", "Format Cards", "Flow Diagrams", "Useful Phrases", "Complete Solved Examples (102)", "Practice Questions (205)"], "lb": ["Sender’s address", "Date", "Receiver’s address", "Subject", "Salutation", "Body of the letter", "Complimentary close", "Name & Signature"], "fn": ["Application", "Formal Letter", "Informal Letter", "Descriptive Paragraph", "Report", "Article"], "fc": [[["Date, receiver (Principal)", "One-line subject", "Salutation: Sir/Madam", "Body: With due respect… + request", "Yours obediently + name"], "Formal tone, 80–100 words, no slang."], [["Sender’s address and date", "Receiver (Editor/Officer)", "Subject", "Sir/Madam", "Problem → effect → request", "Yours faithfully + name"], "Use ‘Through the columns of your esteemed daily…’ for the Editor."], [["Sender’s address and date (no receiver)", "Dear + name", "Opening: I hope this finds you well", "Main news in short paragraphs", "Yours affectionately"], "Friendly, simple, personal tone."], [["Title", "Introduce the person/place", "Appearance / location", "Qualities / features", "Closing line"], "Short sentences; simple present or past; avoid personal opinions."], [["Heading", "By XYZ", "Opening: what, when, where", "Events in order", "Outcome"], "Past tense, third person, passive voice."], [["Title", "By XYZ", "Introduction", "Body (2 paragraphs)", "Conclusion / appeal"], "Present tense, third person; end with advice."]], "fl": ["Heading", "Byline (by XYZ)", "Introduction", "Body", "Conclusion"], "fln": "Report / Article flow", "ph": [["Formal opening", "I beg to state / With due respect / I wish to draw your attention"], ["Request", "I request you to / Kindly grant / I shall be grateful"], ["Formal close", "Yours faithfully / Yours obediently / Thanking you"], ["Informal opening", "I hope this finds you well / I was delighted to hear"], ["Informal close", "Yours affectionately / Your loving friend / With love"], ["Linkers", "Moreover / However / Therefore / In conclusion"]], "pre": ["Write an application to the Principal for ", "Write a letter to the Editor on ", "Write a letter to your friend to ", "Write a descriptive paragraph on ", "Write a report on ", "Write an article on "], "post": " (80–100 words).", "A": [["Sick leave", "I am suffering from high fever since yesterday and the doctor has advised three days' rest", "grant me leave from 10th to 12th July"], ["Fee concession", "my father is a small farmer and cannot pay the full fee", "grant me a fee concession"], ["Transfer certificate", "my father has been transferred to Lucknow", "issue me a transfer certificate"], ["Bonafide certificate", "I need it to open a bank account", "issue me a bonafide certificate"], ["New library books", "our library has very few books on science", "purchase some new books"], ["Sports equipment", "our school team lacks bats, balls and nets", "arrange new sports equipment"], ["Repair of fans", "the fans in our classroom do not work in this hot weather", "get them repaired soon"], ["Scholarship", "I stood first in the class but my family is poor", "recommend me for a scholarship"], ["Change of section", "my friends are in Section B", "shift me to that section"], ["Picnic permission", "the students of Class X wish to visit Agra on a picnic", "permit us to go"], ["Late attendance", "I reached school late because of a train delay", "excuse my late arrival"], ["Early leave", "I have to attend my cousin's engagement", "allow me to leave at 11 a.m."], ["Water cooler", "students suffer from thirst in summer", "install a water cooler"], ["Computer lab", "our lab computers are old and slow", "provide new computers"], ["Ground cleaning", "the playground is full of weeds and stones", "get it cleaned"], ["Duplicate I-card", "I have lost my identity card", "issue me a duplicate card"], ["Mark-sheet correction", "my name is wrongly spelt in the mark-sheet", "correct the mistake"], ["Remedial classes", "several students are weak in mathematics", "arrange extra classes"], ["Leave for sister's wedding", "my sister's marriage is on 5th March", "grant me four days' leave"], ["Grandfather's illness", "my grandfather is seriously ill in the village", "grant me five days' leave"], ["First-aid box", "there is no first-aid facility in our school", "place a first-aid box in the office"], ["Annual function", "we want to hold a cultural programme", "permit us to organise it"], ["Drinking water", "the tap near our class is broken", "arrange pure drinking water"], ["Debate competition", "our class wishes to join an inter-school debate", "permit me to participate"], ["Exemption from games", "I have a leg injury", "exempt me from games for two weeks"], ["Character certificate", "I need it for admission to college", "issue me a character certificate"], ["Reading room", "students have no quiet place to study", "open a reading room"], ["Library fine waiver", "I returned the book late due to illness", "waive my fine"], ["Marks entry", "my Science test marks are not entered", "check the register and enter them"], ["Cycle stand", "our cycles are stolen often", "arrange a cycle stand"], ["NCC enrolment", "I want to serve the nation", "enrol me in the NCC"], ["Science exhibition", "we have prepared working models", "allow us to hold an exhibition"]], "F": [["potholes", "Many roads of our colony are full of deep potholes and cause daily accidents", "repair them without delay"], ["garbage", "Heaps of garbage lie on our streets and spread diseases", "arrange regular cleaning"], ["noise pollution", "Loudspeakers play till late night and disturb students", "ban their use after 10 p.m."], ["water shortage", "Our locality gets no water for days", "ensure regular supply"], ["power cuts", "Frequent power cuts disturb studies and work", "ensure steady supply"], ["stray dogs", "Stray dogs bite children and frighten passers-by", "take strong action"], ["illegal parking", "Vehicles parked on roads cause traffic jams", "fine the offenders"], ["street lights", "Many street lights are out of order and thieves are active", "repair them at once"], ["air pollution", "Smoke from vehicles and factories makes breathing difficult", "check the pollution levels"], ["dengue", "Stagnant water has caused dengue in our area", "spray insecticide quickly"], ["plastic bags", "Plastic bags choke drains and harm cows", "ban their use"], ["traffic jams", "Roads near the market remain blocked all day", "appoint more traffic police"], ["waterlogging", "After rain our streets remain flooded for days", "clear the drains"], ["public toilets", "Our town has no clean public toilets", "build and maintain them"], ["cyber crime", "Many people lose money to online frauds", "run awareness campaigns"], ["road accidents", "Speeding vehicles cause accidents on the highway", "install speed breakers"], ["drug abuse", "Many young men of our area are addicted to drugs", "take strict steps"], ["park neglect", "The park of our colony is full of weeds", "restore it"], ["bus service", "There is no bus service for our village", "start one"], ["sewer blockage", "Open sewers stink and breed mosquitoes", "clean them"]], "I": [["invite you to my brother's wedding", "The wedding is on 2nd December and the functions begin a day earlier. Do come with your family."], ["congratulate you on your success", "I was delighted to learn that you stood first in the board exams. Your hard work has paid off."], ["express my sorrow at your loss", "I was shocked to hear of your grandfather's death. Be brave; we are all with you."], ["tell you about my holiday in Shimla", "The snow-covered hills and cool air were wonderful. We spent a week visiting temples and markets."], ["thank you for the lovely gift", "The wristwatch you sent is beautiful and I wear it daily."], ["advise you to take your studies seriously", "Exams are near, so make a timetable and avoid wasting time."], ["advise you to take care of your health", "Eat fresh food, sleep early and exercise daily."], ["invite you to my birthday party", "It will be held on 9th March at my house with games and cake."], ["describe our school Annual Day", "Students performed dances and plays, and the chief guest gave prizes."], ["tell you about my new school", "My teachers are kind and I have made many friends here."], ["suggest good hobbies", "Reading, gardening and painting make leisure time useful."], ["invite you for Diwali", "We will light lamps, share sweets and burst a few crackers together."], ["describe a visit to a fair", "There were swings, sweets and magic shows; we enjoyed a lot."], ["sympathise with you on your illness", "I hope you recover soon; take proper rest and medicines."], ["advise you to avoid bad company", "Bad friends waste time and spoil habits, so choose friends carefully."], ["tell you about my trip to Agra", "We saw the Taj Mahal, which looked magical in the moonlight."], ["ask for your notes", "I missed classes due to illness and need your English notes."], ["apologise for my rudeness", "I am sorry for my harsh words and promise it will not happen again."], ["share the news of my selection", "I have been selected in the school cricket team and feel very happy."], ["invite you for summer vacation", "Come to my village; we will swim in the river and eat mangoes."]], "Pa": [["My Mother", "My mother is the most loving person in my life. She wakes up early, cooks tasty food and takes care of all of us. She helps me in my studies and teaches me good manners. She is kind, patient and hardworking. I love her very much."], ["My Best Friend", "Rohan is my best friend. He is tall, smart and always smiling. We study and play together. He is honest and helps others in trouble. He is also good at cricket. I am proud to have such a friend."], ["The Taj Mahal", "The Taj Mahal is in Agra, on the bank of the Yamuna. Emperor Shah Jahan built it in memory of his wife Mumtaz Mahal. It is made of white marble and has four tall minarets. It looks magical in moonlight. Millions of tourists visit it every year."], ["The Ganga", "The Ganga is the holiest river of India. It rises from Gangotri in the Himalayas and falls into the Bay of Bengal. Its water irrigates crops and supports millions of people. Hindus bathe in it on festivals. We must keep it clean."], ["My School", "My school is a big and beautiful building. It has spacious classrooms, a library and a playground. Our teachers are kind and hardworking. We celebrate all national festivals here. I am proud of my school."], ["Mahatma Gandhi", "Mahatma Gandhi was born on 2nd October 1869 in Porbandar. He became a barrister but left it to serve the nation. He led non-violent movements and taught truth and simplicity. India got freedom in 1947 under his guidance. We call him the Father of the Nation."], ["A Railway Station", "A railway station is always crowded and noisy. Passengers hurry with luggage while porters carry bags. Vendors sell tea and snacks. Trains arrive and leave with loud whistles. It is a busy and exciting place."], ["A Rainy Day", "It was a rainy day. Dark clouds covered the sky and cool winds blew. Children played in the puddles. The fields looked green and fresh. I enjoyed the day with hot pakoras."], ["Dr A. P. J. Abdul Kalam", "Dr Kalam was born in Rameswaram in 1931. He sold newspapers as a boy and studied hard to become a scientist. He is called the Missile Man of India. He became President in 2002 and inspired the youth. He died in 2015, but he lives in our hearts."], ["Diwali", "Diwali is the festival of lights. People clean and decorate their houses and light lamps. We wear new clothes, share sweets and worship Goddess Lakshmi. It celebrates Lord Rama's return to Ayodhya. It spreads joy and love."]], "R": [["Independence Day Celebrated in XYZ School", "XYZ School celebrated Independence Day on 15th August, 20XX with great joy.", "The Principal hoisted the flag at 8 a.m. and students sang the National Anthem. NCC cadets marched in a parade, and students presented songs, dances and a short play.", "Sweets were distributed and the function ended with the vote of thanks."], ["Annual Function of ABC School", "The Annual Function of ABC Public School was held on 7th March, 20XX.", "The chief guest, the District Magistrate, was welcomed with flowers. Students performed dances and a play. The Principal read the annual report and prizes were given to the winners.", "The function ended with the National Anthem."], ["Election Scene", "On the day of the election, the polling station at our local school was crowded from early morning.", "Long queues of men and women waited to cast their votes. Police were present to keep order, and officers checked identity cards and inked fingers.", "Voting ended peacefully at 6 p.m."], ["A Road Accident", "A serious road accident took place on the Delhi-Meerut highway on 10th May, 20XX.", "A speeding truck hit a car at about 6 p.m. Two persons were injured. Passers-by rushed them to the hospital and the police reached soon.", "The driver was arrested and traffic was cleared."], ["Sports Day", "The Annual Sports Day of our school was held on 12th January, 20XX.", "Students took part in races, long jump and relay. The Principal gave away medals to the winners.", "The day ended with a cheerful tea party."], ["Flood in a Village", "Heavy rain caused a flood in Rampur village on 5th August, 20XX.", "Many houses were damaged and cattle were swept away. Villagers took shelter on rooftops. The administration sent boats and food packets.", "Relief work continued for a week."], ["Blood Donation Camp", "A blood donation camp was organised in our college on 14th June, 20XX.", "More than 100 students and teachers donated blood. Doctors examined each donor and gave fruit juice and biscuits.", "The camp was a great success."], ["Cleanliness Drive", "Our school organised a cleanliness drive on 2nd October, 20XX.", "Students cleaned classrooms, the playground and nearby streets. Dustbins were placed at different points, and a rally spread the message of cleanliness.", "The Principal praised the students' effort."], ["Fire in a Market", "A fire broke out in Gandhi Market on 8th April, 20XX at about midnight.", "Flames spread to many shops. Fire engines reached in time and controlled the fire after three hours. Goods worth lakhs were burnt.", "No loss of life was reported."], ["Republic Day Celebration", "Republic Day was celebrated in our school on 26th January, 20XX.", "The Principal unfurled the tricolour, and students gave a march past. Patriotic songs and speeches filled the hall.", "The programme ended with sweets for all."]], "Ar": [["Importance of Forests", "Forests are the lungs of the earth.", "They give us wood, medicines and fruits, attract rain and stop soil erosion. They are home to wild animals and absorb carbon dioxide.", "We must stop cutting trees and plant more."], ["Mobile Phones: Boon or Bane", "Mobile phones have become a part of our daily life.", "They help us talk, learn and work anywhere. But too much use harms eyes, wastes time and spreads rumours.", "Wise use makes them a boon."], ["Importance of Exercise", "A healthy body needs regular exercise.", "It keeps us fit, improves blood flow and reduces stress. Walking, yoga and games are good options.", "Everyone should exercise daily for at least thirty minutes."], ["Save Water", "Water is essential for all life.", "Yet many areas face shortages because of waste and pollution. We can save it by closing taps, harvesting rain and reusing water.", "Saving water today secures tomorrow."], ["Punctuality", "Punctuality means doing every work on time.", "Punctual people win trust and achieve more. Careless people lose chances and respect.", "Let us make it a habit."], ["Digital India", "Digital India aims to connect every citizen with technology.", "It offers online services, UPI payments and e-learning. It saves time and reduces corruption.", "With care for cyber safety, it will make India strong."], ["Air Pollution", "Air pollution is a serious threat today.", "Smoke from vehicles, factories and burning of crops causes diseases. It also harms the climate.", "Planting trees and using public transport can help."], ["Importance of Reading Books", "Books are our true friends.", "They give knowledge, inspire us and improve language. A good book never leaves us alone.", "Develop the habit of reading daily."], ["Road Safety", "Road accidents are rising every year.", "Over-speeding, drunk driving and ignoring signals are the main causes. Helmets, seat belts and traffic rules can save lives.", "Follow the rules and save lives."], ["Education of Girls", "Educating girls improves the nation.", "An educated girl runs a better home, earns well and helps society. Yet many girls still leave school early.", "Equal chances for girls ensure progress."]], "PR": [["leave for fever", "fee concession", "transfer certificate", "bonafide certificate", "library books", "sports equipment", "broken fans", "scholarship", "change of section", "picnic permission", "late attendance", "early leave for a function", "water cooler", "computer lab", "cleaning the ground", "lost I-card", "mark-sheet correction", "library fine waiver", "hostel seat", "bus pass", "NCC enrolment", "remedial classes", "leave for sister's wedding", "leave for grandfather's illness", "extra maths class", "first-aid box", "stage for annual function", "school uniform", "notice board", "drinking water", "classroom fans", "subject change", "character certificate", "exam centre change", "exemption from games", "debate permission", "separate reading hall", "internet facility", "leave to attend a marriage", "NSS camp permission", "cultural club", "leaking roof", "cancel fine", "science lab reopening", "duplicate mark-sheet"], ["potholes", "garbage on streets", "noise pollution", "water shortage", "power cuts", "stray dogs", "illegal parking", "street lights", "encroachment on footpaths", "traffic jam", "air pollution", "dengue", "plastic ban", "tree plantation", "park maintenance", "bus service", "public toilets", "cheating in exams", "cyber crime", "price rise", "waterlogging", "loudspeakers", "drug abuse", "road accidents", "mosquito spraying", "safe drinking water", "village library", "sewer blockage", "smoking in public", "hospital shortage"], ["invite to a wedding", "invite to a birthday", "congratulate on a result", "condolence", "holiday tour", "thank for a gift", "advise to study", "advise on health", "visit to a fair", "describe a school function", "new school experience", "suggest hobbies", "ask for notes", "apologise", "invite for a festival", "congratulate on a prize", "describe your village", "sympathise on illness", "advise to quit a bad habit", "trip to Agra", "thank a host", "invite for Diwali", "describe Independence Day", "recommend a book", "share selection news", "ask for career advice", "describe the monsoon", "describe Sports Day", "science exhibition", "encourage after failure", "ask for photographs", "congratulate on marriage", "tell about exams", "advise to avoid too much TV", "invite for summer vacation"], ["My mother", "My best friend", "My teacher", "My school", "My village", "A market", "The Taj Mahal", "The Ganga", "A railway station", "A hospital", "My hobby", "Diwali", "Holi", "My city", "A garden", "A library", "Mahatma Gandhi", "Dr Kalam", "Sardar Patel", "Subhash Chandra Bose", "Rani Laxmibai", "Lal Bahadur Shastri", "My favourite game", "A cricket match", "A rainy day", "A bus stand", "A fair", "A computer", "A cow", "A mango tree"], ["Independence Day", "Annual function", "Election scene", "Sports Day", "Republic Day", "A road accident", "A flood", "Fire in a market", "Science exhibition", "Cultural fest", "Blood donation camp", "Tree plantation drive", "Teachers' Day", "Children's Day", "Debate competition", "Farewell party", "Cleanliness drive", "A village fair", "A cricket match", "Yoga Day", "Seminar on pollution", "Voting rally", "Visit to a zoo", "School picnic", "Kavi sammelan", "An earthquake", "Road safety week", "Quiz competition", "Book fair", "Gandhi Jayanti"], ["Importance of forests", "Mobile phones", "The internet", "Exercise", "Punctuality", "Discipline", "Honesty", "Pollution", "Save water", "Plastic", "Education of girls", "Digital India", "Swachh Bharat", "Unemployment", "Corruption", "Social media", "Time management", "Value of books", "National integration", "Road safety", "Population", "Sports", "Healthy food", "Yoga", "Saving electricity", "Global warming", "Cyber crime", "Role of a teacher", "Festivals", "Save the girl child", "Trees", "Women empowerment", "Value of sports", "Electricity", "Science: boon or bane"]], "topics": ["Letter to Health Officer", "Wedding invitation to a friend", "Application: library books", "Importance of exercise", "Mobile phones: uses & misuses", "A birthday party", "A visit to a zoo", "Importance of the internet", "Independence Day report", "Annual function report", "Election scene", "Importance of forests", "Role model / My father", "Stephen Hawking", "Pt. Nehru"]};let o="";const S=(i,t)=>`<section><h2>${i+1}. ${D.h[i]}</h2>${t}</section>`;const lb=D.lb;
const R=r=>`<div class="lt">${r.map(x=>`<div class="lb">${x[0]}</div><div class="tx">${x[1]}</div>`).join("")}</div>`;
const G=(n,k,a,f)=>`<details><summary>${D.fn[k]} (${a.length})</summary>${a.map((e,i)=>`<details><summary>${i+1}. ${f[0](e)}</summary>${f[1](e)}</details>`).join("")}</details>`;
const SA=[lb[0],"12, Gandhi Nagar<br>Ghaziabad, UP"],DT=[lb[1],"9th March, 20XX"];
const P=(t,a,by)=>`<div class="pp"><h4>${t}</h4>${by?`<p style="text-align:center">by XYZ</p>`:""}${a.map(x=>`<p>${x}</p>`).join("")}</div>`;
o+=S(0,`<div class="fl">${D.topics.map(t=>`<span class="ch">${t}</span>`).join("")}</div>`);

const ap=a=>R([DT,[lb[2],"The Principal<br>ABC Inter College<br>Agra"],[lb[3],"<b>Subject:</b> "+a[0]],[lb[4],"Sir/Madam,"],[lb[5],`With due respect, I beg to state that ${a[1]}. I therefore request you to ${a[2]}. I shall be grateful to you.`],[lb[6],"Yours obediently,"],[lb[7],"ABC"]]);
