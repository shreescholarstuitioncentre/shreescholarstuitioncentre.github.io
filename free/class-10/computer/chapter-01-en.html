<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 10 Computer – One Page Revision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
code{font:.88em Consolas,monospace;background:color-mix(in srgb,var(--c) 12%,transparent);padding:1px 5px;border-radius:5px;word-break:break-word}.bars{display:flex;align-items:flex-end;height:150px;gap:6px;margin:8px 0}.bars div{flex:1;background:var(--c);border-radius:6px 6px 0 0;transition:height .3s,background .2s;color:#fff;text-align:center;font-size:.8rem}.bt{font:inherit;border:0;background:var(--c);color:#fff;border-radius:99px;padding:6px 16px;margin:2px;cursor:pointer}.cells{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.cells div{flex:1;min-width:52px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:4px;transition:.25s}.cells div.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);transform:translateY(-6px)}.cells small{display:block;color:var(--mut);font-size:.7rem}footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button id="th" aria-label="theme">🌓</button><h1>💻 Class 10 Computer – Revision</h1><p>SSTC Computer · All 10 chapters · Tap, play, revise!</p><div class="bar"><i id="pb"></i></div><div id="pt"></div></header>
<nav id="nav"></nav><main id="main"></main><canvas id="cf"></canvas><footer>SSTC Computer · Class 10 · Quick Revision</footer>
<script>
var D={"ui": {"prog": "Revised: {n}/10 chapters", "win": "🎉 Brilliant! All 10 chapters revised!", "quiz": "🧠 Quick Quiz (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w2": "📊 Bubble Sort Visualizer", "sort": "▶ Sort", "shuf": "🔀 Shuffle", "w2n": "Press Sort and watch neighbours compare and swap.", "sd": "✅ Sorted in ascending order!", "cmp": "Comparing", "w4": "👉 Pointer Explorer", "w4n": "Slide to move pointer p across the array (int = 4 bytes)."}, "ch": [{"s": "Functions", "t": "Functions in C", "k": [["Syntax", "<code>int add(int a,int b){ return a+b; }</code> – return type, name, parameters, body."], ["Types", "<b>Library</b> (printf, sqrt) and <b>user-defined</b>. Steps: declaration (prototype) → definition → call."], ["Call & Recursion", "<b>Call by value</b> copies data; <b>call by reference</b> uses address. <b>Recursion</b> = function calling itself (needs a base case)."]], "q": [["What does void mean?", "The function returns nothing."], ["Which call method changes the original value?", "Call by reference."]]}, {"s": "Arrays", "t": "Arrays in C", "k": [["Declaration", "<code>int a[5];</code> – same-type elements in <b>continuous memory</b>."], ["Index", "Starts at <b>0</b>; last element is <code>a[n-1]</code>. Init: <code>int a[3]={1,2,3};</code>"], ["2-D Array", "<code>int m[2][3];</code> – rows × columns; use nested <code>for</code> loops."]], "q": [["Index of first element?", "0."], ["Elements in int m[3][4]?", "12."]]}, {"s": "Searching & Sorting", "t": "Searching and Sorting Techniques", "k": [["Linear Search", "Checks each element one by one; works on <b>any</b> list."], ["Binary Search", "Needs a <b>sorted</b> list; <code>mid=(low+high)/2</code>; halves the range each step – much faster."], ["Sorting", "<b>Bubble</b> (swap neighbours), <b>Selection</b> (pick minimum), <b>Insertion</b> (insert in place)."]], "q": [["Binary search needs?", "A sorted array."], ["Bubble sort swaps what?", "Adjacent elements if out of order."]]}, {"s": "Structure & Union", "t": "Structures and Union", "k": [["Structure", "<code>struct student{int roll; char name[20];};</code> groups <b>different</b> data types; access with <b>dot (.)</b>."], ["Union", "<code>union</code> – all members <b>share the same memory</b>; size = largest member."], ["Difference", "Structure: every member has own memory. Union: only one member holds value at a time."]], "q": [["Operator to access member?", "Dot operator (.)."], ["Which saves memory?", "Union."]]}, {"s": "Pointers & Files", "t": "Pointers and File Handling", "k": [["Pointers", "<code>int *p=&amp;x;</code> – <b>&amp;</b> gives address, <b>*</b> gives value at address."], ["File Modes", "<code>FILE *fp=fopen(\"a.txt\",\"r\");</code> – <b>r</b> read, <b>w</b> write, <b>a</b> append, r+/w+."], ["File Functions", "<code>fprintf, fscanf, fgetc, fputc, fclose(fp)</code>. Always close the file; EOF marks end."]], "q": [["What does a pointer store?", "Address of a variable."], ["Mode to add data at end?", "a (append)."]]}, {"s": "Intro to AI", "t": "Artificial Intelligence – Introduction, Types and Applications", "k": [["Meaning", "Machines that <b>simulate human intelligence</b>: learning, reasoning, decision-making."], ["Types", "<b>Narrow/Weak AI</b> (today's), <b>General/Strong AI</b>, <b>Super AI</b> (theoretical)."], ["Applications", "Chatbots, healthcare, self-driving cars, face recognition, recommendations. Fields: ML, NLP, computer vision, robotics."]], "q": [["Which AI exists today?", "Narrow (weak) AI."], ["Full form of NLP?", "Natural Language Processing."]]}, {"s": "Drone / UAV", "t": "Drone / UAV Technology", "k": [["Meaning", "<b>Unmanned Aerial Vehicle</b> flown remotely or autonomously."], ["Parts", "Frame, motors, propellers, <b>ESC</b>, <b>flight controller</b>, battery, GPS, camera, remote."], ["Uses & Types", "Agriculture, survey, delivery, photography, defence. Types: multirotor, fixed-wing, hybrid. India: <b>Drone Rules 2021</b>."]], "q": [["UAV full form?", "Unmanned Aerial Vehicle."], ["Brain of a drone?", "Flight controller."]]}, {"s": "E-Commerce & E-Governance", "t": "E-Commerce and E-Governance", "k": [["E-Commerce", "Buying/selling online. Models: <b>B2B, B2C, C2C, C2B</b>. Payments: UPI, cards, net banking."], ["E-Governance", "Govt services online: <b>G2C, G2B, G2G, G2E</b>. Examples: <b>DigiLocker, UMANG</b>, e-District."], ["Benefits", "Saves time and cost, brings transparency, 24×7 access, less corruption."]], "q": [["Amazon selling to customers is?", "B2C."], ["DigiLocker is an example of?", "E-governance."]]}, {"s": "Cyber Crime", "t": "Cyber Crimes and Security", "k": [["Crimes", "<b>Hacking, phishing, identity theft, cyberbullying, ransomware, malware, online fraud.</b>"], ["Safety", "Strong passwords, <b>two-factor authentication</b>, antivirus, firewall, updates; don't share OTP or click unknown links."], ["Law & Help", "<b>IT Act 2000</b>; report at <b>cybercrime.gov.in</b> or helpline <b>1930</b>."]], "q": [["What is phishing?", "Fake messages/sites that steal your data."], ["Cyber crime helpline?", "1930."]]}, {"s": "C Programs", "t": "Programs Based on C Language", "k": [["Basics", "Start with <code>#include &lt;stdio.h&gt;</code> and <code>int main(){ ... return 0; }</code>."], ["Common programs", "Factorial, Fibonacci, prime check, palindrome, swap, largest of three, array sum/average."], ["Factorial", "<code>for(i=1;i&lt;=n;i++) f=f*i;</code> – initialise <code>f=1</code>."]], "q": [["Header for printf?", "stdio.h"], ["Starting value of f in factorial?", "1."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
var $=function(s){return document.querySelector(s)};
$("#th").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
function nav(){$("#nav").innerHTML=D.ch.map(function(c,i){return '<button aria-pressed="'+(i==cur)+'" class="'+(done[i]?"ok":"")+'" data-i="'+i+'" style="'+(i==cur?"--c:"+cols[i]:"")+'">'+(i+1)+'. '+c.s+'</button>'}).join("");
 [].forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){cur=+b.dataset.i;show()}});
 var n=Object.keys(done).length;$("#pb").style.width=n/D.ch.length*100+"%";$("#pt").textContent=D.ui.prog.replace("{n}",n)}
var arr=[5,3,8,1,9,2],busy=0;
function widget(i){var u=D.ui;
 if(i==2)return '<h3 class="s">'+u.w2+'</h3><div class="w"><div class="bars" id="bars"></div><button class="bt" id="sb">'+u.sort+'</button><button class="bt" id="sh">'+u.shuf+'</button><p id="sm" style="color:var(--mut);margin:.3em 0 0">'+u.w2n+'</p></div>';
 if(i==4)return '<h3 class="s">'+u.w4+'</h3><div class="w"><div class="cells" id="cl"></div><input type="range" id="pi" min="0" max="4" value="0" aria-label="pointer"><p id="pm" style="margin:.4em 0;font-weight:600"></p><p style="color:var(--mut);margin:0">'+u.w4n+'</p></div>';
 return ""}
function draw(h,x){$("#bars").innerHTML=arr.map(function(v,j){return '<div style="height:'+v*14+'px;'+(h&&h.indexOf(j)>-1?'background:#f2a900':'')+'">'+v+'</div>'}).join("")}
function wire(i){var u=D.ui;
 if(i==2){draw();$("#sh").onclick=function(){if(busy)return;arr=[1,2,3,4,5,6,7,8,9].sort(function(){return Math.random()-.5}).slice(0,6);draw();$("#sm").textContent=u.w2n};
  $("#sb").onclick=function(){if(busy)return;busy=1;var a=arr.slice(),st=[],n=a.length,j,k;for(j=0;j<n-1;j++)for(k=0;k<n-1-j;k++){st.push([k,k+1,a[k]>a[k+1]]);if(a[k]>a[k+1]){var t=a[k];a[k]=a[k+1];a[k+1]=t}}
   var p=0;(function go(){if(p>=st.length||!$("#bars")){busy=0;if($("#bars")){draw();$("#sm").textContent=u.sd}return}var s=st[p++];if(s[2]){var t=arr[s[0]];arr[s[0]]=arr[s[1]];arr[s[1]]=t}draw([s[0],s[1]]);$("#sm").textContent=u.cmp+" "+arr[s[0]]+" , "+arr[s[1]];setTimeout(go,350)})()}}
 if(i==4){var v=[10,20,30,40,50];$("#pi").oninput=function(){var k=+this.value;$("#cl").innerHTML=v.map(function(x,j){return '<div class="'+(j==k?"on":"")+'">'+x+'<small>a['+j+']</small><small>'+(1000+4*j)+'</small></div>'}).join("");$("#pm").innerHTML="<code>p = &amp;a["+k+"]</code> → <code>p = "+(1000+4*k)+"</code>, <code>*p = "+v[k]+"</code>"};$("#pi").oninput()}}
function show(){var c=D.ch[cur],col=cols[cur];nav();
 $("#main").innerHTML='<section style="--c:'+col+'"><h2>'+(cur+1)+'. '+c.t+'</h2><div class="grid">'+c.k.map(function(p,j){return '<div class="card" style="animation-delay:'+j*.08+'s"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>'}).join("")+'</div>'+widget(cur)+'<h3 class="s">'+D.ui.quiz+'</h3>'+c.q.map(function(q){return '<button class="q"><b>❓ '+q[0]+'</b><div class="a">✅ '+q[1]+'</div></button>'}).join("")+'<button class="done '+(done[cur]?"y":"")+'">'+(done[cur]?D.ui.dn:D.ui.mk)+'</button></section>';
 [].forEach.call(document.querySelectorAll(".q"),function(b){b.onclick=function(){b.classList.toggle("o")}});
 $(".done").onclick=function(){if(done[cur])delete done[cur];else{done[cur]=1;if(Object.keys(done).length==D.ch.length)boom()}show()};wire(cur)}
function boom(){var cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;var p=[];for(var i=0;i<140;i++)p.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14,c:cols[i%8]});var t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.vy+=.4;x.fillStyle=q.c;x.fillRect(q.x,q.y,7,7)});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();$("#pt").textContent=D.ui.win}
show();
</script></body></html>
