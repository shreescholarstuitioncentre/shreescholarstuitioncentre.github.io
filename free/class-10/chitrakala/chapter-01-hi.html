 if(i==2)return '<h3 class="s">'+u.w2+'</h3><div class="w"><svg viewBox="0 0 400 200"><rect width="400" height="90" fill="#8fd0ff"/><rect y="90" width="400" height="110" fill="#7cc06a"/><circle cx="340" cy="30" r="18" fill="#ffd33d"><animate attributeName="r" values="18;21;18" dur="3s" repeatCount="indefinite"/></circle><line x1="0" y1="90" x2="400" y2="90" stroke="#241b3a" stroke-width="2"/><path d="M175 200L200 90M225 200L200 90" class="rd" stroke="#241b3a" fill="none"/><path d="M0 200L200 90M400 200L200 90" stroke="#241b3a" stroke-dasharray="4 4" fill="none" opacity=".5"/><circle cx="200" cy="90" r="5" fill="#e0452f"><animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/></circle><text x="206" y="82">'+u.vp+'</text><text x="6" y="84">'+u.hz+'</text><text x="6" y="190">'+u.fg+'</text><text x="6" y="115">'+u.mg+'</text><text x="260" y="70">'+u.bg+'</text></svg></div>';
 if(i==6)return '<h3 class="s">'+u.w6+'</h3><div class="w"><svg viewBox="0 0 400 220"><defs><radialGradient id="g" cx=".5" cy=".5" r=".6" fx=".3" fy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#aaa"/><stop offset=".85" stop-color="#333"/><stop offset="1" stop-color="#555"/></radialGradient></defs><ellipse id="cs" cx="240" cy="190" rx="70" ry="14" fill="#000" opacity=".35"/><circle cx="200" cy="105" r="75" fill="url(#g)"/><text id="ls" x="20" y="24">☀</text></svg><input type="range" id="ang" min="0" max="360" value="315" aria-label="light"><p style="color:var(--mut);margin:.3em 0 0">'+u.w6n+'</p></div>';
 return ""}
function wire(i){
 if(i==0){var s={};[].forEach.call(document.querySelectorAll(".sw"),function(b){b.onclick=function(){var k=b.dataset.k;s[k]=!s[k];b.setAttribute("aria-pressed",!!s[k]);var key=["R","Y","B"].filter(function(x){return s[x]}).join("");$("#res").style.background=key?mix[key]:"#ddd";$("#rn").textContent=key?D.cm[key]:D.ui.pick;var r=$("#res");r.style.animation="none";r.offsetWidth;r.style.animation=""}})}
 if(i==6){$("#ang").oninput=function(){var a=this.value*Math.PI/180,x=.5+.5*Math.cos(a)*.8,y=.5-.5*Math.sin(a)*.8;document.querySelector("#g").setAttribute("fx",x);document.querySelector("#g").setAttribute("fy",y);var c=$("#cs");c.setAttribute("cx",200-Math.cos(a)*85);c.setAttribute("cy",190);$("#ls").setAttribute("x",200+Math.cos(a)*150-8);$("#ls").setAttribute("y",105-Math.sin(a)*100+8)};$("#ang").oninput()}}
function show(){var c=D.ch[cur],col=cols[cur];nav();
 $("#main").innerHTML='<section style="--c:'+col+'"><h2>'+(cur+1)+'. '+c.t+'</h2><div class="grid">'+c.k.map(function(p,j){return '<div class="card" style="animation-delay:'+j*.08+'s"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>'}).join("")+'</div>'+widget(cur)+'<h3 class="s">'+D.ui.quiz+'</h3>'+c.q.map(function(q){return '<button class="q"><b>❓ '+q[0]+'</b><div class="a">✅ '+q[1]+'</div></button>'}).join("")+'<button class="done '+(done[cur]?"y":"")+'">'+(done[cur]?D.ui.dn:D.ui.mk)+'</button></section>';
 [].forEach.call(document.querySelectorAll(".q"),function(b){b.onclick=function(){b.classList.toggle("o")}});
 $(".done").onclick=function(){if(done[cur])delete done[cur];else{done[cur]=1;if(Object.keys(done).length==8)boom()}show()};wire(cur)}

show();
