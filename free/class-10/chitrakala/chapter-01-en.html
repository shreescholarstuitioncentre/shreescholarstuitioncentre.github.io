<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 10 Art (Chitrakala) – One Page Revision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;600&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#241b3a;--mut:#6b6482;--line:#e5dcc8;--c:#e0452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112a;--card:#201a3b;--ink:#f3effa;--mut:#aaa3c6;--line:#342d58;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Hind,system-ui,sans-serif;transition:background .4s}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0;line-height:1.15}
header{max-width:1000px;margin:auto;padding:28px 16px 12px;position:relative}
h1{font-size:clamp(1.9rem,6vw,3.3rem);font-weight:800;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc,#e0452f);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:g 8s linear infinite}
@keyframes g{to{background-position:300%}}
header p{color:var(--mut);margin:.4em 0 10px}
#th{position:absolute;right:16px;top:24px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-size:1.1rem;padding:4px 10px;cursor:pointer}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0452f,#f2a900,#2e9e5b,#2a6fdb,#8a3ffc);transition:width .6s}
#pt{font-size:.9rem;color:var(--mut);margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;padding:4px 12px;border-radius:99px;cursor:pointer;transition:.2s}
nav button:hover{transform:translateY(-2px)}nav button.ok::after{content:" ✓"}
nav button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:16px}
h2{font-size:clamp(1.5rem,4vw,2.3rem);color:var(--c);margin-bottom:12px;animation:in .5s both}
h3.s{margin:22px 0 8px;font-size:1.25rem}
.grid{columns:290px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;margin:0 0 14px;animation:in .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.card h3{font-size:1.05rem;color:var(--c)}.card p{margin:.3em 0}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.w{background:var(--card);border:1.5px dashed var(--c);border-radius:14px;padding:12px 14px;animation:in .6s both}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;vertical-align:middle;margin:3px;transition:.25s}
.sw[aria-pressed=true]{transform:scale(1.25);border-color:var(--ink)}
#res{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid var(--ink);margin:8px;vertical-align:middle;transition:background .5s;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.q{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;cursor:pointer}
.q:hover{border-color:var(--c)}.q b{color:var(--c)}
.q .a{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);animation:in .4s}.q.o .a{display:block}
.done{margin:18px 0;font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:99px;background:var(--c);color:#fff;cursor:pointer;transition:.2s}.done:hover{transform:scale(1.05)}
.done.y{background:#2e9e5b}
svg{width:100%;max-width:460px;height:auto;display:block;margin:6px auto}
svg text{fill:var(--ink);font:12px Hind,sans-serif}
.rd{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:10 9;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-19}}
input[type=range]{width:100%;accent-color:var(--c)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
footer{text-align:center;color:var(--mut);padding:18px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button id="th" aria-label="theme">🌓</button><h1>🎨 Class 10 Chitrakala – Revision</h1><p>SSTC Chitrakala · All 8 chapters · Tap, play, revise!</p><div class="bar"><i id="pb"></i></div><div id="pt"></div></header>
<nav id="nav"></nav><main id="main"></main><canvas id="cf"></canvas><footer>SSTC Chitrakala · Class 10 · Quick Revision</footer>
<script>
var D={"ui": {"prog": "Revised: {n}/8 chapters", "win": "🎉 Fantastic! All chapters revised!", "quiz": "🧠 Quick Quiz (tap to reveal)", "mk": "☐ Mark chapter as revised", "dn": "✅ Revised! (tap to undo)", "w0": "🎨 Colour Mixer", "pick": "Pick colours to mix", "w0n": "Tap 2 primaries to get a secondary colour.", "w2": "📐 Perspective Explorer", "vp": "Vanishing point", "hz": "Horizon line", "fg": "Foreground", "mg": "Middle ground", "bg": "Background", "w6": "💡 Light & Shadow Lab", "w6n": "Move the slider: the light spot and the cast shadow always sit on opposite sides."}, "cn": ["Red", "Yellow", "Blue"], "cm": {"R": "Red (Primary)", "Y": "Yellow (Primary)", "B": "Blue (Primary)", "RY": "Orange = Red + Yellow", "YB": "Green = Yellow + Blue", "RB": "Violet = Red + Blue", "RYB": "Dull brown/grey = all three"}, "ch": [{"s": "Elements & Colour", "t": "Elements of Art & Colour Theory", "k": [["Elements of Art", "<b>Line, shape, form, colour, texture, space, tone (value)</b> – the building blocks of every artwork."], ["Colour Wheel", "<b>Primary:</b> Red, Yellow, Blue. <b>Secondary:</b> Orange, Green, Violet (mix of two primaries). <b>Tertiary:</b> primary + neighbouring secondary, e.g. yellow-green."], ["Complementary Colours", "Opposite on the wheel: <b>Red–Green, Yellow–Violet, Blue–Orange</b>. Side by side they look vivid."], ["Warm & Cool", "<b>Warm:</b> red, orange, yellow (advance). <b>Cool:</b> blue, green, violet (recede)."], ["Colour Qualities", "<b>Hue</b> = name of colour, <b>Value</b> = lightness/darkness, <b>Intensity</b> = purity/brightness."], ["Colour Schemes", "<b>Monochromatic</b> (one hue), <b>Analogous</b> (neighbours), <b>Complementary</b> (opposites)."]], "q": [["Which colours are primary?", "Red, Yellow and Blue."], ["Complement of orange?", "Blue."]]}, {"s": "Core Practical", "t": "Choice of Core Practical Art", "k": [["What to choose?", "Pick <b>one</b> core art you are strongest in: Natural Landscape, Aalekhan (Ornamental) or Pravaidhik (Technical)."], ["Exam Strategy", "Read the question, plan time, draw a light layout first, colour last, keep the sheet clean."], ["Composition", "Place the main subject well, balance the page, leave neat margins, use the whole sheet."], ["Colours & Tools", "Practise your medium (poster/water colour) and keep brushes, pencil, eraser, scale ready."]], "q": [["How many core arts must you choose?", "One – the one you can draw best."], ["Should you colour first or sketch first?", "Sketch lightly first, colour afterwards."]]}, {"s": "Landscape", "t": "Natural Landscape Drawing", "k": [["Three Planes", "<b>Foreground</b> (near, big, detailed), <b>Middle ground</b>, <b>Background</b> (far, small, faint)."], ["Perspective", "Parallel lines (road, river) appear to meet at the <b>vanishing point</b> on the <b>horizon line</b>."], ["Aerial Perspective", "Distant things look <b>lighter, bluish and less detailed</b>; near things darker and sharper."], ["Steps", "1) Horizon & layout 2) Sky 3) Hills/trees/water 4) Foreground details 5) Final touches."]], "q": [["Where do parallel lines appear to meet?", "At the vanishing point on the horizon."], ["How do far objects look?", "Smaller, lighter, bluish."]]}, {"s": "Aalekhan", "t": "Aalekhan (Ornamental Design)", "k": [["Meaning", "Decorative, flat, patterned designs made from flowers, leaves, birds or geometric motifs."], ["Principles", "<b>Repetition, rhythm, symmetry, balance, harmony.</b>"], ["Types", "<b>Border</b>, <b>corner</b> and <b>centre/all-over</b> designs within a square, circle or rectangle."], ["Colouring", "Use 2–3 harmonious flat colours, no shading, and finish with neat dark outlines."]], "q": [["Is shading used in Aalekhan?", "No – flat colours only."], ["Name 3 types of design", "Border, corner, centre/all-over."]]}, {"s": "Pravaidhik", "t": "Pravaidhik (Technical / Geometric Art)", "k": [["Instruments", "Scale, set squares, compass, divider, protractor and sharp pencils."], ["Constructions", "Perpendicular, angle bisector, triangles, polygons, circles and tangents."], ["Views", "<b>Front view, top view, side view</b> – plans and elevations drawn to a scale."], ["Accuracy", "Thin construction lines, bold final lines, correct measurements, neat labelling."]], "q": [["Why keep construction lines light?", "So the final figure stands out and the sheet stays neat."], ["Name the 3 views", "Front, top and side."]]}, {"s": "Memory / Indian Art", "t": "Memory Drawing OR Indian Art", "k": [["Memory Drawing", "Draw from observation & imagination: fair (mela), market, festival, village life, sports."], ["Composition", "Use a clear focal point, group of figures of different sizes, background and sky."], ["Figures", "Use simple proportion: about 7–8 heads tall for adults; show action and gesture."], ["Choose One", "Pick either Memory Drawing or the Indian Art option as your syllabus requires."]], "q": [["What is memory drawing?", "Drawing a scene from memory and imagination."], ["Key to a good composition?", "A clear focal point and balanced arrangement."]]}, {"s": "Pencil Shading", "t": "Memory Drawing – Pencil Shading", "k": [["Light & Shade", "<b>Highlight, halftone, core shadow, reflected light, cast shadow.</b>"], ["Techniques", "<b>Hatching, cross-hatching, stippling, blending.</b>"], ["Pencils", "HB for outline, 2B–4B for mid tones, 6B for darkest shadows."], ["Practice", "Shade basic forms: <b>sphere, cube, cylinder, cone</b>, then fruit and objects."]], "q": [["Where does the cast shadow fall?", "Opposite to the light source."], ["Which pencil for darkest tone?", "6B (soft)."]]}, {"s": "History of Art", "t": "History of Indian Art (Theory)", "k": [["Prehistoric", "<b>Bhimbetka</b> rock paintings (Madhya Pradesh) – hunting and dance scenes."], ["Indus & Mauryan", "Seals and bronze Dancing Girl (Indus); <b>Ashoka Pillar / Sarnath Lion Capital</b> (Mauryan)."], ["Ajanta & Ellora", "Ajanta – Buddhist murals, Jataka tales, <b>Padmapani</b>. Ellora – rock-cut temples."], ["Miniature Schools", "Mughal (Akbar, Jahangir), Rajasthani, Pahari (Kangra)."], ["Modern Art", "Raja Ravi Varma, Bengal School (<b>Abanindranath Tagore, Nandalal Bose</b>), Amrita Sher-Gil."]], "q": [["Where are Bhimbetka paintings?", "Madhya Pradesh."], ["Founder of Bengal School?", "Abanindranath Tagore."]]}]},cols=["#e0452f","#d9830b","#2e9e5b","#c2398a","#2a6fdb","#8a3ffc","#0f9aa8","#a0522d"],cur=0,done={};
var $=function(s){return document.querySelector(s)};
$("#th").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
function nav(){$("#nav").innerHTML=D.ch.map(function(c,i){return '<button aria-pressed="'+(i==cur)+'" class="'+(done[i]?"ok":"")+'" data-i="'+i+'" style="'+(i==cur?"--c:"+cols[i]:"")+'">'+(i+1)+'. '+c.s+'</button>'}).join("");
 [].forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){cur=+b.dataset.i;show()}});
 var n=Object.keys(done).length;$("#pb").style.width=n/8*100+"%";$("#pt").textContent=D.ui.prog.replace("{n}",n)}
var mix={"R":"#e0252a","Y":"#ffd800","B":"#1f55d6","RY":"#ff7a00","YB":"#2e9e3b","RB":"#7a2bbf","RYB":"#6b4a35"};
function widget(i){var u=D.ui;
 if(i==0)return '<h3 class="s">'+u.w0+'</h3><div class="w"><div>'+["R","Y","B"].map(function(k,j){return '<button class="sw" data-k="'+k+'" aria-pressed="false" aria-label="'+D.cn[j]+'" style="background:'+mix[k]+'"></button>'}).join("")+'<span id="res" style="background:#ddd"></span><b id="rn">'+u.pick+'</b></div><p style="color:var(--mut);margin:.3em 0 0">'+u.w0n+'</p></div>';
 if(i==2)return '<h3 class="s">'+u.w2+'</h3><div class="w"><svg viewBox="0 0 400 200"><rect width="400" height="90" fill="#8fd0ff"/><rect y="90" width="400" height="110" fill="#7cc06a"/><circle cx="340" cy="30" r="18" fill="#ffd33d"><animate attributeName="r" values="18;21;18" dur="3s" repeatCount="indefinite"/></circle><line x1="0" y1="90" x2="400" y2="90" stroke="#241b3a" stroke-width="2"/><path d="M175 200L200 90M225 200L200 90" class="rd" stroke="#241b3a" fill="none"/><path d="M0 200L200 90M400 200L200 90" stroke="#241b3a" stroke-dasharray="4 4" fill="none" opacity=".5"/><circle cx="200" cy="90" r="5" fill="#e0452f"><animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/></circle><text x="206" y="82">'+u.vp+'</text><text x="6" y="84">'+u.hz+'</text><text x="6" y="190">'+u.fg+'</text><text x="6" y="115">'+u.mg+'</text><text x="260" y="70">'+u.bg+'</text></svg></div>';
 if(i==6)return '<h3 class="s">'+u.w6+'</h3><div class="w"><svg viewBox="0 0 400 220"><defs><radialGradient id="g" cx=".5" cy=".5" r=".6" fx=".3" fy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#aaa"/><stop offset=".85" stop-color="#333"/><stop offset="1" stop-color="#555"/></radialGradient></defs><ellipse id="cs" cx="240" cy="190" rx="70" ry="14" fill="#000" opacity=".35"/><circle cx="200" cy="105" r="75" fill="url(#g)"/><text id="ls" x="20" y="24">☀</text></svg><input type="range" id="ang" min="0" max="360" value="315" aria-label="light"><p style="color:var(--mut);margin:.3em 0 0">'+u.w6n+'</p></div>';
 return ""}
function wire(i){
 if(i==0){var s={};[].forEach.call(document.querySelectorAll(".sw"),function(b){b.onclick=function(){var k=b.dataset.k;s[k]=!s[k];b.setAttribute("aria-pressed",!!s[k]);var key=["R","Y","B"].filter(function(x){return s[x]}).join("");$("#res").style.background=key?mix[key]:"#ddd";$("#rn").textContent=key?D.cm[key]:D.ui.pick;var r=$("#res");r.style.animation="none";r.offsetWidth;r.style.animation=""}})}
 if(i==6){$("#ang").oninput=function(){var a=this.value*Math.PI/180,x=.5+.5*Math.cos(a)*.8,y=.5-.5*Math.sin(a)*.8;document.querySelector("#g").setAttribute("fx",x);document.querySelector("#g").setAttribute("fy",y);var c=$("#cs");c.setAttribute("cx",200-Math.cos(a)*85);c.setAttribute("cy",190);$("#ls").setAttribute("x",200+Math.cos(a)*150-8);$("#ls").setAttribute("y",105-Math.sin(a)*100+8)};$("#ang").oninput()}}
function show(){var c=D.ch[cur],col=cols[cur];nav();
 $("#main").innerHTML='<section style="--c:'+col+'"><h2>'+(cur+1)+'. '+c.t+'</h2><div class="grid">'+c.k.map(function(p,j){return '<div class="card" style="animation-delay:'+j*.08+'s"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>'}).join("")+'</div>'+widget(cur)+'<h3 class="s">'+D.ui.quiz+'</h3>'+c.q.map(function(q){return '<button class="q"><b>❓ '+q[0]+'</b><div class="a">✅ '+q[1]+'</div></button>'}).join("")+'<button class="done '+(done[cur]?"y":"")+'">'+(done[cur]?D.ui.dn:D.ui.mk)+'</button></section>';
 [].forEach.call(document.querySelectorAll(".q"),function(b){b.onclick=function(){b.classList.toggle("o")}});
 $(".done").onclick=function(){if(done[cur])delete done[cur];else{done[cur]=1;if(Object.keys(done).length==8)boom()}show()};wire(cur)}
function boom(){var cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;var p=[];for(var i=0;i<140;i++)p.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14,c:cols[i%8]});var t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.vy+=.4;x.fillStyle=q.c;x.fillRect(q.x,q.y,7,7)});if(++t<110)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();$("#pt").textContent=D.ui.win}
show();
</script></body></html>
